ní bolesti, dušnosti a psychickou i duchovní podporu umírajícího a rodiny.",practicalTip:"Důležité je nenechat umírajícího seniora o samotě, zvlhčovat mu rty a respektovat jeho přání."},{id:"g-hyperglykemie",term:"Hyperglykémie",category:"První pomoc a hygiena",definition:"Vysoká hladina cukru v krvi (dlouhodobě či výrazně nad normu). Nástup je pomalejší: velká žízeň, časté močení, suchá kůže, zápach acetonu z úst.",practicalTip:"Rozlište ji od rychlé hypoglykémie! Pokud si nejste jistí, co se děje, a klient je při vědomí, rozhoduje měření glukometrem sestrou."},{id:"g-hypoglykemie",term:"Hypoglykémie",category:"První pomoc a hygiena",definition:"Nebezpečný pokles hladiny cukru v krvi (pod 3,9 mmol/l). Rychlý nástup: třes, studený pot, slabost, zmatenost až bezvědomí.",practicalTip:"Pokud je klient při vědomí a polyká, okamžitě podejte rychlý cukr (sladký džus, čaj, hroznový cukr) a přivolejte sestru. V bezvědomí nic do úst nelijte!"},{id:"g-imobilizacni-syndrom",term:"Imobilizační syndrom",category:"Ošetřovatelství",definition:"Soubor závažných komplikací vznikajících z dlouhodobé nehybnosti na lůžku: dekubity, svalová atrofie, kontraktury, zácpa, zápal plic, trombóza a deprese.",practicalTip:"Nejlepší prevencí je i malé zapojení do pohybu, posazování k jídlu a dechová cvičení."},{id:"g-individualni-plan",term:"Individuální plán (IP)",category:"Legislativa",definition:"Písemná dohoda mezi klientem a poskytovatelem (Standard č. 5), jak a v čem bude služba probíhat, jaká jsou přání, zvyklosti a osobní cíle klienta.",practicalTip:"Plán se vytváří s klientem (ne o něm bez něj!), má ho na starosti klíčový pracovník a pravidelně se vyhodnocuje."},{id:"g-infantilismus",term:"Infantilní komunikace (infantiliazace)",category:"Komunikace a aktivizace",definition:"Nevhodné, ponižující jednání se seniorem jako s malým dítětem (zdrobněliny, tykání bez dovolení, „papání“, „babičko, nekřičte“).",practicalTip:"Vždy komunikujte s dospělým člověkem s respektem k jeho věku a životním zkušenostem."},{id:"g-inkontinence",term:"Inkontinence",category:"Ošetřovatelství",definition:"Samovolný, vůlí neovladatelný únik moči nebo stolice. U seniorů výrazně snižuje sebevědomí a zvyšuje riziko dekubitů i infekcí.",practicalTip:"Zachovávejte maximální diskrétnost, nikdy klienta nekárejte a měňte pomůcky včas před promočením."},{id:"g-inspekce-kvality",term:"Inspekce poskytování sociálních služeb",category:"Legislativa",definition:"Státní kontrola naplňování 15 Standardů kvality sociálních služeb a dodržování zákona č. 108/2006 Sb. v praxi zařízení.",practicalTip:"Inspektoři se ptají přímo klientů i pracovníků v přímé péči a nahlížejí do individuálních plánů."},{id:"g-intertrigo",term:"Intertrigo (opruzenina)",category:"Ošetřovatelství",definition:"Zarudlé, bolestivé zapaření kůže v kožních záhybech (pod prsy, v tříslech, pod břichem) způsobené vlhkem, teplem a třením.",practicalTip:"Záhyby po mytí šetrně (přikládáním, ne drhnutím) vysušte do sucha a dle potřeby chraňte bariérovou pastou/gázou."},{id:"g-ischemie",term:"Ischemie",category:"Ošetřovatelství",definition:"Místní nedokrvení tkáně, při kterém buňky nedostávají kyslík a živiny – hlavní příčina vzniku dekubitu nebo infarktu.",practicalTip:"Stačí pouhé 2 hodiny silného tlaku na jedno místo a tkáň začíná odumírat."},{id:"g-kinestetika",term:"Kinestetika",category:"Ošetřovatelství",definition:"Šetrná metoda manipulace a pohybu využívající přirozené pohybové vzorce klienta a přenos váhy tak, aby se nezranil klient ani pečovatel.",practicalTip:"Nezvedejte klienta tahem za ramena – využijte jeho vlastní oporu o nohy, pokrčená kolena a přenos těžiště."},{id:"g-klicovy-pracovnik",term:"Klíčový pracovník",category:"Legislativa",definition:"Konkrétní pracovník v přímé péči, který je průvodcem a oporou určeného klienta, sleduje jeho potřeby a společně s ním tvoří a hodnotí individuální plán.",practicalTip:"Díky klíčovému pracovníkovi má klient pocit bezpečí a někoho, komu může důvěřovat."},{id:"g-kompenzacni-pomucky",term:"Kompenzační pomůcky",category:"Ošetřovatelství",definition:"Pomůcky nahrazující nebo usnadňující ztracenou tělesnou funkci (berle, chodítko, invalidní vozík, podavač předmětů, nástavec na WC, sluchadlo).",practicalTip:"Vždy kontrolujte jejich technický stav (gumové koncovky holí, funkční brzdy vozíku!)."},{id:"g-konfabulace",term:"Konfabulace",category:"Psychologie a demence",definition:"Nevědomé vyplňování mezer v paměti smyšlenkami či útržky starých vzpomínek u osob s demencí. Nejde o vědomé lhaní!",practicalTip:"Klienta neobviňujte ze lži – pochopte, že jeho mozek se jen snaží dát světu smysl."},{id:"g-kontraktura",term:"Kontraktura",category:"Ošetřovatelství",definition:"Trvalé zkrácení svalů, šlach a vazů kolem kloubu při dlouhodobém ležení bez pohybu, vedoucí ke ztuhnutí končetiny v ohnuté poloze.",practicalTip:"Prevencí je správné polohování ve funkční poloze, pasivní procvičování (dle fyzioterapeuta) a podpora sebeobsluhy."},{id:"g-kpr",term:"KPR (Kardiopulmonální resuscitace)",category:"První pomoc a hygiena",definition:"Soubor výkonů k obnově oběhu a dýchání u osoby v bezvědomí, která nedýchá normálně. U dospělého poměr 30 stlačení hrudníku : 2 vdechům (nebo nepřetržitě 100–120 stlačení/min).",practicalTip:"Stlačujte střed hrudníku do hloubky 5–6 cm a po každém stlačení nechte hrudník úplně zvednout."},{id:"g-krizova-intervence",term:"Krizová intervence",category:"Psychologie a demence",definition:"Okamžitá odborná či laická pomoc člověku v akutní duševní tísni (např. po ztrátě partnera, při nástupu do domova nebo zhoršení zdraví).",practicalTip:"Základem je být nablízku, vytvořit bezpečné prostředí, naslouchat bez bagatelizace („to bude dobrý“) a v případě potřeby zajistit odborníka."},{id:"g-kubler-ross",term:"Model 5 fází vyrovnávání (Kübler-Rossová)",category:"Psychologie a demence",definition:"Pět psychologických fází při závažné ztrátě či blížící se smrti: 1. Popření (šok), 2. Hněv, 3. Smlouvání, 4. Deprese (smutek), 5. Smíření (akceptace).",practicalTip:"Fáze se mohou přeskakovat i vracet. Hněv pacienta není namířen proti vám osobně – neberte si ho k srdci."},{id:"g-malnutrice",term:"Malnutrice (podvýživa)",category:"Ošetřovatelství",definition:"Nedostatečný příjem energie nebo bílkovin vedoucí k úbytku svalové hmoty, špatnému hojení ran, vzniku dekubitů a ztrátě imunity.",practicalTip:"Může nastat i u obézního seniora! Sledujte váhový úbytek a hlášte sestře, pokud klient dlouhodobě jí jen malé porce."},{id:"g-mlcenlivost",term:"Povinnost mlčenlivosti (§ 100)",category:"Legislativa",definition:"Zákonná povinnost všech zaměstnanců zachovávat tajemství o osobních, zdravotních a citlivých údajích klientů. Trvá i po skončení pracovního poměru!",practicalTip:"O klientech nikdy nemluvte v tramvaji, v obchodě ani na sociálních sítích, a informace neposkytujte cizím osobám bez souhlasu."},{id:"g-naucena-bezmocnost",term:"Naučená bezmocnost (hospitalismus)",category:"Psychologie a demence",definition:"Pasivita a ztráta vlastní iniciativy vznikající v prostředí, kde je o člověka pečováno přehnaně direktivně bez respektu k jeho rozhodování.",practicalTip:"I drobná volba (jaký svetr si vezme, kdy půjde spát) udržuje zdravou psychiku seniora."},{id:"g-nortonova-skala",term:"Stupnice (škála) Nortonové",category:"Ošetřovatelství",definition:"Ošetřovatelská škála hodnotící riziko vzniku dekubitů v 5 oblastech (fyzický stav, stav vědomí, aktivita, pohyblivost, inkontinence) po 1–4 bodech (celkem 5–20 bodů).",practicalTip:"Čím nižší skóre, tím VYŠŠÍ riziko! Skóre 14 a méně značí riziko, 12 a méně vysoké riziko. Vyplňuje ji sestra na základě pozorování celého týmu."},{id:"g-obstipace",term:"Obstipace (zácpa)",category:"Ošetřovatelství",definition:"Obtížné, bolestivé nebo málo časté vyprazdňování tuhé stolice (méně než 3× týdně). U seniorů častá kvůli málo tekutinám, málo pohybu a lékům.",practicalTip:"Sledujte a zapisujte frekvenci stolice; při zácpě déle než 3 dny vždy informujte zdravotní sestru."},{id:"g-opatreni-omezujici-pohyb",term:"Opatření omezující pohyb osob (§ 89)",category:"Legislativa",definition:"Přísně regulovaný krajní zásah (úchop, bezpečná místnost, léky ordinované lékařem), který lze použít JEN při přímém ohrožení života nebo zdraví, po vyčerpání mírnějších cest a po dobu nezbytně nutnou.",practicalTip:"Nikdy neslouží jako trest ani pro klid služby! O každém použití se vede přesný záznam a informuje se opatrovník."},{id:"g-opatrovnik",term:"Opatrovník",category:"Legislativa",definition:"Osoba jmenovaná soudem k ochraně zájmů a práv dospělého člověka, jehož svéprávnost byla omezena.",practicalTip:"Opatrovník nesmí rozhodovat svévolně proti vůli klienta, pokud je klient schopen svůj názor vyjádřit – respektujeme především samotného klienta."},{id:"g-ortostaticka-hypotenze",term:"Ortostatická hypotenze",category:"První pomoc a hygiena",definition:"Náhlý pokles krevního tlaku při prudkém posazení nebo postavení z lůžka způsobující závrať, černo před očima a pád.",practicalTip:"Seniora vždy posazujte postupně: nejprve na chvíli spustit nohy z postele, nechat prodýchat a teprve pak pomalu vstát."},{id:"g-pmk",term:"PMK (Permanentní močový katétr)",category:"Ošetřovatelství",definition:"Tenká hadička zavedená do močového měchýře k trvalému odvodu moči do sběrného sáčku.",practicalTip:"Sběrný sáček musí být VŽDY pod úrovní močového měchýře (jinak se moč vrací a způsobuje infekci!) a nesmí ležet na špinavé podlaze."},{id:"g-polohovani",term:"Polohování",category:"Ošetřovatelství",definition:"Pravidelná změna polohy těla imobilního klienta za účelem odlehčení tlaku, prevence dekubitů, podpory dýchání a komfortu.",practicalTip:"Standardní interval je každé 2 hodiny ve dne a každé 3 hodiny v noci (u vysoce rizikových i častěji). Výborná je 30° šikmá poloha."},{id:"g-predilekcni-mista",term:"Predilekční místa",category:"Ošetřovatelství",definition:"Místa na těle s tenkým podkožím nad kostmi, kde dekubity vznikají nejčastěji (křížová kost, paty, kyčle, kotníky, lokty, sedací hrboly, lopatky, týl).",practicalTip:"Kontrolujte tato místa zrakem při každé hygieně a převlékání."},{id:"g-prispevek-na-peci",term:"Příspěvek na péči (§ 7–29)",category:"Legislativa",definition:"Sociální dávka určená osobám závislým na pomoci jiné fyzické osoby při zvládání 10 základních životních potřeb. Má I.–IV. stupeň.",practicalTip:"V roce 2026 pro dospělé: I. = 1 300 Kč, II. = 5 400 Kč, III. = 14 800 Kč, IV. = 23 000 Kč (v pobytovém zařízení) nebo 27 000 Kč (doma)."},{id:"g-pss",term:"PSS (Pracovník v sociálních službách)",category:"Legislativa",definition:"Kvalifikovaný odborník (§ 116 zákona 108/2006 Sb.) vykonávající přímou obslužnou péči, základní výchovnou činnost nebo aktivizaci. Kurzy mají min. 150 hodin.",practicalTip:"Musí absolvovat nejméně 24 hodin dalšího vzdělávání za každý kalendářní rok. Není zdravotnický pracovník."},{id:"g-reminiscence",term:"Reminiscence (reminiscenční terapie)",category:"Komunikace a aktivizace",definition:"Cílené vyvolávání pozitivních vzpomínek z minulosti pomocí starých fotografií, předmětů, písní nebo vůní. Posiluje sebevědomí a identitu seniora.",practicalTip:"U seniorů s demencí bývá dlouhodobá paměť zachována mnohem déle než krátkodobá – na minulost si vzpomenou rádi a přesně."},{id:"g-sarkopenie",term:"Sarkopenie",category:"Ošetřovatelství",definition:"Přirozený úbytek svalové hmoty a síly ve stáří, který zhoršuje stabilitu, chůzi a zvyšuje riziko pádů.",practicalTip:"Brzdí se každodenním přiměřeným pohybem a dostatkem bílkovin ve stravě."},{id:"g-somatologie",term:"Somatologie",category:"Ošetřovatelství",definition:"Nauka o stavbě a funkcích zdravého lidského těla (anatomie a fyziologie).",practicalTip:"Ve stáří přirozeně ubývá svalová hmota, kůže se ztenčuje, klesá pružnost cév i pocit žízně."},{id:"g-standardy-kvality",term:"Standardy kvality sociálních služeb",category:"Legislativa",definition:"Soubor 15 závazných kritérií (příloha č. 2 vyhlášky č. 505/2006 Sb.), která musí každá registrovaná sociální služba naplňovat a která kontroluje inspekce.",practicalTip:"Dělí se na procesní (1–8), personální (9–10) a provozní (11–15)."},{id:"g-stomie",term:"Stomie",category:"Ošetřovatelství",definition:"Uměle vytvořený vývod dutého orgánu na povrch těla (nejčastěji kolostomie – vývod tlustého střeva, nebo urostomie).",practicalTip:"Stoma musí být růžové a vlhké. Zčernání, krvácení nebo zánět okolí hlásíte ihned zdravotní sestře."},{id:"g-sundowning",term:"Sundowning (syndrom západu slunce)",category:"Psychologie a demence",definition:"Zvýšený neklid, úzkost, bloudění a zmatenost u osob s demencí nastupující v pozdním odpoledni a podvečer při stmívání a únavě.",practicalTip:"Pomáhá včasné rozsvícení teplého světla, klidná známá aktivita, omezení hluku a vlídné ujištění."},{id:"g-supervize",term:"Supervize",category:"Psychologie a demence",definition:"Pravidelné bezpečné setkání týmu nebo jednotlivce s nezávislým odborníkem (supervizorem), které pomáhá řešit náročné případy, vztahy na pracovišti a předcházet vyhoření.",practicalTip:"Supervize není kontrola ani „výslech šéfem“ – je to podpora pro pracovníky!"},{id:"g-syndrom-vyhoreni",term:"Syndrom vyhoření (burnout)",category:"Psychologie a demence",definition:"Stav fyzického, emočního a duševního vyčerpání z dlouhodobého pracovního stresu v pomáhajících profesích. Projevuje se apatií, cynismem a poklesem výkonu.",practicalTip:"Prevencí je duševní hygiena, oddělení práce od soukromí, zdravé hranice, supervize a podpora týmu."},{id:"g-terenni-sluzba",term:"Terénní sociální služba",category:"Legislativa",definition:"Forma sociální služby (§ 33), která se poskytuje přímo v přirozeném domácím prostředí klienta (např. pečovatelská služba, osobní asistence).",practicalTip:"V domově pro seniory nejde o terénní, ale o pobytovou službu."},{id:"g-turgor",term:"Kožní turgor",category:"Ošetřovatelství",definition:"Napětí a pružnost kůže. Pokud kožní řasa (např. na předloktí či pod klíční kostí) po stisknutí pomalu splývá zpět, svědčí to o dehydrataci.",practicalTip:"U seniorů je pružnost na hřbetu ruky přirozeně menší – spolehlivější je test na hrudníku pod klíční kostí a kontrola suchosti jazyka."},{id:"g-uhrada-15-procent",term:"Minimální zůstatek příjmu (15 %)",category:"Legislativa",definition:"Zákonná ochrana klienta v celoroční pobytové službě (§ 73 odst. 3 zákona č. 108/2006 Sb.): po úhradě ubytování a stravy mu musí zůstat alespoň 15 % jeho příjmu.",practicalTip:"Pokud senior pobírá nízký důchod, úhrada za ubytování a stravu se mu automaticky sníží tak, aby mu 15 % vždy zůstalo na osobní potřeby."},{id:"g-validace",term:"Validace (podle Naomi Feil)",category:"Komunikace a aktivizace",definition:"Komunikační metoda práce s dezorientovanými seniory s demencí založená na uznání a přijetí jejich emocí, aniž bychom je násilně vraceli do naší reality.",practicalTip:"Místo „Maminka vám zemřela před 30 lety“ řekněte: „Měla jste maminku moc ráda, že? Povídejte mi o ní.“"},{id:"g-zavislost-na-sluzbe",term:"Závislost na sociální službě",category:"Legislativa",definition:"Nežádoucí stav, kdy uživatel ztrácí schopnost či vůli rozhodovat o sobě a dělat běžné úkony, protože za něj personál přebírá veškerou iniciativu.",practicalTip:"Vždy dávejte klientovi přiměřený čas a prostor zapojit se podle vlastních sil."}],Vv=[{id:"back-occiput",position:"back",name:"Týl hlavy (záhlaví)",x:160,y:44,whyRisk:"Tenká vrstva podkoží přímo na lebeční kosti při dlouhodobém ležení na zádech.",prevention:"Měkký tvarovaný podhlavník, pravidelné jemné natáčení hlavy vpravo a vlevo při polohování."},{id:"back-scapulae",position:"back",name:"Lopatky a trny obratlů",x:132,y:122,whyRisk:"Kostní výběžky tlačí na měkké tkáně při skluzu v polohovací posteli (střižná síla).",prevention:"Vyvarovat se vysokému polosedu bez podložení pod koleny; používat podložky a pravidelně polohovat."},{id:"back-elbows",position:"back",name:"Lokty (okovec)",x:84,y:190,whyRisk:"Klient si lokty často odírá o hrubé prostěradlo při snaze posunout se nahoru.",prevention:"Podkládat předloktí měkkými polštářky, hlídat čistotu a hydrataci kůže, nekrčit prostěradlo."},{id:"back-sacrum",position:"back",name:"Křížová kost a kostrč (sakrální oblast)",x:160,y:222,whyRisk:"Nejčastější místo dekubitů! Kombinace vysokého tlaku trupu, vlhkosti (inkontinence) a střižných sil.",prevention:"Polohování po 2 hod. ve dne (3 hod. v noci) na boky pod úhlem 30°, antidekubitní matrace, důsledná inkontinenční hygiena a bariérové krémy."},{id:"back-heels",position:"back",name:"Paty",x:134,y:382,whyRisk:"Druhé nejčastější místo proleženin. Malá plocha patní kosti nese celou váhu dolní končetiny.",prevention:"Paty musí „viset ve vzduchu“ – podložit lýtka měkkým válcem nebo antidekubitní botičkou (nikdy ne jen pod kolenem!)."},{id:"side-ear",position:"side",name:"Ušní boltec a lícní kost",x:158,y:48,whyRisk:"Chrupavka ucha je citlivá na ischemii při tvrdém polštáři nebo přeložení ucha.",prevention:"Zkontrolovat, že ucho není ohnuté, používat měkký poddajný polštář nebo polohovací polštářek s otvorem."},{id:"side-shoulder",position:"side",name:"Ramenní kloub (akromion)",x:155,y:112,whyRisk:"Při úhlu 90° nese celé rameno váhu horní poloviny těla.",prevention:"Upřednostňovat šetrnou 30° boční polohu (klient neleží kolmo na rameni a kyčli), horní paži podepřít polštářem."},{id:"side-trochanter",position:"side",name:"Velký chocholík stehenní kosti (kyčel)",x:158,y:218,whyRisk:"Výrazný kostní výběžek na zevní straně kyčle s vysokým rizikem hlubokých dekubitů.",prevention:"Poloha pod úhlem 30° (klín za zády, hmotnost přenesena na svalstvo hýždí), podložení mezi koleny."},{id:"side-knees",position:"side",name:"Vnitřní a zevní strana kolen",x:162,y:300,whyRisk:"Vzájemné tření kolen o sebe nebo tlak spodního kolene na podložku.",prevention:"Vždy vložit měkký polštář nebo podložku mezi dolní končetiny od kolen až po kotníky."},{id:"side-malleolus",position:"side",name:"Zevní a vnitřní kotníky",x:156,y:374,whyRisk:"Kotníky nemají téměř žádnou tukovou ani svalovou vrstvu.",prevention:"Podložit bérce tak, aby kotník neležel přímo na matraci a kotníky se netřely o sebe."},{id:"sit-scapulae",position:"sitting",name:"Lopatky a hrudní páteř",x:120,y:126,whyRisk:"Tlak opěradla vozíku při sesutém sedu a oslabeném svalstvu zad.",prevention:"Správné nastavení opěrky, polohovací sedák s oporou beder, kontrola polohy každé 2 hodiny."},{id:"sit-ischial",position:"sitting",name:"Sedací hrboly (ischia) a kostrč",x:154,y:230,whyRisk:"Při dlouhém sezení nese téměř celou hmotnost těla malá plocha sedacích hrbolů.",prevention:"Speciální antidekubitní podsedák (gelový, vzduchový, paměťová pěna), odlehčování každých 15–30 minut nebo návrat na lůžko po max. 2 hodinách."},{id:"sit-popliteal",position:"sitting",name:"Podkolenní jamka a zadní plocha stehen",x:205,y:265,whyRisk:"Příliš dlouhý sedák vozíku tlačí na cévy a nervy v podkolení.",prevention:"Mezi okrajem sedáku a podkolenní jamkou musí zůstat mezera na 2–3 prsty. Chodidla opřená o stupačky."},{id:"sit-heels",position:"sitting",name:"Paty a nárty na stupačkách",x:224,y:368,whyRisk:"Tlak tvrdé stupačky na patu nebo sklouznutí nohy za stupačku.",prevention:"Správná výška stupaček (stehna vodorovně), pohodlná měkká obuv bez pevných švů, patní řemínky."}],oy=[{stage:"I. stupeň",title:"Neblednoucí zarudnutí neporušené kůže",visualSign:"Kůže je celistvá, ale červená (u tmavší kůže namodralá). Po zatlačení prstem zarudnutí NEBLEDNE! Může být teplá, tuhá nebo bolestivá.",actionForPss:"Okamžitě odlehčit tlak (přepolohovat!), NIKDY místo nemasírovat ani netřít! Ihned nahlásit zdravotní sestře. Zkontrolovat stav prostěradla a inkontinenčních pomůcek.",severityColor:"amber"},{stage:"II. stupeň",title:"Puchýř nebo povrchové poškození kůže",visualSign:"Částečná ztráta kůže zasahující epidermis/dermis. Vypadá jako odřenina, mělký růžovočervený vřed bez povlaku nebo naplněný puchýř.",actionForPss:"Puchýř v žádném případě nepropichovat ani nestrhávat! Chránit před dalším tlakem a třením, ihned předat k ošetření zdravotní sestře.",severityColor:"orange"},{stage:"III. stupeň",title:"Hluboký vřed zasahující podkoží",visualSign:"Úplná ztráta kůže s poškozením podkožního tuku. Mohou být viditelné povlaky nebo nekróza (černá/žlutá tkáň), mohou být podminované okraje. Sval a kost ještě nejsou obnaženy.",actionForPss:"Výhradně v kompetenci zdravotní sestry a lékaře! PSS zajišťuje přísné polohování mimo ránu, prevenci znečištění stolicí/močí a hlásí prosáknutí krytí či zápach.",severityColor:"rose"},{stage:"IV. stupeň",title:"Rozsáhlá destrukce až na sval, šlachu nebo kost",visualSign:"Hluboký defekt odhalující svaly, šlachy nebo kosti. Vysoké riziko těžké infekce (sepse). Klient nemusí cítit bolest kvůli poškození nervů.",actionForPss:"Maximální šetrnost při manipulaci, striktní dodržování pokynů sestry, sledování celkových příznaků infekce (teplota, třesavka, zmatenost) a ihned hlásit.",severityColor:"red"}],Xu=[{id:"mobilita",number:1,name:"Mobilita",description:"Schopnost vstávat, usedat, stát, měnit polohy, chodit po rovině i po schodech.",childEvaluated:!0},{id:"orientace",number:2,name:"Orientace",description:"Schopnost orientovat se zrakem, sluchem, rozumem v čase, místě a vlastní osobě.",childEvaluated:!0},{id:"komunikace",number:3,name:"Komunikace",description:"Schopnost dorozumět se řečí, písmem nebo náhradními způsoby a porozumět sdělení.",childEvaluated:!0},{id:"stravovani",number:4,name:"Stravování",description:"Schopnost vybrat, naporcovat a přijmout stravu a tekutiny (včetně dietního režimu).",childEvaluated:!0},{id:"oblekani",number:5,name:"Oblékání a obouvání",description:"Schopnost vybrat si přiměřené oblečení, obléknout se, svléknout a obout.",childEvaluated:!0},{id:"hygiena",number:6,name:"Tělesná hygiena",description:"Schopnost umýt se, vykoupat, pečovat o dutinu ústní, vlasy, nehty a osušit se.",childEvaluated:!0},{id:"fyziologicka",number:7,name:"Výkon fyziologické potřeby",description:"Schopnost včas dojít na WC, vyprázdnit se, očistit a použít
