aví, 9. Osobní aktivity, 10. Péče o domácnost.","U osob do 18 let se péče o domácnost NEHODNOTÍ – posuzuje se pouze 9 potřeb.","Stupně závislosti u dospělých (nad 18 let): I. stupeň (3–4 nezvládané potřeby), II. stupeň (5–6), III. stupeň (7–8), IV. stupeň (9–10).","Měsíční výše příspěvku na péči pro dospělé (platné v roce 2026): I. = 1 300 Kč | II. = 5 400 Kč | III. = 14 800 Kč | IV. v pobytovém zařízení (DS, DZR) = 23 000 Kč | IV. doma / v terénu = 27 000 Kč."],table:{headers:["Stupeň závislosti","Nezvládané potřeby (18+)","Dospělí 18+ (2026)","Děti do 18 let (2026)"],rows:[["I. stupeň (lehká)","3 – 4 potřeby","1 300 Kč","4 900 Kč (3 potřeby)"],["II. stupeň (středně těžká)","5 – 6 potřeb","5 400 Kč","8 200 Kč (4–5 potřeb)"],["III. stupeň (těžká)","7 – 8 potřeb","14 800 Kč","16 100 Kč (6–7 potřeb)"],["IV. stupeň – pobytová služba","9 – 10 potřeb","23 000 Kč","23 000 Kč (8–9 potřeb)"],["IV. stupeň – doma / terénní","9 – 10 potřeb","27 000 Kč","27 000 Kč (8–9 potřeb)"]]},mnemonic:"Kouzelná pomůcka pro 10 potřeb: M-O-K-S-O-T-V-P-O-P (Mobilita, Orientace, Komunikace, Stravování, Oblékání, Tělesná hygiena, Výkon fyz. potřeby, Péče o zdraví, Osobní aktivity, Péče o domácnost)."},{id:"leg-uhrady-2026",title:"1.4 Maximální úhrady v domově pro seniory (2026) a pravidlo 15 %",summary:"Vyhláška č. 505/2006 Sb. určuje horní stropy za ubytování a stravu a zákon chrání seniora před finanční nouzí.",keyPoints:["Maximální denní úhrada za ubytování v DS (2026): nejvýše 335 Kč/den ve vícelůžkovém pokoji a nejvýše 380 Kč/den v jednolůžkovém pokoji.","Maximální denní úhrada za celodenní stravu (2026): nejvýše 290 Kč/den (samostatný oběd max. 135 Kč/den).","Pravidlo minimálního zůstatku (§ 73 odst. 3): Po úhradě za ubytování a stravu v celoroční pobytové službě musí klientovi zůstat alespoň 15 % z jeho měsíčního příjmu (důchodu). Pokud má nízký důchod a na plnou úhradu nestačí, úhrada se přiměřeně sníží.","Úkony péče se v domově pro seniory hradí z přiznaného příspěvku na péči."]},{id:"leg-pss-116",title:"1.5 Kvalifikace a povinnosti pracovníka v sociálních službách (§ 116 a § 100)",summary:"Aby mohl člověk vykonávat přímou obslužnou péči, musí splnit zákonné vzdělání, bezúhonnost a zdravotní způsobilost.",keyPoints:["Kvalifikační kurz PSS (§ 116): akreditovaný MPSV v minimálním rozsahu 150 hodin (teorie + praxe).","Další vzdělávání (§ 116 odst. 9): Pracovník v sociálních službách je povinen průběžně se vzdělávat nejméně v rozsahu 24 hodin za kalendářní rok.","Povinnost mlčenlivosti (§ 100): Platí o všech skutečnostech zjištěných při poskytování služby – a trvá i po skončení pracovního poměru!","Pozor na kompetence: PSS NENÍ zdravotnický pracovník (neaplikuje injekce, nepřipravuje léky, neléčí rány). Sleduje však změny u klienta a hlásí je zdravotní sestře."]}],examTips:["U ústní zkoušky začněte u zákona 108/2006 Sb. tím, že jde o ochranu lidské důstojnosti a podporu soběstačnosti (§ 2).","Umějte z hlavy odlišit IV. stupeň příspěvku na péči: 23 000 Kč v domově pro seniory vs. 27 000 Kč doma.","Vždy zdůrazněte magickou hranici 15 % zůstatku z příjmu klienta po zaplacení stravy a bydlení."],examTraps:[{trap:"„Pracovník v sociálních službách může po zaučení sestrou podávat klientovi v domově pro seniory inzulín.“",truth:"NE! Inzulín a příprava/podání léků v pobytovém zařízení je zdravotnický výkon sestry. PSS není zdravotnický pracovník."},{trap:"„U dětí do 18 let se posuzuje všech 10 základních životních potřeb jako u dospělých.“",truth:"NE! U dětí do 18 let se neposuzuje „péče o domácnost“, hodnotí se pouze 9 základních životních potřeb."},{trap:"„Povinnost mlčenlivosti končí dnem, kdy pečovatel podá výpověď a odejde z domova.“",truth:"NE! Podle § 100 zákona č. 108/2006 Sb. trvá povinnost mlčenlivosti i po skončení pracovněprávního vztahu."}]},{id:"standardy-prava",order:2,title:"Standardy kvality, etika, ochrana práv a § 89 (omezení pohybu)",shortTitle:"Standardy & Ochrana práv",subtitle:"15 standardů kvality, individuální plánování, stížnosti, prevence týrání a § 89",estimatedMinutes:18,accentColor:"emerald",badgeText:"Okruh 2 · Kvalita & Etika",overview:"Inspekce kvality sociálních služeb kontrolují tzv. Standardy kvality (příloha č. 2 vyhlášky č. 505/2006 Sb.). Zkoušející kladou obrovský důraz na ochranu práv seniorů, individuální plánování, stížnosti a přísná pravidla omezujících opatření podle § 89.",sections:[{id:"std-15-prehled",title:"2.1 Systém 15 Standardů kvality sociálních služeb",summary:"Standardy jsou rozděleny do tří skupin: procesní (1–8), personální (9–10) a provozní (11–15).",keyPoints:["Procesní standardy (1–8 – jak služba pracuje s klientem): 1. Cíle a způsoby, 2. Ochrana práv osob, 3. Jednání se zájemcem, 4. Smlouva, 5. Individuální plánování, 6. Dokumentace, 7. Stížnosti, 8. Návaznost na další zdroje.","Personální standardy (9–10 – lidé v týmu): 9. Personální a organizační zajištění, 10. Profesní rozvoj zaměstnanců (školení, 24 h/rok, supervize).","Provozní standardy (11–15 – zázemí a bezpečnost): 11. Místní a časová dostupnost, 12. Informovanost, 13. Prostředí a podmínky, 14. Nouzové a havarijní situace, 15. Zvyšování kvality.","Zásadní kritéria (např. ve Standardech 1, 2, 5, 7, 14): jejich hrubé neplnění může vést až k odebrání registrace služby!"],mnemonic:"8 Procesních (cesta klienta od zájemce po stížnost a návaznost) + 2 Personální (lidi a rozvoj) + 5 Provozních (barák, info, bezpečnost, kvalita) = 15."},{id:"std-ip-stiznosti",title:"2.2 Individuální plánování (Standard č. 5) a Stížnosti (Standard č. 7)",summary:"Péče nesmí být „pásová výroba“ podle jednotného harmonogramu ústavu, ale podle potřeb a rytmu konkrétního seniora.",keyPoints:["Individuální plán (IP): Vytváří se společně s klientem a jeho klíčovým pracovníkem. Obsahuje jeho přání, zvyky (kdy vstává, zda pije čaj či kávu), cíle a konkrétní domluvu podpory.","Pravidelné přehodnocování IP: Plán je živý dokument – mění se, kdykoliv se změní zdravotní stav či přání klienta.","Stížnosti (Standard č. 7): Stížnost není „zrada“, ale zpětná vazba pro zlepšení! Klient si může stěžovat ústně, písemně i anonymně (schránka důvěry) nebo přes nezávislou osobu.","Zákaz postihu: Nikdo nesmí klienta trestat, zanedbávat či zesměšňovat za to, že si stěžoval."]},{id:"std-paragraf-89",title:"2.3 Opatření omezující pohyb osob (§ 89 zákona č. 108/2006 Sb.)",summary:"Jedno z nejdůležitějších témat u zkoušek. V domovech pro seniory se nesmějí používat postranice, zamykání pokojů ani tlumící léky z pohodlnosti personálu!",keyPoints:["Základní zákaz: Při poskytování sociálních služeb NELZE používat opatření omezující pohyb osob.","Jediná zákonná výjimka: Pouze v případě PŘÍMÉHO OHROŽENÍ ZDRAVÍ A ŽIVOTA klienta nebo jiných fyzických osob – a pouze po DOBU NEZBYTNĚ NUTNOU k odvrácení nebezpečí!","Podmínka mírnějších prostředků: Nejprve se musí neúspěšně vyčerpat mírnější cesty (slovní zklidnění, odvedení pozornosti, odstranění nebezpečných předmětů).","Zákonná hierarchie (§ 89 odst. 4): 1. Fyzický úchop → 2. Místnost zřízená k bezpečnému pobytu → 3. Léčivé přípravky (výhradně na základě ordinace přivolaného lékaře a ZA JEHO PŘÍTOMNOSTI!).","Povinnosti po použití: Přivolat lékaře (pokud nestačil krátký úchop), provést podrobný písemný záznam do evidence omezení, nahlásit opatrovníkovi/zákonnému zástupci a poučit klienta."],practicalTip:"Pozor na zvedání obou postranic na lůžku! Pokud klient z postele nemůže sám vylézt a chce vstát, vytažené postranice bez jeho souhlasu a bez bezpečnostní indikace mohou být hodnoceny jako nezákonné omezení svobody (a navíc hrozí nebezpečný pád přes ně!)."},{id:"std-ean-etika",title:"2.4 Prevence týrání seniorů (EAN), etika a střet zájmů",summary:"Pracovník chrání důstojnost a bezpečí klienta a hlídá hranice profesionálního vztahu.",keyPoints:["Formy EAN (Elder Abuse and Neglect): fyzické týrání (štípání, tahání, modřiny), psychické (křik, infantilizace – „babičko, nekřičte na mě“, vyhrožování), finanční zneužívání (rodina či personál bere důchod), sexuální a zanedbávání péče (žíznící či špinavý klient).","Dary a střet zájmů: Pracovník nesmí přijímat peníze, hodnotné dary ani dědictví od klientů nebo jejich rodin. Zabrání tak podezření ze zvýhodňování či vydírání.","Soukromí a intimita: Klepat před vstupem na pokoj, nezdržovat se při hygieně s otevřenými dveřmi, neodhalovat zbytečně tělo klienta, oslovovat příjmením a vykat (pokud si klient nepřeje jinak)."]}],examTips:["Pokud se komise zeptá na „postranice nebo přikurtování neklidného seniora“, ihned citujte § 89 – zákaz omezení, výjimka jen přímé ohrožení života/zdraví, nejprve slovní zklidnění, až pak úchop / bezpečná místnost / léky jen s lékařem.","U individuálního plánu vždy zmiňte pojmy „klíčový pracovník“, „přání klienta“ a „prevence ústavního stereotypu“."],examTraps:[{trap:"„Když je klient v noci zmatený a padá z postele, můžeme mu bez dalšího zvednout všechny postranice a přivázat ho pásem, aby si neublížil.“",truth:"NE! To je nelegální omezování pohybu (§ 89). Bezpečnost se řeší sníženým lůžkem, matrací vedle postele, hlásičem pohybu či řešením příčiny neklidu (bolest, WC)."},{trap:"„Anonymní stížnost hozenou do schránky nemusí domov řešit.“",truth:"NE! Podle Standardu č. 7 musí mít služba postup i pro vyřizování anonymních stížností."}]},{id:"prima-pece",order:3,title:"Přímá péče: Hygiena, výživa, inkontinence a hranice kompetencí",shortTitle:"Hygiena, výživa & Péče",subtitle:"Osobní hygiena, pitný režim, diety, péče o PMK a stomie, PSS vs. zdravotní sestra",estimatedMinutes:22,accentColor:"cyan",badgeText:"Okruh 3 · Denní praxe",overview:"Zde se potkává každodenní rutina v domově pro seniory se základy ošetřovatelství. Zkoušející budou chtít znát správný postup při hygieně na lůžku, péči o kůži a dutinu ústní, rozpoznání dehydratace, práci s inkontinencí a jasné hranice toho, co smí PSS a co smí jen sestra.",sections:[{id:"pece-hygiena",title:"3.1 Zásady osobní hygieny seniorů a hygiena na lůžku",summary:"Hygiena není jen očista těla, ale i prevence infekcí, opruzenin a příležitost ke kontrole stavu kůže a ke klidnému kontaktu.",keyPoints:["Zajištění soukromí a tepelného komfortu: Zavřít okno i dveře, vyvětrat předem, použít zástěnu, odkrývat vždy jen tu část těla, kterou právě myjeme (prevence prochladnutí i studu).","Postup mytí na lůžku (od nejčistšího k nejšpinavějšímu): Obličej (čistou vodou bez mýdla, oči od zevního koutku k vnitřnímu!), krk, hrudník a ruce, záda, dolní končetiny, a nakonec intimní partie a konečník (čistou žínkou zepředu dozadu!).","Ochrana kožních záhybů (prevence intertriga): Pod prsy, v tříslech, pod břichem a mezi prsty nohou vždy důkladně osušit přikládáním ručníku (nikoliv hrubým třením!).","Dutina ústní a zubní protéza: Protézu čistit kartáčkem pod tekoucí studenou/vlažnou vodou nad umyvadlem napuštěným vodou nebo s ručníkem (aby při pádu nepraskla!), ústa vypláchnout i bezzubým klientům.","Péče o nehty a vlasy: U klientů s cukrovkou (diabetes mellitus) nebo poruchou prokrvení dolních končetin NEHTY NA NOHOU NESTŘÍHAT nůžkami – hrozí těžce se hojící infekce (diabetická noha); pouze opatrně pilovat nebo zajistit odbornou pedikúru/sestru!"]},{id:"pece-vyziva",title:"3.2 Výživa, pitný režim a polykání (dysfagie)",summary:"Senioři mají přirozeně oslabený pocit žízně a často méně chuti k jídlu. Dehydratace a malnutrice přímo vedou k pádům, zmatenosti a dekubitům.",keyPoints:["Dehydratace u seniora – varovné příznaky: Suché rty a oschlý jazyk, tmavá a zapáchající moč, zácpa, únava, pokles tlaku, zhoršený kožní turgor (pomalé vyrovnání kožní řasy pod klíční kostí) a NÁHLÁ ZMATENOST (delirium).","Doporučený příjem tekutin: Cca 1,5–2 litry denně (pokud lékař neomezí např. při těžkém srdečním či ledvinném selhávání). Nabízet v malých porcích během celého dne (do 17–18 h více, večer méně kvůli nočnímu vstávání).","Bezpečné krmení a prevence aspirace (vdechnutí): Klient musí sedět zpříma (90°), nikdy ho nekrmit v záklonu nebo vleže! Nechávat dostatek času na polknutí, po jídle ponechat vsedě alespoň 20–30 minut.","Základní diety: č. 3 (racionální), č. 2 (šetřící – lehce stravitelná při onemocnění žaludku/žlučníku), č. 9 (diabetická – bez jednoduchých cukrů, pravidelný režim po aplikaci inzulinu!)."]},{id:"pece-inkontinence-pmk",title:"3.3 Inkontinence, vyprazdňování a péče o klienta s PMK / stomií",summary:"Únik moči nebo stolice vyžaduje mimořádný takt, kvalitní absorpční pomůcky a důslednou hygienu bez zbytečného ponižování.",keyPoints:["Druhy inkontinence: Stresová (únik při kašli/smíchu), Urgentní (náhlé nutkání), Přepadová (při zvětšené prostatě), Funkční (klient nedojde včas na WC kvůli mobilitě nebo demenci).","Inkontinenční pomůcky: Vložky, vložné pleny se síťovanými kalhotkami, zalepovací kalhotkové pleny (pro ležící), navlékací kalhotky (pro mobilní). Výměna vždy dle indikátoru vlhkosti a po každé stolici, ošetření ochranným krémem.","Klient s permanentním močovým katétrem (PMK): Sběrný sáček musí viset VŽDY pod úrovní močového měchýře (zabránění zpětného toku a infekce) a NIKDY nesmí ležet na podlaze! Hadička nesmí být zalomená. Jakmile moč neodtéká nebo je v ní krev/zákal, ihned hlásit sestře.","Zácpa (obstipace): Hlásit sestře, pokud klient neměl stolici déle než 3 dny."]},{id:"pece-kompetence",title:"3.4 Zlaté pravidlo: Co smí PSS a co výhradně zdravotní sestra",summary:"Sociálně-zdravotní pomezí v domově pro seniory má přesné zákonné hranice (zákon č. 108/2006 Sb. vs. vyhláška č. 55/2011 Sb.).",keyPoints:["Kompetence PSS (přímá obslužná péče): Hygiena, koupel, převlékání, polohování, úprava lůžka, podávání jídla a tekutin, výměna plenkových kalhotek, doprovod na WC, sledování změn u klienta a hlášení sestře.","Výhradní kompetence zdravotní sestry: Příprava a podávání léků, aplikace inzulinu a injekcí, měření glykémie glukometrem, cévkování, odborné převazy ran a dekubitů, hodnocení skóre rizika (Nortonová), odsávání dýchacích cest.","Role očí a uší týmu: Protože pečovatel tráví s klientem nejvíce času, všimne si jako první zarudnutí na kříži, otoku kotníku, nechutenství nebo změny nálady – jeho hlavní povinností je včas informovat sestru."]}],examTips:["Pamatujte si „sáček od cévky pod úrovní měchýře a ne na zemi“ – zkoušející tuto větu milují.","U hygieny vždy začněte zajištěním soukromí, tepla a podporou toho, co si klient umí umýt sám.","U diabetika zdůrazněte zákaz stříhání nehtů na nohou nůžkami pracovníkem v přímé péči."],examTraps:[{trap:"„Při mytí očí na lůžku postupujeme od vnitřního koutku směrem k zevnímu.“",truth:"POZOR! V učebnicích ošetřovatelství platí: čisté oči myjeme od ZEVNÍHO koutku k VNITŘNÍMU (aby se nečistota nedostala do slzného kanálku; u infekce a hnisavého výtoku naopak zevně, aby se nezanesla do druhého oka – vždy samostatnou částí žínky/tamponu)."},{trap:"„Když senior málo pije, můžeme mu v noci dát půl litru čaje najednou.“",truth:"NE! Seniorovi dáváme pít po malých doušcích celý den; večer větší množství způsobí noční buzení a riziko pádu cestou na WC."}]},{id:"mobilita-dekubity",order:4,title:"Mobilita, dekubity (proleženiny), polohování a prevence pádů",shortTitle:"Mobilita & Dekubity",subtitle:"4 stupně dekubitů, predilekční místa, škála Nortonové, kinestetika a vozík",estimatedMinutes:20,accentColor:"amber",badgeText:"Okruh 4 · Prevence komplikací",overview:"Proleženiny (dekubity) a pády jsou dvě nejčastější a nejnebezpečnější komplikace v domovech pro seniory. Musíte umět rozpoznat už první stupeň dekubitu, znát ohrožená místa, intervaly polohování, základy škály Nortonové a bezpečnou manipulaci s klientem bez zničení vlastních zad.",sections:[{id:"mob-dekubity-vznik",title:"4.1 Jak vznikají dekubity a 4 stupně poškození kůže",summary:"Dekubit vzniká stlačením cév mezi kostí a podložkou (ischemie). Stačí 2 hodiny trvalého tlaku a tkáň odumírá.",keyPoints:["Hlavní faktory vzniku: Tlak (váha těla), Tření a Střižná síla (když klient klouže dolů na polohovací posteli), Vlhkost (pot, moč, stolice), Malnutrice a věk.","I. stupeň: Neblednoucí zarudnutí neporušené kůže (po stisku prstem nezůstane bílá stopa!). Řešení: IHNED odlehčit, NIKDY nemasírovat, hlásit sestře!","II. stupeň: Puchýř nebo mělká odřenina/vřed (nepropichovat puchýř!).","III. stupeň: Hluboký vřed zasahující podkoží (možná nekróza/povlak).","IV. stupeň: Rozsáhlá destrukce až na sval, šlachu nebo kost (vysoké riziko sepse)."]},{id:"mob-predilekce-polohovani",title:"4.2 Predilekční místa a zásady správného polohování",summary:"Riziková místa závisí na poloze klienta. Správným polohováním a podložením se většině proleženin dá zcela zabránit.",keyPoints:["Vleže na zádech: Týl hlavy, lopatky, lokty, křížová kost a kostrč (nejčastěji!), paty (druhé nejčastější!).","Vleže na boku: Ušní boltec, rameno, velký chocholík kyčle, vnitřní/zevní strany kolen, kotníky.","Vsedě na vozíku: Lopatky, sedací hrboly (ischia), kostrč, podkolení, paty na stupačkách.","Interval polohování: Standardně každé 2 hodiny ve dne a každé 3 hodiny v noci (zapisuje se do polohovacího záznamu!).","Šikmá 30° boční poloha: Místo tvrdé 90° polohy na kyčli natočíme klienta jen o 30° a podepřeme záda klínem – tlak se přenese do měkké svaloviny hýždí.","Pravidlo pro paty: Podložit lýtka měkkým polštářem/válcem tak, aby paty volně visely ve vzduchu."]},{id:"mob-norton-imobilita",title:"4.3 Škála Nortonové a imobilizační syndrom",summary:"Škála Nortonové hodnotí riziko dekubitů – čím NIŽŠÍ je součet bodů, tím VYŠŠÍ je riziko!",keyPoints:["5 položek škály Nortonové (každá 1–4 body, celkem 5–20 bodů): 1. Fyzický stav, 2. Stav vědomí, 3. Aktivita, 4. Pohyblivost, 5. Inkontinence.","Výsledek škály: 15–20 bodů = nízké riziko | 13–14 bodů = zvýšené riziko | 12 bodů a méně = VYSOKÉ riziko vzniku dekubitů.","Imobilizační syndrom (následky dlouhého ležení): Svalová atrofie a kontraktury kloubů, dekubity, zápal plic (mělký dech a městnání hlenů), žilní trombóza, zácpa, infekce močových cest a apatie/deprese."]},{id:"mob-kinestetika-pady",title:"4.4 Kinestetika, bezpečná manipulace a prevence pádů",summary:"Správná ergonomie chrání jak důstojnost a klouby seniora, tak páteř pečovatele.",keyPoints:["Zlaté pravidlo pro pečovatele: Široký stoj, rovná záda, zpevněný střed těla, zvedat silou nohou (pokrčená kolena), přenášet váhu a být co nejblíže klientovi. U těžších klientů vždy pracovat ve dvou nebo použít zvedák/skluznou podložku!","Bezpečnost s invalidním vozíkem: PŘED KAŽDÝM přesunem (na postel, na WC, z vozíku) VŽDY ZABRZDETE OBA KOLA vozíku a sklopte/odklopte stupačky!","Prevence pádů v DS: Pevná uzavřená obuv s protiskluzovou podrážkou (nikoliv nazouvací pantofle!), suchá podlaha bez koberců a kabelů, dostatek světla (i noční světélko na WC), pomalé vstávání z lůžka (prevence ortostatické hypotenze) a dosahové zvonky."]}],examTips:["Nezapomeňte obrácenou logiku škály Nortonové: málo bodů (≤ 12) = velký průšvih (vysoké riziko)!","Při otázce na manipulaci s klientem vždy jako první větu řekněte: „Zajistím komunikaci s klientem, zabrzdím lůžko i vozík a přizvu kolegu nebo použiji pomůcku.“"],examTraps:[{trap:"„Když uvidím na kříži zarudlé místo I. stupně, pořádně ho namasíruji francovkou, aby se prokrvilo.“",truth:"ZÁSADNÍ CHYBA! Masáž poškozené tkáně prohloubí mikrotraumata a zrychlí vznik hlubokého dekubitu. Místo jen odlehčíme, omyjeme a nahlásíme sestře."},{trap:"„Pod kolena ležícímu klientovi dáme polštář a tím ochráníme paty.“",truth:"POZOR! Polštář jen pod kolenem může stlačovat podkolenní cévy a podporovat trombózu. Podkládáme celou délku lýtek tak, aby paty zůstaly ve vzduchu."}]},{id:"komunikace-demence",order:5,title:"Komunikace, psychologie stáří, demence, validace a bazální stimulace",shortTitle:"Komunikace & Demence",subtitle:"Demence vs. Delirium vs. Deprese, validace Naomi Feil, bazální stimulace a smyslové poruchy",estimatedMinutes:22,accentColor:"violet",badgeText:"Okruh 5 · Psychologie & Přístup",overview:"Práce s pamětí, dezorientací a změnami nálad tvoří polovinu úspěchu v domově pro seniory. U zkoušky musíte suverénně rozlišit demenci od akutního deliria, vysvětlit validaci a ukázat, jak mluvit s nedoslýchavým či nevidomým klientem.",sections:[{id:"kom-3d",title:"5.1 Klíčové rozlišení „3D“: Demence vs. Delirium vs. Deprese",summary:"Zmatenost seniora nemusí vždy znamenat demenci. Záměna s deliriem může klienta ohrozit na životě!",keyPoints:["Demence (např. Alzheimerova nemoc): Začíná pomalu a plíživě (měsíce až roky), postupně se zhoršuje. Vědomí a bdělost jsou zachovány, vázne krátkodobá paměť, orientace a řeč.","Delirium (akutní zmatenost): Vzniká NÁHLE (hodiny až dny), stav během dne kolísá (často horší v noci), bývá porucha pozornosti, halucinace či neklid. Příčina je TĚLESNÁ (dehydratace, infekce močových cest, horečka, bolest, léky) a při včasné léčbě je VRATNÉ!","Deprese (pseudodemence): Často po ztrátě blízkého nebo nástupu do DS. Smutek, ztráta radosti, poruchy spánku, klient na otázky odpovídá „Nevím, to nemá cenu“ (na rozdíl od demence, kdy si vymýšlí – konfabuluje)."],table:{headers:["Znak","Demence","Delirium","Deprese"],rows:[["Nástup","Pomalý, plíživý (měsíce/roky)","Náhlý (hodiny až dny)","Týdny až měsíce"],["Průběh","Postupně zhoršující, stabilní v rámci dne","Kolísavý (horší večer a v noci)","Ranní pesimum (ráno nejhůř), smutek"],["Léčitelnost","Chronická (zmírnění průběhu)","VRATNÁ po odstranění příčiny!","Dobře léčitelná terapií a léky"]]}},{id:"kom-validace-rem",title:"5.2 Validace (Naomi Feil), Reminiscence a Biografický přístup",summary:"Když se dezorientovaný senior chce vrátit domů za maminkou nebo do práce, logické hádání vede jen ke strachu a agresi.",keyPoints:["Validace (potvrzení pocitů): Nevyvracíme klientovi jeho subjektivní realitu („Vaše maminka už dávno umřela“), ale uznáme emoci za ní („Stýská se vám po mamince, byla jste na ni zvyklá, povězte mi, jaká byla“). Používáme otevřené otázky (Kdo, Co, Kdy, Kde – NIKDY ne „Proč“!), udržujeme vřelý oční kontakt a klidný hlas.","Sundowning (syndrom západu slunce): Navečer s únavou a šerem narůstá úzkost a bloudění. Pomáhá rozsvítit teplé světlo, nabídnout teplý čaj a klidnou známou činnost.","Reminiscence: Práce se vzpomínkami pomocí fotografií, starých kuchyňských předmětů, písní mládí – posiluje identitu a sebeúctu.","Biografický přístup: Znalost životního příběhu klienta (povolání, koníčky, návyky) umožňuje porozumět jeho chování."]},{id:"kom-bazalni",title:"5.3 Bazální stimulace (prof. Andreas Fröhlich)",summary:"Pomáhá těžce nemocným a ležícím klientům vnímat vlastní tělo a okolní svět skrze jednoduché známé smyslové podněty.",keyPoints:["Iniciální dotek: Vždy na začátku i na konci kontaktu klidný, jednoznačný dotek na předem dohodnuté místo (např. rameno nebo předloktí) současně s oslovením.","Somatická stimulace – koupele: Uklidňující koupel (tahy žínkou PO směru růstu chloupků – od hlavy k nohám, pro neklidné a úzkostné klienty před spaním) vs. Povzbuzující koupel (tahy PROTI směru růstu chloupků, ráno pro apatické klienty).","Poloha hnízdo: Obklopení klienta stočenými přikrývkami nebo polštáři dává ležícímu člověku pocit bezpečí a jasných hranic vlastního těla."]},{id:"kom-smysly",title:"5.4 Komunikace se seniory se zrakovým, sluchovým a řečovým postižením",summary:"Respektující komunikace odstraňuje izolaci a předchází zbytečnému označení klienta za „zmateného“.",keyPoints:["Porucha sluchu: Mluvit zřetelně zpříma (ne ze strany ani zezadu!), nekřičet (křik zkresluje tóny a působí agresivně), snížit hluk rádia/TV, kontrolovat čistotu a baterii sluchadla.","Porucha zraku: Hned po vstupu se představit a říct, co budete dělat; při jídle popsat rozložení na talíři podle hodinového ciferníku (na 12 brambory, na 6 maso, na 3 omáčka); nepokládat předměty jinam, než je klient zvyklý.","Afázie (po mrtvici): Neznamená pokles inteligence! Mluvit v krátkých větách, klást otázky na ANO/NE, dát čas na odpověď a nedoplňovat za klienta každé slovo bez dovolení."]}],examTips:["Při příkladu paní, která balí kufr a „musí domů uvařit dětem“, použijte validaci: potvrďte její lásku k rodině a péči, nezapírejte její věk a jemně odveďte pozornost.","U nevidomého seniora u zkoušky vždy zazářite „pravidlem hodinového ciferníku“ na talíři a představením se ihned u dveří."],examTraps:[{trap:"„Když babička s Alzheimerem hledá maminku, je potřeba jí každý den jasně říct pravdu, že maminka před 40 lety zemřela, aby se zorientovala.“",truth:"CHYBA! To by jí způsobovalo každý den nový šok a zármutek jako poprvé. Používáme validaci a podporujeme pocit bezpečí."},{trap:"„Náhlá noční zmatenost u dosud bystré klientky znamená, že přes noc dostala Alzheimerovu demenci.“",truth:"NE! Náhlý vznik zmatenosti ukazuje na DELIRIUM (často infekce močových cest nebo dehydratace) – je nutné ihned přivolat sestru/lékaře!"}]},{id:"aktivizace-paliativa",order:6,title:"Prevence závislosti, aktivizace a paliativní péče (doprovázení)",shortTitle:"Aktivizace & Paliativa",subtitle:"Podpora soběstačnosti, druhy aktivizace, 5 fází Kübler-Rossové a důstojný závěr života",estimatedMinutes:18,accentColor:"rose",badgeText:"Okruh 6 · Smysl & Doprovázení",overview:"Sociální péče v domově pro seniory nemá být jen „údržba těla“. Spojuje podporu zbývající soběstačnosti, radost z aktivního dne a v závěru života lidsky citlivou paliativní a hospicovou péči bez osamění.",sections:[{id:"akt-prevence-zavislosti",title:"6.1 Prevence vzniku závislosti na sociální službě",summary:"Zlaté pravidlo sociální práce zní: „Nepřebírejte za klienta to, co s vaší trpělivou podporou ještě zvládne sám.“",keyPoints:["Riziko „naučené bezmocnosti“: Když spěchající pečovatel seniora vždy sám nakrmí, obuje a umyje, senior za pár týdnů ztratí dovednost i chuť cokoliv zkoušet.","Zásada přiměřené pomoci (princip podpory): Dát klientovi čas, připravit pomůcky (např. podavač ponožek, silnější rukojeť lžíce), pochválit i drobný pokrok a pomoci jen s tou částí úkonu, která už nejde (např. zapnout poslední knoflík na zádech)."]},{id:"akt-metody",title:"6.2 Aktivizační a volnočasové techniky v domově pro seniory",summary:"Aktivizace vychází z individuálního plánu a zájmů klienta – nesmí být povinná ani infantilní (nedávat dospělým seniorům dětské omalovánky bez kontextu).",keyPoints:["Kognitivní a paměťový trénink: Kvízy, přísloví, doplňování slov, čtení zpráv a povídání nad kronikou.","Pohybové a ergoterapeutické aktivity: Skupinové cvičení na židlích, vaření a pečení v kuchyňce, práce s hlínou či látkou (jemná motorika).","Arteterapie, muzikoterapie a animoterapie (canisterapie / felinoterapie): Zpěv známých lidových písní často „probudí“ i jinak uzavřené klienty s těžkou demencí; kontakt se psem snižuje úzkost a krevní tlak.","Individuální aktivizace u lůžka: Pro ležící klienty – předčítání, poslech audioknih, doteková stimulace, rozhovor nad rodinným albem."]},{id:"akt-paliativa",title:"6.3 Paliativní a hospicová péče v domově pro seniory",summary:"Paliativní péče neslibuje vyléčení, ale slibuje, že člověk nebude trpět nesnesitelnou bolestí, dušností a nezůstane v těžké chvíli sám.",keyPoints:["Cíl paliativní péče: Maximální kvalita života v jeho závěru, úleva od bolesti, dušnosti a strachu, podpora rodiny i v době truchlení.","5 fází vyrovnávání dle Elisabeth Kübler-Rossové: 1. Popření (šok – „To nemůže být pravda“), 2. Hněv („Proč zrovna já?!“ – nikdy nebrat osobně!), 3. Smlouvání („Kdybych ještě zažil Vánoce...“), 4. Deprese (hluboký smutek), 5. Smíření (klidné přijetí).","Praktická péče o umírajícího: Měkké přítmí a klid, nevysilovat zbytečnými výkony, časté zvlhčování rtů a dutiny ústní (boraxglycerinem nebo heřmánkem/vodou), držení za ruku (sluch zůstává nejdéle!), umožnit přítomnost rodiny či duchovního a respektovat dříve vyslovená přání.","Péče o tělo zemřelého: Po konstatování smrti lékařem s úctou upravit tělo (vyrovnat končetiny, zavřít oči, zajistit čelist), zachovat pietu pro rozloučení rodiny a spolubydlících."]}],examTips:["Umějte vyjmenovat všech 5 fází dle Kübler-Rossové přesně v pořadí: Popření – Hněv – Smlouvání – Deprese – Smíření.","U aktivizace vždy zdůrazněte „dobrovolnost a respekt k dospělosti seniora“ (žádné nucení ani dětské hry, pokud si je klient sám nepřeje)."],examTraps:[{trap:"„Umírající klient v bezvědomí už nic nevnímá, takže při práci v pokoji se můžeme normálně bavit o víkendu nebo soukromí.“",truth:"NIKDY! Sluch je poslední smysl, který vyhasíná. V pokoji umírajícího mluvíme vždy klidně, s úctou a přímo na něj."}]},{id:"narocne-situace",order:7,title:"Zvládání agrese, krizové situace, syndrom vyhoření a supervize",shortTitle:"Náročné situace & Vyhoření",subtitle:"Deeskalace konfliktu, šetrná sebeobrana, krizová intervence a prevence vyhoření",estimatedMinutes:16,accentColor:"indigo",badgeText:"Okruh 7 · Bezpečí & Psychohygiena",overview:"Práce v přímé péči je emočně i fyzicky náročná. Tento okruh učí, jak bezpečně zvládnout agresivního nebo vyděšeného klienta bez použití násilí a jak pečovat o vlastní duševní zdraví, abyste v profesi nevyhořeli.",sections:[{id:"nar-agrese-deeskalace",title:"7.1 Příčiny agrese seniorů a bezpečná deeskalace",summary:"Agrese v domově pro seniory téměř nikdy není „zlý úmysl“ – je to nouzový signál strachu, bolesti, studu nebo zmatenosti.",keyPoints:["Hledejte skrytý spouštěč: Neřešená bolest, plný močový měchýř, strach při svlékání cizím člověkem, hluk, příliš rychlý pohyb pečovatele zezadu nebo frustrace z nepochopení.","Pravidla verbální deeskalace: Zachovat klid a nízký tón hlasu, nekřičet a neargumentovat, nehodnotit („Vy jste zase zlý“), naslouchat, nabídnout prostor a volbu („Chcete raději sprchu až po obědě?“).","Fyzická bezpečnost pečovatele: Držet si bezpečný odstup (na délku paže a půl), stát mírně bokem (ne čelně v útočném postoji), mít VŽDY volnou únikovou cestu ke dveřím (nikdy se nenechat zatlačit do rohu!), sundat visací šperky/dlouhé vlasy mít sepnuté.","Šetrná sebeobrana: Nikdy neútočit ani netrestat – cílem je jen vyprostit se z úchopu (např. tahem směrem k palci útočníka), odstoupit do bezpečí a přivolat posilu týmu."]},{id:"nar-krizova",title:"7.2 Krizová intervence a podpora klienta v akutní tísni",summary:"Krize nastává při náhlé ztrátě (úmrtí partnera, zhoršení zraku/mobility, přesun z domova do DS), kdy běžné mechanismy zvládání selhávají.",keyPoints:["První psychologická pomoc: Být tu s klientem, zajistit fyzické bezpečí a klid, projevit lidský zájem, nebagatelizovat („Vždyť se nic neděje, na to si zvyknete“), ale přijmout slzy a smutek.","Když klient mluví o sebevraždě nebo ztrátě smyslu života: Nikdy to nebrat na lehkou váhu! Vyslechnout bez souzení, nenechat klienta o samotě v rizikovém stavu a OKAMŽITĚ informovat vedoucího/sestru/lékaře."]},{id:"nar-vyhoreni-supervize",title:"7.3 Syndrom vyhoření (burnout) a role supervize",summary:"Kdo neumí pečovat sám o sebe, dlouho nevydrží s láskou pečovat o druhé.",keyPoints:["Projevy syndromu vyhoření: Chronická únava a nespavost, emoční otupělost a cynismus ke klientům („už je jen přebaluji jako balíky“), podrážděnost na kolegy, pocit marnosti a somatické potíže (bolesti zad, hlavy, časté nemoci).","Prevence (psychohygiena): Jasné hranice mezi prací a domovem, rituál „odložení práce za dveřmi domova“, pohyb, koníčky, přiměřený humor v týmu, sdílení emocí.","Supervize vs. Intervize: Supervize je vedená nezávislým externím odborníkem (bezpečný prostor pro reflexi těžkých případů a týmových vztahů); intervize je vzájemná podpora a porada kolegů na stejném pracovišti."]}],examTips:["U otázky na agresivního klienta vyjmenujte jako první: 1. Bezpečná vzdálenost a úniková cesta, 2. Klidný hlas a zjištění příčiny (bolest, strach, WC), 3. Přivolání kolegy.","Jasně odlište supervizi (podpora a prevence vyhoření, externí odborník) od manažerské kontroly."],examTraps:[{trap:"„Když na mě klient s demencí zvedne ruku, musím mu přísně ukázat autoritu a zvýšit hlas, aby si nedovoloval.“",truth:"NAOPAK! Křik a demonstrace síly jen zvyšují jeho strach a spouštějí další obranu či agresi. Vždy zpomalte, snižte hlas, udělejte krok zpět a dejte prostor."}]},{id:"prvni-pomoc",order:8,title:"První pomoc, akutní stavy seniorů a hygienicko-epidemiologický režim",shortTitle:"První pomoc & Epidemiologie",subtitle:"KPR 30:2, dušení, CMP (FAST), zlomenina krčku, hypoglykémie a bariérový režim",estimatedMinutes:22,accentColor:"red",badgeText:"Okruh 8 · Život zachraňující postupy",overview:"Každý pracovník v sociálních službách má zákonnou i morální povinnost poskytnout první pomoc. Zde jsou naprosto přesné postupy pro zástavu oběhu, mrtvici, dušení při jídle, pád se zlomeninou krčku, hypoglykémii i prevenci šíření infekcí.",sections:[{id:"pp-kpr",title:"8.1 Zástava oběhu (KPR) a volání záchranné služby 155",summary:"U zástavy rozhodují vteřiny – stlačování hrudníku nahrazuje pumpu srdce, dokud nepřijede ZZS nebo není použit AED.",keyPoints:["Postup krok za krokem: 1. Bezpečí pro zachránce → 2. Oslovení a zatřesení rameny (reakce?) → 3. Záklon hlavy a zvednutí brady, kontrola normálního dýchání max. 10 sekund → 4. Při bezvědomí bez normálního dýchání ihned volat 155 (hlasitý odposlech!) a poslat pro AED.","Pozor na GASPING (lapavé dýchání): Pomalé, chrčivé nádechy „jak kapr na suchu“ NEJSOU normální dýchání – znamenají srdeční zástavu! Okamžitě zahajte KPR!","Resuscitace dospělého (KPR): Střed hrudníku (dolní polovina hrudní kosti), hloubka 5–6 cm, frekvence 100–120 stlačení/min. Poměr 30 stlačení : 2 vdechům (pokud netroufáte či nemáte pomůcku pro umělé dýchání, provádějte nepřetržitě samotnou masáž srdce!)."]},{id:"pp-cmp-duseni",title:"8.2 Mrtvice (CMP – test FAST) a akutní dušení soustem",summary:"V domově pro seniory jsou cévní mozková příhoda a vdechnutí potravy nejčastější akutní stavy mimo pád.",keyPoints:["Test FAST (podezření na CMP / mrtvici): F (Face) = pokleslý ústní koutek při úsměvu; A (Arm) = pokles jedné předpažené ruky; S (Speech) = nesrozumitelná, setřelá řeč nebo neschopnost mluvit; T (Time) = čas ihned volat 155 a zaznamenat přesný čas vzniku příznaků!","Dušení (obstrukce dýchacích cest): 1. Pokud senior účinně kašle, jen ho povzbuzujeme ke kašli (nebít do zad při silném kašli!). 2. Pokud nemůže mluvit, kašlat ani se nadechnout: provedeme 5 rázných úderů hranou dlaně mezi lopatky v předklonu → pokud nepomůže, 5× Heimlichův manévr (stlačení nadbřišku dovnitř a nahoru) a střídáme 5:5. Upadne-li do bezvědomí, voláme 155 a zahajujeme KPR."]},{id:"pp-pad-hypo-epi",title:"8.3 Pád seniora (zlomenina krčku), hypoglykémie, krvácení a epilepsie",summary:"Správná reakce po pádu nebo při poklesu cukru zabrání trvalému poškození nebo druhotnému šoku.",keyPoints:["Pád a podezření na zlomeninu krčku stehenní kosti: Zlomená dolní končetina bývá typicky ZKRÁCENÁ a ZEVNĚ ROTOVANÁ (špička směřuje ven), silná bolest v třísle/kyčli. NIKDY klienta násilím nezvedejte ani nepokládejte na lůžko! Zajistěte tepelný komfort, podložte koleno/končetinu v nalezené poloze, uklidňujte a ihned volejte sestru a 155.","Hypoglykémie (nízký cukr < 3,9 mmol/l): Rychlý nástup! Studený pot, třes, slabost, bledost, neklid či zmatenost. Při vědomí IHNED podat rychlý cukr (sladký nápoj, džus, hroznový cukr) a volat sestru. V bezvědomí NIC DO ÚST NEPODÁVAT (riziko udušení!), volat 155.","Epileptický záchvat: Odstranit tvrdé předměty z okolí, podložit hlavu něčím měkkým, měřit délku záchvatu! NIKDY NEBRÁNIT křečím násilím a NIKDY NIC NEVKLÁDAT DO ÚST! Po odeznění uložit do zotavovací polohy na bok a hlídat dech.","Masivní krvácení: Okamžitě zatlačit prsty/tlakovým obvazem přímo v ráně (v rukavicích!), zvednout končetinu nad úroveň srdce a volat 155."]},{id:"pp-epidemiologie",title:"8.4 Hygienicko-epidemiologický režim a bariérová péče",summary:"V pobytovém zařízení s oslabenými seniory se infekce šíří velmi rychle, pokud se podcení hygiena rukou a prádla.",keyPoints:["Hygiena rukou (5 momentů WHO): Před kontaktem s klientem, před čistým/aseptickým výkonem, po kontaktu s tělesnými tekutinami, po kontaktu s klientem a po kontaktu s okolím klienta. Správná dezinfekce rukou trvá alespoň 30 sekund (včetně palců, meziprstí a špiček prstů).","OOPP (osobní ochranné pracovní prostředky): Jednorázové rukavice, ochranný plášť/zástěra, případně respirátor či štít při infekci. Rukavice nenahrazují dezinfekci rukou – po jejich sundání vždy dezinfikovat ruce!","Bariérový režim (např. svrab, norovirový průjem, MRSA, COVID-19): Izolace klienta na pokoji, vyčleněné pomůcky, infekční prádlo do rozpustných/označených pytlů (netřepat s prádlem po chodbě!)."]}],examTips:["Zásadní zkušební hláška u epilepsie: „Do úst nic nevkládám, křečím nebráním, chráním jen hlavu a měřím čas!“","U zlomeniny krčku nezapomeňte popsat dva typické znaky: zkrácená noha + vytočená špička ven (zevní rotace) + zákaz zvedání."],examTraps:[{trap:"„Když senior leží na zemi, lapavě sípe jako kapr na suchu, ještě dýchá – nesmím mu stlačovat hrudník.“",truth:"CHYBA! To je gasping (terminální lapavé dechy při zástavě srdce). Bereme ho jako ZÁSTAVU dýchání a okamžitě zahajujeme KPR 30:2!"},{trap:"„Když mám na sobě jednorázové rukavice, nemusím si po sundání dezinfikovat ruce.“",truth:"NE! Rukavice mívají mikropóry a při svlékání se ruce mohou kontaminovat. Po sundání rukavic vždy následuje hygiena rukou."}]}],gt=[{id:"fc-leg-01",moduleId:"legislativa",question:"Který zákon upravuje sociální služby v České republice a odkdy platí?",answer:"Zákon č. 108/2006 Sb., o sociálních službách (účinný od 1. 1. 2007). Prováděcím předpisem je vyhláška č. 505/2006 Sb.",mnemonic:"108 = zákon (to hlavní), 505 = prováděcí vyhláška, která zákon rozvádí do detailu (úkony, úhrady, standardy).",tags:["zákon 108/2006","vyhláška 505/2006"]},{id:"fc-leg-02",moduleId:"legislativa",question:"Jaké jsou 3 formy poskytování sociálních služeb podle § 33 zákona č. 108/2006 Sb.?",answer:`1. Pobytové (s ubytováním, např. domov pro seniory)
2. Ambulantní (klient dochází bez ubytování, např. denní stacionář)
3. Terénní (služba jde za klientem domů, např. pečovatelská služba).`,mnemonic:"P-A-T: Pobytová, Ambulantní, Terénní.",tags:["formy služeb"]},{id:"fc-leg-03",moduleId:"legislativa",question:"Jaký je rozdíl mezi Domovem pro seniory (§ 49) a Domovem se zvláštním režimem (§ 50)?",answer:`Domov pro seniory (§ 49) je pro osoby důchodového věku se sníženou soběstačností z důvodu věku.
Domov se zvláštním režimem (§ 50) má upravený režim pro lidi s chronickým duševním onemocněním, závislostí nebo stařeckou či Alzheimerovou demencí.`,tags:["§ 49","§ 50"]},{id:"fc-leg-04",moduleId:"legislativa",question:"Vyjmenujte všech 10 základních životních potřeb (§ 9 zákona 108/2006 Sb.).",answer:"1. Mobilita, 2. Orientace, 3. Komunikace, 4. Stravování, 5. Oblékání a obouvání, 6. Tělesná hygiena, 7. Výkon fyziologické potřeby, 8. Péče o zdraví, 9. Osobní aktivity, 10. Péče o domácnost (u dětí do 18 let se nehodnotí!).",mnemonic:"M-O-K-S-O-T-V-P-O-P",tags:["10 potřeb","příspěvek na péči"]},{id:"fc-leg-05",moduleId:"legislativa",question:"Jaká je v roce 2026 měsíční výše Příspěvku na péči pro dospělé (18+) v I., II., III. a IV. stupni?",answer:`I. stupeň (3–4 potřeby): 1 300 Kč
II. stupeň (5–6 potřeb): 5 400 Kč
III. stupeň (7–8 potřeb): 14 800 Kč
IV. stupeň (9–10 potřeb): 23 000 Kč v pobytovém zařízení / 27 000 Kč doma.`,tags:["příspěvek na péči","2026"]},{id:"fc-leg-06",moduleId:"legislativa",question:"Kolik procent příjmu musí klientovi v domově pro seniory ze zákona zůstat po úhradě ubytování a stravy?",answer:"Alespoň 15 % z jeho měsíčního příjmu (§ 73 odst. 3 zákona č. 108/2006 Sb.). Pokud důchod nestačí, úhrada se přiměřeně sníží.",tags:["úhrady","§ 73"]},{id:"fc-leg-07",moduleId:"legislativa",question:"Jaké jsou maximální denní úhrady za ubytování a stravu v domově pro seniory v roce 2026?",answer:`Ubytování: max. 335 Kč/den (vícelůžkový pokoj) nebo max. 380 Kč/den (jednolůžkový pokoj).
Celodenní strava: max. 290 Kč/den (samotný oběd max. 135 Kč/den).`,tags:["vyhláška 505/2006","2026"]},{id:"fc-leg-08",moduleId:"legislativa",question:"Jaký je minimální rozsah kvalifikačního kurzu PSS a povinného ročního dalšího vzdělávání (§ 116)?",answer:`Kvalifikační kurz: minimálně 150 hodin.
Další vzdělávání pracovníků v sociálních službách: minimálně 24 hodin za každý kalendářní rok.`,tags:["§ 116","vzdělávání"]},{id:"fc-leg-09",moduleId:"legislativa",question:"Kdy končí zákonná povinnost mlčenlivosti pracovníka v sociálních službách (§ 100)?",answer:"Nikdy nekončí samotným odchodem z práce – povinnost mlčenlivosti trvá i po skončení pracovněprávního vztahu!",tags:["mlčenlivost","§ 100"]},{id:"fc-leg-10",moduleId:"legislativa",question:"Kterých 8 základních činností zajišťuje Domov pro seniory (§ 15 vyhl. 505/2006)?",answer:"1. Ubytování (vč. úklidu a praní), 2. Strava (min. 3 hlavní jídla), 3. Pomoc při běžných úkonech péče o vlastní osobu, 4. Pomoc při osobní hygieně, 5. Zprostředkování kontaktu se společenským prostředím, 6. Sociálně terapeutické činnosti, 7. Aktivizační činnosti, 8. Pomoc při uplatňování práv a osobních záležitostí.",tags:["§ 15","základní činnosti"]},{id:"fc-leg-11",moduleId:"legislativa",question:"Kdo má právo na bezplatné základní sociální poradenství?",answer:"Každá osoba, která se ocitne v nepříznivé sociální situaci nebo potřebuje informace (§ 37). Musí ho bezplatně poskytnout každý poskytovatel sociálních služeb.",tags:["poradenství"]},{id:"fc-std-01",moduleId:"standardy-prava",question:"Kolik je Standardů kvality sociálních služeb a jak se dělí?",answer:`Celkem 15 standardů (příloha č. 2 vyhlášky 505/2006 Sb.):
• 1–8 Procesní (práce s klientem)
• 9–10 Personální (zaměstnanci)
• 11–15 Provozní (prostředí a organizace).`,mnemonic:"8 Procesních + 2 Personální + 5 Provozních = 15.",tags:["standardy kvality"]},{id:"fc-std-02",moduleId:"standardy-prava",question:"Co upravuje Standard č. 5 a kdo ho v praxi vede?",answer:"Individuální plánování průběhu sociální služby. Vede ho klíčový pracovník společně se samotným klientem podle jeho přání, zvyklostí a osobních cílů.",tags:["Standard 5","individuální plán"]},{id:"fc-std-03",moduleId:"standardy-prava",question:"Co platí pro stížnosti na kvalitu služby (Standard č. 7)?",answer:"Klient si může stěžovat ústně, písemně i anonymně nebo prostřednictvím zvolené osoby, aniž by mu za to hrozil jakýkoliv postih. Stížnost je vnímána jako podnět ke zlepšení služby.",tags:["Standard 7","stížnosti"]},{id:"fc-std-04",moduleId:"standardy-prava",question:"Kdy jedině lze podle § 89 použít opatření omezující pohyb osob?",answer:"Zásadně NELZE. Jedinou výjimkou je PŘÍMÉ OHROŽENÍ ZDRAVÍ A ŽIVOTA klienta nebo jiných osob, po dobu NEZBYTNĚ NUTNOU a až po vyčerpání mírnějších prostředků (slovní zklidnění).",tags:["§ 89","omezení pohybu"]},{id:"fc-std-05",moduleId:"standardy-prava",question:"Jaká je zákonná hierarchie (pořadí) prostředků omezení pohybu podle § 89 odst. 4?",answer:`1. Fyzický úchop
2. Místnost zřízená k bezpečnému pobytu
3. Léčivé přípravky (pouze na základě ordinace přivolaného lékaře a za jeho přítomnosti).`,tags:["§ 89","hierarchie"]},{id:"fc-std-06",moduleId:"standardy-prava",question:"Jaké jsou povinnosti poskytovatele po použití omezujícího opatření (§ 89)?",answer:"Přivolat lékaře (pokud nestačil jen fyzický úchop), vést podrobný písemný záznam v evidenci a informovat zákonného zástupce nebo opatrovníka klienta.",tags:["§ 89","evidence"]},{id:"fc-std-07",moduleId:"standardy-prava",question:"Co znamená zkratka EAN v sociální práci se seniory?",answer:"Elder Abuse and Neglect – týrání, zanedbávání a zneužívání seniorů (fyzické, psychické, sexuální, finanční nebo zanedbávání péče).",tags:["EAN","ochrana práv"]},{id:"fc-std-08",moduleId:"standardy-prava",question:"Jak by měl pracovník reagovat, když mu klient nebo rodina nabízí peníze či cenný dar?",answer:"Slušně, laskavě, ale pevně odmítnout (prevence střetu zájmů a zvýhodňování dle Standardu č. 2 a Etického kodexu) a událost oznámit nadřízenému.",tags:["etika","dary"]},{id:"fc-std-09",moduleId:"standardy-prava",question:"Co je zásadní chyba u oboustranně vytažených postranic na lůžku?",answer:"Pokud brání pohyblivému klientovi vstát bez jeho souhlasu a bez krizového důvodu, jde o nelegální omezení osobní svobody (§ 89) a navíc hrozí těžký pád při pokusu postranici přelézt.",tags:["postranice","§ 89"]},{id:"fc-std-10",moduleId:"standardy-prava",question:"Co je to „infantilní komunikace“ a proč je u seniorů nepřijatelná?",answer:"Jednání se seniorem jako s malým dítětem (zdrobněliny, nevyžádané tykání, povelový tón). Snižuje lidskou důstojnost a podporuje naučenou bezmocnost.",tags:["důstojnost","etika"]},{id:"fc-std-11",moduleId:"standardy-prava",question:"K čemu slouží Standard č. 14 (Nouzové a havarijní situace)?",answer:"Zajišťuje, aby pracovníci i klienti přesně věděli, jak postupovat při požáru, výpadku proudu, náhlém zdravotním kolapsu nebo agresivitě klienta.",tags:["Standard 14","nouzové situace"]},{id:"fc-pec-01",moduleId:"prima-pece",question:"Jaký je správný postup mytí těla klienta na lůžku (od čeho k čemu)?",answer:"Od nejčistších částí k nejvíce znečištěným: obličej (čistá voda, oči od zevního koutku k vnitřnímu) → krk, hrudník a ruce → záda → nohy → nakonec čistou žínkou genitálie a konečník (vždy zepředu dozadu!).",tags:["hygiena","lůžko"]},{id:"fc-pec-02",moduleId:"prima-pece",question:"Proč pracovník v sociálních službách NESTŘÍHÁ nehty na nohou klientovi s cukrovkou?",answer:"U diabetiků je zhoršené hojení a citlivost (diabetická noha). I drobný zástřih nůžkami může vést ke vředům a amputaci. Nehty jen opatrně pilujeme nebo ošetří odborná pedikérka/sestra.",tags:["diabetes","hygiena"]},{id:"fc-pec-03",moduleId:"prima-pece",question:"Jak správně a bezpečně čistit snímatelnou zubní protézu seniora?",answer:"Kartáčkem a jemnou pastou (ne horkou vodou, aby se nedeformovala!) nad umyvadlem napuštěným vodou nebo vyloženým ručníkem, aby při vyklouznutí nepraskla.",tags:["dutina ústní","protéza"]},{id:"fc-pec-04",moduleId:"prima-pece",question:"Jaké jsou hlavní varovné příznaky dehydratace u seniora?",answer:"Suché rty a jazyk, tmavá a zapáchající moč, zácpa, únava, pokles tlaku při vstávání, zhoršený kožní turgor (pod klíční kostí) a NÁHLÁ ZMATENOST (delirium).",tags:["dehydratace","tekutiny"]},{id:"fc-pec-05",moduleId:"prima-pece",question:"Jaká poloha je nutná při krmení seniora a jak dlouho po jídle?",answer:"Vzpřímený sed (90°) nebo vysoký polosed – NIKDY vleže! Po dojedení nechat klienta v sedu ještě nejméně 20–30 minut jako prevenci aspirace (vdechnutí).",tags:["výživa","aspirace"]},{id:"fc-pec-06",moduleId:"prima-pece",question:"Co znamenají základní čísla nemocničních diet č. 2, č. 3 a č. 9?",answer:`• Dieta č. 2 = šetřící (lehce stravitelná při potížích se žaludkem/žlučníkem)
• Dieta č. 3 = racionální (běžná zdravá strava)
• Dieta č. 9 = diabetická (omezení jednoduchých cukrů).`,mnemonic:"2 = šetřící bříško, 3 = třetí běžná, 9 = devítka cukrovka.",tags:["diety","výživa"]},{id:"fc-pec-07",moduleId:"prima-pece",question:"Jaká dvě zlatá pravidla platí pro sběrný sáček permanentního močového katétru (PMK)?",answer:`1. Sáček musí být VŽDY pod úrovní močového měchýře (prevence zpětného toku a infekce).
2. Sáček se NIKDY nesmí dotýkat podlahy (zavěstit na rám lůžka/vozíku).`,tags:["PMK","katétr"]},{id:"fc-pec-08",moduleId:"prima-pece",question:"Jaké jsou kompetence PSS vs. zdravotní sestry ohledně léků v domově pro seniory?",answer:"PSS NENÍ zdravotnický pracovník – léky nepřipravuje do dávkovačů, neaplikuje injekce ani inzulin a nemění dávkování. Výhradně za to odpovídá všeobecná nebo praktická sestra.",tags:["kompetence","léky"]},{id:"fc-pec-09",moduleId:"prima-pece",question:"Co je intertrigo a jak mu u ležících či obézních seniorů předcházíme?",answer:"Opruzenina (zapaření kůže v kožních záhybech pod prsy, v tříslech, pod břichem). Prevencí je šetrné omytí, dokonalé vysušení přikládáním ručníku (nedrhnout!) a prodyšné prádlo či ochranný krém.",tags:["intertrigo","kůže"]},{id:"fc-pec-10",moduleId:"prima-pece",question:"Po kolika dnech bez stolice (obstipace) je nutné informovat zdravotní sestru?",answer:"Pokud klient neměl stolici déle než 3 dny (nebo má bolesti břicha či zvrací), vždy informujeme zdravotní sestru.",tags:["obstipace","vyprazdňování"]},{id:"fc-pec-11",moduleId:"prima-pece",question:"Co je to dysfagie a jak při ní upravujeme podávání stravy?",answer:"Porucha polykání. Podáváme pomalu po malých soustech ve vzpřímeném sedu, v klidu bez rozhovoru během sousta, případně využíváme kašovitou stravu a zahuštěné nápoje dle doporučení.",tags:["dysfagie","polykání"]},{id:"fc-mob-01",moduleId:"mobilita-dekubity",question:"Co je to dekubit a jaký je hlavní mechanismus jeho vzniku?",answer:"Proleženina – místní poškození kůže a podkoží způsobené dlouhodobým tlakem (a třením či střižnou silou), kdy dojde k uzavření drobných cév a nedokrvení (ischemii) tkáně.",tags:["dekubity","ischemie"]},{id:"fc-mob-02",moduleId:"mobilita-dekubity",question:"Jak poznáte dekubit I. stupně a co se s ním NESMÍ dělat?",answer:"Neblednoucí zarudnutí neporušené kůže (po zatlačení prstem skvrna nezbělá!). Ihned odlehčit tlak a nahlásit sestře. NIKDY zarudlé místo nemasírovat ani nedrhnout!",tags:["dekubit 1. stupeň"]},{id:"fc-mob-03",moduleId:"mobilita-dekubity",question:"Vyjmenujte 4 stupně dekubitů od nejlehčího po nejtěžší.",answer:`I. Neblednoucí zarudnutí neporušené kůže
II. Puchýř nebo povrchová odřenina/vřed
III. Hluboký vřed do podkoží (tuk)
IV. Rozsáhlý defekt až na sval, šlachu nebo kost.`,tags:["klasifikace dekubitů"]},{id:"fc-mob-04",moduleId:"mobilita-dekubity",question:"Která dvě místa jsou při poloze na zádech nejčastějším sídlem dekubitů?",answer:`1. Křížová kost a kostrč (sakrální oblast)
2. Paty (a dále lopatky, lokty a týl hlavy).`,tags:["predilekční místa"]},{id:"fc-mob-05",moduleId:"mobilita-dekubity",question:"Jak podložíme dolní končetiny vleže na zádech, abychom ochránili paty?",answer:"Podložíme celou délku lýtek měkkým válcem nebo polštářem tak, aby paty volně „visely ve vzduchu“. Nikdy nedáváme polštář jen těsně pod koleno (riziko trombózy).",tags:["paty","polohování"]},{id:"fc-mob-06",moduleId:"mobilita-dekubity",question:"Jaký je doporučený standardní interval polohování u imobilního klienta?",answer:"Každé 2 hodiny ve dne a každé 3 hodiny v noci (u vysoce rizikových klientů ještě častěji). Vždy zapisujeme do polohovacího záznamu.",tags:["polohování"]},{id:"fc-mob-07",moduleId:"mobilita-dekubity",question:"Proč je u ležícího klienta vhodnější 30° šikmá poloha na boku místo plné 90° polohy?",answer:"Při 90° poloze tlačí celá váha na ostrý kyčelní kloub (trochanter) a rameno. Při 30° poloze s klínem za zády se tlak rozloží do měkkého svalstva hýždí.",tags:["30° poloha","bok"]},{id:"fc-mob-08",moduleId:"mobilita-dekubity",question:"Jak funguje škála Nortonové (rozsah bodů a kdy je vysoké riziko dekubitů)?",answer:"Hodnotí 5 oblastí po 1–4 bodech (celkem 5–20 bodů): fyzický stav, vědomí, aktivita, pohyblivost, inkontinence. Čím NIŽŠÍ skóre, tím VYŠŠÍ riziko! 14 a méně = riziko; 12 a méně = vysoké riziko.",mnemonic:"Nortonová je obráceně: čím menší číslo, tím větší problém (≤ 12 = alarm!).",tags:["Nortonová","riziko"]},{id:"fc-mob-09",moduleId:"mobilita-dekubity",question:"Co patří do imobilizačního syndromu (důsledků dlouhého ležení)?",answer:"Dekubity, úbytek svalů a kontraktury kloubů, zápal plic (městnavá pneumonie), žilní trombóza, zácpa, močové infekce, odvápnění kostí a deprese.",tags:["imobilizační syndrom"]},{id:"fc-mob-10",moduleId:"mobilita-dekubity",question:"Co je absolutně první povinný krok před každým přesunem klienta z/na invalidní vozík?",answer:"ZABRZDIŤ OBĚ KOLA vozíku a odklopit/složit stupačky, aby se vozík pod klientem nerozjel!",tags:["vozík","bezpečnost"]},{id:"fc-mob-11",moduleId:"mobilita-dekubity",question:"Jakou obuv má mít senior v domově pro seniory jako prevenci pádů?",answer:"Pevnou, uzavřenou obuv s pevnou patou a protiskluzovou podrážkou (nikoliv volné nazouvací pantofle bez paty nebo chození v ponožkách).",tags:["prevence pádů","obuv"]},{id:"fc-kom-01",moduleId:"komunikace-demence",question:"Jaký je zásadní rozdíl mezi demencí a deliriem?",answer:`Demence vzniká pomalu a plíživě (měsíce/roky) a je nevratná.
Delirium vzniká NÁHLE (hodiny až dny), během dne kolísá, je vyvoláno tělesnou příčinou (infekce močových cest, dehydratace, léky) a při včasné léčbě je VRATNÉ!`,tags:["delirium","demence"]},{id:"fc-kom-02",moduleId:"komunikace-demence",question:"Jak poznáte u seniora depresi (pseudodemenci) oproti demenci?",answer:"Depresivní klient je smutný, zpomalený a na otázky často rezignovaně odpovídá „Nevím, to je jedno“. Klient s demencí se chyby snaží zakrýt nebo si vymýšlí (konfabuluje).",tags:["deprese","3D"]},{id:"fc-kom-03",moduleId:"komunikace-demence",question:"Co je hlavní myšlenka validace podle Naomi Feil?",answer:"Nepopíráme a nevyvracíme subjektivní realitu dezorientovaného seniora, ale uznáme a potvrdíme emoci za ní (např. stesk po mamince nebo potřebu být užitečný).",tags:["validace","Naomi Feil"]},{id:"fc-kom-04",moduleId:"komunikace-demence",question:"Proč se u klienta s demencí vyhýbáme otázce „PROČ“?",answer:"Otázka „Proč jste to udělal?“ vyžaduje logické zdůvodnění, kterého už poškozený mozek není schopen – vyvolává jen pocit selhání, stud a obranu. Ptáme se Kdo, Co, Kde, Kdy.",tags:["validace","komunikace"]},{id:"fc-kom-05",moduleId:"komunikace-demence",question:"Co znamená pojem „sundowning“ (syndrom západu slunce)?",answer:"Zhoršení neklidu, úzkosti, bloudění a zmatenosti u osob s demencí v pozdním odpoledni a podvečer při šeru a únavě. Pomáhá rozsvícení, teplý nápoj a klidná známá aktivita.",tags:["sundowning","demence"]},{id:"fc-kom-06",moduleId:"komunikace-demence",question:"Co je „iniciální dotek“ v konceptu Bazální stimulace (prof. Fröhlich)?",answer:"Jednoznačný, klidný a pevný dotek na dohodnutém místě těla (např. rameno nebo předloktí) na začátku a na konci každého setkání, aby imobilní klient bezpečně věděl o přítomnosti pečovatele.",tags:["bazální stimulace"]},{id:"fc-kom-07",moduleId:"komunikace-demence",question:"Jak se liší uklidňující a povzbuzující koupel v Bazální stimulaci?",answer:`• Uklidňující koupel (večer pro neklidné): tahy žínkou PO směru růstu chloupků (od hlavy dolů).
• Povzbuzující koupel (ráno pro apatické): tahy PROTI směru růstu chloupků (k srdci).`,mnemonic:"Hladíš pejska PO srsti = uklidníš ho. PROTI srsti = probudíš ho!",tags:["bazální stimulace","koupel"]},{id:"fc-kom-08",moduleId:"komunikace-demence",question:"Jak komunikujeme se seniorem s těžkou poruchou zraku při podávání jídla?",answer:"Hned u dveří se představíme, popíšeme polohu příboru i jídla na talíři podle hodinového ciferníku (na 12 brambory, na 6 maso, na 3 salát) a nepřemísťujeme mu osobní věci.",tags:["zrakové postižení","ciferník"]},{id:"fc-kom-09",moduleId:"komunikace-demence",question:"Na co si dát pozor při rozhovoru s nedoslýchavým seniorem?",answer:"Mluvit zpříma v úrovni očí (možnost odezírání), ztlumit televizi/rádio, mluvit zřetelně a trochu hlubším hlasem – NIKDY nekřičet (křik zkresluje tóny a působí agresivně).",tags:["sluchové postižení"]},{id:"fc-kom-10",moduleId:"komunikace-demence",question:"Co je to afázie a co nesmíte předpokládat u klienta po mrtvici s afázií?",answer:"Afázie je porucha řeči nebo jejího porozumění způsobená poškozením mozku. Klient NENÍ hloupý ani nesvéprávný – rozumí či přemýšlí mnohem lépe, než dokáže vyslovit.",tags:["afázie","CMP"]},{id:"fc-kom-11",moduleId:"komunikace-demence",question:"K čemu slouží reminiscenční terapie a biografický přístup?",answer:"Využívají dlouhodobou paměť seniora (staré fotky, hudbu, znalost původního povolání a zvyků) k posílení identity, radosti a pochopení jeho dnešního chování.",tags:["reminiscence","biografie"]},{id:"fc-akt-01",moduleId:"aktivizace-paliativa",question:"Jaký je rozdíl mezi podporou soběstačnosti a vytvářením závislosti na službě?",answer:"Podpora znamená nechat klienta udělat maximum, co s trochou času a pomůcek zvládne sám. Závislost vzniká, když spěchající personál dělá všechno za něj („naučená bezmocnost“).",tags:["soběstačnost","závislost"]},{id:"fc-akt-02",moduleId:"aktivizace-paliativa",question:"Jaké dvě chyby se nesmějí dělat při plánování aktivizace seniorů?",answer:`1. Nucení proti vůli klienta (aktivizace je vždy dobrovolná).
2. Infantilní aktivity (např. dětské úkoly či dětské písničky bez úcty k dospělosti seniora).`,tags:["aktivizace"]},{id:"fc-akt-03",moduleId:"aktivizace-paliativa",question:"K čemu slouží ergoterapie v domově pro seniory?",answer:"K udržení nebo nácviku praktických každodenních dovedností (vaření, oblékání, jemná motorika rukou) a využívání kompenzačních pomůcek.",tags:["ergoterapie"]},{id:"fc-akt-04",moduleId:"aktivizace-paliativa",question:"Co je cílem paliativní a hospicové péče?",answer:"Zlepšit kvalitu života nevyléčitelně nemocného a umírajícího člověka – mírnit bolest a tělesné potíže, zajistit psychickou, sociální a duchovní podporu a nenechat ho o samotě.",tags:["paliativa","hospic"]},{id:"fc-akt-05",moduleId:"aktivizace-paliativa",question:"Vyjmenujte v přesném pořadí 5 fází vyrovnávání podle Elisabeth Kübler-Rossové.",answer:`1. Popření (šok)
2. Hněv (zlost)
3. Smlouvání
4. Deprese (smutek)
5. Smíření (přijetí).`,mnemonic:"P-H-S-D-S: Popírá – Hněvá se – Smlouvá – Depka – Smíření.",tags:["Kübler-Rossová","umírání"]},{id:"fc-akt-06",moduleId:"aktivizace-paliativa",question:"Který smysl vyhasíná u umírajícího člověka jako poslední?",answer:"Sluch (a citlivost na klidný dotek). Proto v pokoji umírajícího vždy mluvíme uctivě, tiše a přímo k němu, i když nereaguje.",tags:["umírání","sluch"]},{id:"fc-akt-07",moduleId:"aktivizace-paliativa",question:"Jak pečujeme o rty a dutinu ústní umírajícího klienta?",answer:"Pravidelně a velmi jemně zvlhčujeme rty a sliznici úst navlhčenou štětičkou/gázou (voda, heřmánek, boraxglycerin) a mažeme balzámem, protože dýchání ústy je vysušuje.",tags:["paliativa","komfort"]},{id:"fc-akt-08",moduleId:"aktivizace-paliativa",question:"Co je hlavním posláním aktivizace u imobilního klienta na pokoji?",answer:"Prevence sociální izolace a smyslové deprivace (individuální rozhovor, předčítání, poslech hudby, prohlížení fotek, stimulace hmatu a čichu).",tags:["individuální aktivizace"]},{id:"fc-akt-09",moduleId:"aktivizace-paliativa",question:"Proč může kontakt se psem (canisterapie) pomoci seniorům s vysokým tlakem nebo demencí?",answer:"Hlazení teplé srsti a bezpodmínečné přijetí zvířetem snižuje stresové hormony, krevní tlak, úzkost a přirozeně podněcuje k pohybu i řeči.",tags:["canisterapie"]},{id:"fc-akt-10",moduleId:"aktivizace-paliativa",question:"Co udělá personál ihned po předpokládaném úmrtí klienta?",answer:"Přivolá lékaře ke konstatování smrti. Teprve po lékařské prohlídce se s maximální úctou a pietou upraví tělo zemřelého (vyrovnání, zavření očí, očištění) a vyrozumí se rodina.",tags:["péče o tělo zemřelého"]},{id:"fc-nar-01",moduleId:"narocne-situace",question:"Jaké bývají nejčastější skryté příčiny náhlé agresivity seniora?",answer:"Neřešená bolest, plný močový měchýř či zácpa, strach při intimní hygieně, hluk, příliš rychlé pohyby pečovatele nebo frustrace z neschopnosti vyjádřit své přání.",tags:["agrese","spouštěče"]},{id:"fc-nar-02",moduleId:"narocne-situace",question:"Jaká jsou 3 základní pravidla fyzické bezpečnosti při jednání s agresivním klientem?",answer:`1. Bezpečný odstup (na délku paže a půl).
2. Vždy mít volnou únikovou cestu ke dveřím (nestát v rohu!).
3. Postoj mírně bokem s klidnýma rukama před tělem a bez visacích šperků či rozpuštěných vlasů.`,tags:["deeskalace","bezpečnost"]},{id:"fc-nar-03",moduleId:"narocne-situace",question:"Jak verbálně deeskalovat rozrušeného nebo křičícího klienta?",answer:"Mluvit nízkým, pomalým a klidným hlasem, nekřičet přes něj, uznat jeho zlost/strach, neargumentovat a nabídnout jasnou, jednoduchou volbu (např. jít se napít do klidu).",tags:["verbální deeskalace"]},{id:"fc-nar-04",moduleId:"narocne-situace",question:"Co dělat, pokud vás rozrušený klient chytí za ruku nebo za oděv?",answer:"Nepoužívat údery ani trest! Využít šetrné vyproštění (pohyb směrem přes palec útočníka, kde je stisk nejslabší), okamžitě odstoupit na bezpečnou vzdálenost a zavolat kolegu.",tags:["šetrná sebeobrana"]},{id:"fc-nar-05",moduleId:"narocne-situace",question:"Čeho se musíme vyvarovat při poskytování krizové intervence klientovi v zármutku?",answer:"Bagatelizace („To nic není, přebolí to“), srovnávání („Paní odvedle je na tom hůř“), nevyžádaných rad a planých slibů, které nemůžeme splnit.",tags:["krizová intervence"]},{id:"fc-nar-06",moduleId:"narocne-situace",question:"Co uděláte, když se vám klient svěří se sebevražednými myšlenkami?",answer:"Beru to naprosto vážně! Klienta neodsuzuji, nenechám ho samotného v nebezpečném prostředí a OKAMŽITĚ informuji zdravotní sestru / vedoucího / lékaře.",tags:["krize","suicidální riziko"]},{id:"fc-nar-07",moduleId:"narocne-situace",question:"Co je to syndrom vyhoření (burnout) a jak ho na sobě poznáte?",answer:"Stav hlubokého fyzického a emočního vyčerpání z dlouhodobého stresu. Varovné znaky: cynismus a chlad ke klientům, ztráta smyslu, únava i po spánku, podrážděnost a časté nemoci.",tags:["syndrom vyhoření"]},{id:"fc-nar-08",moduleId:"narocne-situace",question:"Jaký je rozdíl mezi supervizí a intervizí?",answer:"Supervize je odborně vedené setkání s nezávislým externím supervizorem (podpora týmu, prevence vyhoření). Intervize je vzájemná podpora a porada kolegů z týmu bez externího lektora.",tags:["supervize","intervize"]},{id:"fc-nar-09",moduleId:"narocne-situace",question:"Uveďte 3 účinné zásady psychohygieny pečovatele proti vyhoření.",answer:`1. Jasné oddělení práce od osobního života (neřešit směny doma).
2. Pravidelný pohyb, spánek a koníčky mimo sociální oblast.
3. Využívání týmové podpory a supervize.`,tags:["psychohygiena"]},{id:"fc-nar-10",moduleId:"narocne-situace",question:"Jak souvisí adaptační krize při nástupu do DS se změnou chování seniora?",answer:"Ztráta soukromí, domova a vlastní role může způsobit dočasnou plačtivost, uzavřenost nebo naopak zlost. Klient potřebuje čas (týdny až měsíce), laskavé přijetí a respekt k jeho rituálům.",tags:["adaptace"]},{id:"fc-pp-01",moduleId:"prvni-pomoc",question:"Jaký je poměr stlačení hrudníku a vdechů při KPR dospělého (frekvence a hloubka)?",answer:"Poměr 30 : 2 (30 stlačení středu hrudníku do hloubky 5–6 cm, frekvence 100–120/min, pak 2 vdechy). Netroufáte-li si dýchat z úst do úst, stlačujte hrudník nepřetržitě!",tags:["KPR","resuscitace"]},{id:"fc-pp-02",moduleId:"prvni-pomoc",question:"Co znamená „gasping“ (lapavé dýchání) a jak na něj reagujete?",answer:"Pomalé, nepravidelné lapavé nádechy připomínající „rybu na suchu“. NEJDE o normální dýchání – jde o srdeční zástavu! Ihned voláme 155 a zahajujeme KPR.",tags:["gasping","KPR"]},{id:"fc-pp-03",moduleId:"prvni-pomoc",question:"Co znamenají písmena v testu FAST při podezření na mrtvici (CMP)?",answer:`F (Face) = pokleslý koutek tváře
A (Arm) = pokles jedné předpažené ruky
S (Speech) = porucha řeči / nesrozumitelnost
T (Time) = čas IHNED volat 155 a zapsat čas začátku!`,tags:["CMP","FAST"]},{id:"fc-pp-04",moduleId:"prvni-pomoc",question:"Jak postupujeme při těžkém dušení cizím tělesem u klienta při vědomí (nemůže kašlat)?",answer:"Střídáme 5 rázných úderů mezi lopatky v předklonu a 5× Heimlichův manévr (stlačení nadbřišku dovnitř a nahoru). Při bezvědomí voláme 155 a zahajujeme KPR.",tags:["dušení","Heimlich"]},{id:"fc-pp-05",moduleId:"prvni-pomoc",question:"Jak poznáte podezření na zlomeninu krčku stehenní kosti po pádu a co NESMÍTE dělat?",answer:"Poraněná noha je zkrácená a vytočená špičkou ven (zevní rotace), bolest v kyčli. NIKDY klienta nezvedáme ani nohu nerovnáme! Přikryjeme dekou, podložíme v nalezené poloze a voláme 155.",tags:["zlomenina krčku","pád"]},{id:"fc-pp-06",moduleId:"prvni-pomoc",question:"Jak odlišíte hypoglykémii a jaká je první pomoc při vědomí vs. v bezvědomí?",answer:`Hypoglykémie nastupuje rychle: studený pot, třes, slabost, bledost, zmatenost.
• Při vědomí: ihned podat rychlý cukr (sladký nápoj, hroznový cukr) a volat sestru.
• V bezvědomí: NIC DO ÚST! Položit na bok a volat 155.`,tags:["hypoglykémie","diabetes"]},{id:"fc-pp-07",moduleId:"prvni-pomoc",question:"Jaká jsou 2 klíčová „NIKDY“ při probíhajícím epileptickém záchvatu?",answer:`1. NIKDY nevkládáme nic do úst (ani roubík, prsty či lžíci)!
2. NIKDY křečím násilně nebráníme.
Místo toho chráníme hlavu před údery, odstraníme tvrdé předměty a měříme čas.`,tags:["epilepsie","záchvat"]},{id:"fc-pp-08",moduleId:"prvni-pomoc",question:"Jak zastavujeme masivní tepenné či žilní krvácení?",answer:"V rukavicích ihned zatlačíme prsty (přes čistý tampón/tkaninu) přímo v ráně, zvedneme krvácející končetinu nad úroveň srdce, přiložíme tlakový obvaz a voláme 155.",tags:["krvácení","první pomoc"]},{id:"fc-pp-09",moduleId:"prvni-pomoc",question:"Jaká je nejčastější chyba při chlazení popáleniny u seniora?",answer:"Použití ledu, másla, oleje nebo zásypu! Popáleninu chladíme jen čistou vlažnou/studenou tekoucí vodou (cca 10–20 minut) jen na postižené místo (pozor na podchlazení seniora!).",tags:["popáleniny"]},{id:"fc-pp-10",moduleId:"prvni-pomoc",question:"Jak dlouho má trvat alkoholová dezinfekce rukou a kdy ji provádíme?",answer:"Minimálně 30 sekund do úplného zaschnutí (včetně palců, meziprstí a hřbetů). Vždy před kontaktem s klientem, po kontaktu, po tekutinách, po dotyku okolí a VŽDY po sundání rukavic!",tags:["dezinfekce rukou","WHO"]},{id:"fc-pp-11",moduleId:"prvni-pomoc",question:"Co obnáší bariérový režim při výskytu svrabu nebo infekčního průjmu (noroviry)?",answer:"Izolace klienta na pokoji, jednorázový ochranný plášť a rukavice vyčleněné jen pro daný pokoj, oddělené pomůcky, infekční prádlo do označených pytlů bez vytřepávání a zvýšená dezinfekce.",tags:["bariérový režim","epidemiologie"]}],Ju=[{id:"g-adaptace",term:"Adaptace (adaptační proces)",category:"Psychologie a demence",definition:"Období po příchodu seniora do domova pro seniory (obvykle první 1–3 měsíce), kdy si zvyká na nové prostředí, režim a ztrátu domova.",practicalTip:"Klíčové je respektovat životní rytmus klienta, zapojit rodinu a nabídnout osobní předměty z domova."},{id:"g-aed",term:"AED (Automatizovaný externí defibrilátor)",category:"První pomoc a hygiena",definition:"Přístroj pro veřejnost i personál, který sám vyhodnotí srdeční rytmus a hlasově vede zachránce, zda a kdy podat elektrický výboj při zástavě srdce.",practicalTip:"Zapněte ho ihned, jakmile ho kolega přinese, nalepte elektrody na holý suchý hrudník a poslouchejte pokyny přístroje."},{id:"g-afazie",term:"Afázie",category:"Komunikace a aktivizace",definition:"Porucha tvorby nebo porozumění řeči způsobená poškozením mozku (nejčastěji po cévní mozkové příhodě). Neznamená snížení inteligence!",practicalTip:"Mluvte pomalu, v krátkých větách, udržujte oční kontakt a používejte obrázky nebo gesta."},{id:"g-agrese",term:"Agrese (verbální / brachiální)",category:"Psychologie a demence",definition:"Chování ohrožující okolí či klienta slovně nebo fyzicky. V DS bývá nejčastěji obrannou reakcí na strach, bolest, stud nebo nepochopení.",practicalTip:"Hledejte spouštěč, mluvte klidně a tiše, udržujte bezpečný odstup a nikdy neopětujte křik ani sílu."},{id:"g-aktivizace",term:"Aktivizace",category:"Komunikace a aktivizace",definition:"Soubor cílených činností (trénink paměti, rukodělné práce, hudba, pohyb), které udržují či zlepšují fyzické, duševní a sociální schopnosti seniora.",practicalTip:"Aktivizace není jen skupinové tvoření – i společné skládání ubrousků nebo rozhovor u čaje je hodnotná aktivizace."},{id:"g-ambulantni-sluzba",term:"Ambulantní sociální služba",category:"Legislativa",definition:"Forma sociální služby (§ 33), kdy klient do zařízení dochází nebo je doprovázen na určitou část dne bez ubytování (např. denní stacionář).",practicalTip:"Na rozdíl od pobytové služby (DS) se klient na noc vrací do své domácnosti."},{id:"g-anurie",term:"Anurie / Oligurie",category:"Ošetřovatelství",definition:"Oligurie je snížená tvorba moči (pod 400–500 ml/den), anurie znamená úplnou zástavu tvorby moči (pod 100 ml/den).",practicalTip:"Pokud je sběrný sáček u katétru dlouhé hodiny prázdný, okamžitě to hlašte zdravotní sestře!"},{id:"g-arteterapie",term:"Arteterapie a muzikoterapie",category:"Komunikace a aktivizace",definition:"Aktivizační a terapeutické postupy využívající výtvarné vyjádření (arteterapie) nebo hudbu, zpěv a rytmus (muzikoterapie) k podpoře emocí a paměti.",practicalTip:"Známé lidové písně z mládí často pomohou navázat kontakt i s jinak mlčícím klientem s demencí."},{id:"g-asertivita",term:"Asertivita",category:"Komunikace a aktivizace",definition:"Zdravé, sebevědomé a přitom respektující prosazování vlastních práv, pocitů a hranic bez ponižování druhého.",practicalTip:"Užitečné při odmítání nevhodného daru od rodiny nebo při nastavování hranic agresivnímu klientovi."},{id:"g-aspirace",term:"Aspirace",category:"První pomoc a hygiena",definition:"Vdechnutí tekutiny, potravy nebo zvratků do dýchacích cest. Může vést k akutnímu dušení nebo nebezpečnému zápalu plic (aspirační pneumonii).",practicalTip:"Klienta nikdy nekrmte vleže; vždy ho posaďte do zvýšené polohy (90°) a nechte ho tak ještě 20–30 minut po jídle."},{id:"g-bariera",term:"Bariérová ošetřovatelská péče",category:"První pomoc a hygiena",definition:"Soubor přísných hygienických opatření u infekčních klientů (např. svrab, noroviry, MRSA) bránící přenosu nákazy na ostatní.",practicalTip:"Používejte jednorázové ochranné pomůcky (plášť, rukavice) vyčleněné jen pro daný pokoj a důsledně dezinfikujte ruce."},{id:"g-bazalni-stimulace",term:"Bazální stimulace",category:"Komunikace a aktivizace",definition:"Ošetřovatelský koncept prof. Andrease Fröhlicha pro lidi s těžkým omezením pohybu, vnímání a komunikace. Využívá cílené podněty (dotek, polohování, známé vůně).",practicalTip:"Vždy používejte „iniciální dotek“ – jasný, klidný dotek na paži nebo rameni při pozdravu i loučení."},{id:"g-biograficky-pristup",term:"Biografický přístup",category:"Komunikace a aktivizace",definition:"Poznání minulosti, povolání, zájmů, rodiny a zvyklostí klienta pro nastavení péče na míru.",practicalTip:"Když víte, že paní Nováková byla celý život pekařkou, pochopíte, proč vstává v 5:00 ráno a chce „zadelávat těsto“."},{id:"g-bradykardie",term:"Bradykardie a tachykardie",category:"Ošetřovatelství",definition:"Bradykardie je zpomalený srdeční tep (pod 60/min), tachykardie je zrychlený tep v klidu (nad 100/min).",practicalTip:"Výrazné změny tepu spojené se slabostí či závratí hlásíme sestře."},{id:"g-canisterapie",term:"Canisterapie",category:"Komunikace a aktivizace",definition:"Forma animoterapie využívající pozitivního působení speciálně vycvičeného psa na psychickou i fyzickou pohodu seniora.",practicalTip:"Hlazení psa snižuje krevní tlak, stres a povzbuzuje k pohybu ruky i k hovoru."},{id:"g-cmp",term:"CMP (Cévní mozková příhoda / mrtvice)",category:"První pomoc a hygiena",definition:"Náhlá porucha prokrvení mozku (ucpání cévy nebo krvácení). Pozná se testem FAST: Face (pokles koutku), Arm (pokles ruky), Speech (porucha řeči), Time (ihned volat 155).",practicalTip:"Každá minuta rozhoduje o záchraně mozkových buněk – nikdy nečekejte, „jestli to přejde“."},{id:"g-cyanoza",term:"Cyanóza",category:"První pomoc a hygiena",definition:"Namodralé až fialové zbarvení rtů, jazyka, ušních boltců a nehtových lůžek způsobené nedostatkem kyslíku v krvi.",practicalTip:"Jde o závažný varovný příznak – ihned zkontrolujte dýchání, posaďte klienta a volejte sestru či 155."},{id:"g-dehydratace",term:"Dehydratace",category:"Ošetřovatelství",definition:"Nedostatek vody v těle. U seniorů je oslaben pocit žízně. Projevuje se suchými rty, tmavou močí, zácpou, únavou, poklesem tlaku a náhlou zmateností.",practicalTip:"Nabízejte pití často v malých dávkách, sledujte bilanci tekutin a zapojte i polévky, ovoce a želé."},{id:"g-dekubit",term:"Dekubit (proleženina)",category:"Ošetřovatelství",definition:"Poškození kůže a podkoží vznikající dlouhodobým tlakem, třením a střižnou silou nad kostními výběžky, kdy dojde k nedokrvení (ischemii) tkáně.",practicalTip:"Rozlišujeme I.–IV. stupeň. Prvním varováním je neblednoucí zarudnutí – NIKDY ho nemasírujte!"},{id:"g-delirium",term:"Delirium (akutní stav zmatenosti)",category:"Psychologie a demence",definition:"Náhle vzniklá, kolísavá porucha vědomí a pozornosti vyvolaná tělesnou příčinou (dehydratace, infekce močových cest, horečka, léky, bolest).",practicalTip:"Na rozdíl od demence vzniká náhle (hodiny až dny) a je při včasné léčbě vratné! Vždy volejte sestru."},{id:"g-demence",term:"Demence (syndrom demence)",category:"Psychologie a demence",definition:"Chronické, postupně se zhoršující (progresivní) onemocnění mozku s úbytkem paměti, úsudku, orientace a schopnosti sebeobsluhy (např. Alzheimerova nemoc).",practicalTip:"Klienta s demencí neopravujte a nehádejte se o realitě – použijte validaci a vstupte do jeho prožívání."},{id:"g-dezinfekce",term:"Dezinfekce vs. Sterilizace",category:"První pomoc a hygiena",definition:"Dezinfekce ničí většinu choroboplodných mikroorganismů na rukou a površích; sterilizace ničí úplně všechny mikroorganismy včetně spor.",practicalTip:"Při dezinfekci rukou dodržujte předepsanou dobu expozice (obvykle 30 sekund) a vetřete přípravek i mezi prsty a pod nehty."},{id:"g-dieta-2-3-9",term:"Diety č. 2, č. 3 a č. 9",category:"Ošetřovatelství",definition:"Základní dietní systém v ČR: č. 3 = racionální (běžná zdravá strava), č. 2 = šetřící (lehce stravitelná při potížích se žaludkem/žlučníkem), č. 9 = diabetická (omezení jednoduchých cukrů).",practicalTip:"Vždy zkontrolujte jmenovku a číslo diety na tácu, než jídlo předáte klientovi!"},{id:"g-domov-pro-seniory",term:"Domov pro seniory (§ 49)",category:"Legislativa",definition:"Pobytová sociální služba pro osoby, které dosáhly věku rozhodného pro přiznání starobního důchodu a pro svůj stav potřebují pravidelnou pomoc jiné osoby.",practicalTip:"Na rozdíl od domova se zvláštním režimem (§ 50) není primárně specializován pouze na těžké demence či závislosti, i když senioři s demencí v něm často žijí."},{id:"g-domov-zvlastni-rezim",term:"Domov se zvláštním režimem (§ 50)",category:"Legislativa",definition:"Pobytová sociální služba s upraveným režimem pro osoby se sníženou soběstačností v důsledku chronického duševního onemocnění, závislostí nebo stařecké/Alzheimerovy demence.",practicalTip:"Má vyšší personální zajištění a stavebně zabezpečené prostředí proti bloudění a úrazům."},{id:"g-dysfagie",term:"Dysfagie",category:"Ošetřovatelství",definition:"Porucha polykání, která způsobuje zakašlání, slinění, uvíznutí sousta v krku nebo tiché vdechnutí potravy.",practicalTip:"Pomáhá sed 90°, malé lžičky, mixovaná či kašovitá strava a zahušťovadla tekutin podle doporučení lékaře/logopeda."},{id:"g-dyspnoe",term:"Dyspnoe (dušnost)",category:"První pomoc a hygiena",definition:"Subjektivní pocit nedostatku vzduchu a namáhavého dýchání.",practicalTip:"Klienta ihned uveďte do polosedu až sedu s oporou horních končetin (ortopnoická poloha), vyvětrejte, uklidněte a volejte sestru."},{id:"g-ean",term:"EAN (Týrání, zanedbávání a zneužívání seniorů)",category:"Legislativa",definition:"Elder Abuse and Neglect – fyzické, psychické, sexuální či finanční zneužívání nebo úmyslné či nevědomé zanedbávání péče (např. žízeň, špína, omezování).",practicalTip:"Každé podezření (modřiny v neobvyklých místech, strach klienta, mizející peníze) musíte neprodleně nahlásit vedení a řešit dle Standardu č. 2."},{id:"g-edem",term:"Edém (otok)",category:"Ošetřovatelství",definition:"Nahromadění tekutiny v mezibuněčných prostorech (často kolem kotníků a bérců při srdečním selhávání nebo žilní nedostatečnosti).",practicalTip:"Kůže nad otokem je napjatá a snadno se poraní – nikdy ji netřete a hlídejte těsnost obuvi a ponožek."},{id:"g-empatie",term:"Empatie",category:"Komunikace a aktivizace",definition:"Schopnost vcítit se do emocí a situace druhého člověka bez ztráty vlastního profesního nadhledu (na rozdíl od lítosti).",practicalTip:"Empatická věta zní: „Vidím, že se vám po domově moc stýská.“ Místo: „Ale prosím vás, vždyť je vám tu dobře.“"},{id:"g-epilepsie",term:"Epileptický záchvat (grand mal)",category:"První pomoc a hygiena",definition:"Akutní záchvat křečí a ztráty vědomí vyvolaný abnormální elektrickou aktivitou mozku.",practicalTip:"Chraňte hlavu, odstraňte předměty, křečím nebraňte a NIKDY nic nevkládejte do úst! Měřte čas záchvatu."},{id:"g-ergoterapie",term:"Ergoterapie",category:"Komunikace a aktivizace",definition:"Léčba či podpora soběstačnosti prací a nácvikem běžných denních činností (oblékání, vaření, jemná motorika) s využitím kompenzačních pomůcek.",practicalTip:"Podporujte klienta, aby si sám čistil zuby nebo mazal rohlík pomocí speciálního protiskluzového prkénka."},{id:"g-eticky-kodex",term:"Etický kodex pracovníka v sociálních službách",category:"Legislativa",definition:"Soubor mravních zásad povolání: úcta k důstojnosti a autonomii klienta, mlčenlivost, nestrannost, odmítání korupce a neustálý rozvoj.",practicalTip:"Nikdy nepřijímejte peněžní dary nebo hodnotné dárky od klienta či rodiny – jde o střet zájmů."},{id:"g-gasping",term:"Gasping (lapavé dýchání)",category:"První pomoc a hygiena",definition:"Pomalé, nepravidelné, chrčivé či lapavé nádechy připomínající „rybu na suchu“. Nejde o normální dýchání, ale o projev srdeční zástavy!",practicalTip:"Jakmile vidíte bezvědomí a gasping, okamžitě volejte 155 a zahajte resuscitaci (stlačování hrudníku)."},{id:"g-hematurie",term:"Hematurie",category:"Ošetřovatelství",definition:"Přítomnost krve v moči (moč může být růžová, červená nebo hnědá).",practicalTip:"Vždy ihned nahlaste zdravotní sestře, může signalizovat infekci, poranění nebo závažné onemocnění."},{id:"g-heimlich",term:"Heimlichův manévr (břišní stlačení)",category:"První pomoc a hygiena",definition:"Záchranný chvat při těžkém dušení cizím tělesem u člověka při vědomí: prudké stlačení nadbřišku dovnitř a nahoru (střídá se 5 úderů mezi lopatky a 5 stlačení břicha).",practicalTip:"Po každém provedeném Heimlichově manévru by měl klienta vyšetřit lékař kvůli riziku poranění vnitřních orgánů."},{id:"g-hospicova-pece",term:"Hospicová / Paliativní péče",category:"Ošetřovatelství",definition:"Péče zaměřená nikoliv na vyléčení nevyléčitelné nemoci, ale na maximální kvalitu života, mírně
