 při péči v domácím prostředí nebo terénní službě.",legalOrClinicalRef:"§ 11 zákona č. 108/2006 Sb. (platné 2026)"},{id:"q-leg-05",moduleId:"legislativa",question:"Jaká je výše příspěvku na péči u dospělého v II. stupni závislosti (nezvládání 5–6 základních životních potřeb) v roce 2026?",options:["1 300 Kč","5 400 Kč","8 200 Kč","14 800 Kč"],correctIndex:1,explanation:"Pro dospělé platí v roce 2026: I. stupeň 1 300 Kč, II. stupeň 5 400 Kč, III. stupeň 14 800 Kč, IV. stupeň 23 000 Kč (pobyt) / 27 000 Kč (doma). Částka 8 200 Kč je II. stupeň pro děti do 18 let.",legalOrClinicalRef:"§ 11 zákona č. 108/2006 Sb."},{id:"q-leg-06",moduleId:"legislativa",question:"Kolik procent z měsíčního příjmu (důchodu) musí klientovi v domově pro seniory zůstat po zaplacení úhrady za ubytování a stravu?",options:["Alespoň 5 % příjmu","Alespoň 10 % příjmu","Alespoň 15 % příjmu","Alespoň 25 % příjmu"],correctIndex:2,explanation:"Podle § 73 odst. 3 zákona č. 108/2006 Sb. musí osobě v pobytové službě (DS, DZR) zůstat po úhradě za ubytování a stravu alespoň 15 % jejího příjmu.",legalOrClinicalRef:"§ 73 odst. 3 zákona č. 108/2006 Sb."},{id:"q-leg-07",moduleId:"legislativa",question:"Jaká je maximální zákonná denní úhrada za ubytování (vícelůžkový vs. jednolůžkový pokoj) a celodenní stravu v domově pro seniory v roce 2026?",options:["Ubytování max. 210 Kč / 250 Kč a strava 190 Kč","Ubytování max. 335 Kč (vícelůžkový) / 380 Kč (jednolůžkový) a strava max. 290 Kč","Ubytování max. 450 Kč a strava max. 350 Kč","Výše úhrad není vyhláškou omezena, určuje ji obec"],correctIndex:1,explanation:"Prováděcí vyhláška č. 505/2006 Sb. stanovuje pro rok 2026 horní limity: 335 Kč/den za ubytování ve vícelůžkovém pokoji, 380 Kč/den v jednolůžkovém pokoji a 290 Kč/den za celodenní stravu.",legalOrClinicalRef:"§ 15 vyhlášky č. 505/2006 Sb."},{id:"q-leg-08",moduleId:"legislativa",question:"V jakém minimálním rozsahu se musí pracovník v sociálních službách povinně dále vzdělávat každý kalendářní rok?",options:["Nejméně 8 hodin ročně","Nejméně 16 hodin ročně","Nejméně 24 hodin ročně","Nejméně 40 hodin ročně"],correctIndex:2,explanation:"Podle § 116 odst. 9 zákona č. 108/2006 Sb. je povinností pracovníka v sociálních službách absolvovat nejméně 24 hodin dalšího vzdělávání za kalendářní rok.",legalOrClinicalRef:"§ 116 odst. 9 zákona č. 108/2006 Sb."},{id:"q-leg-09",moduleId:"legislativa",question:"Kdy zaniká zákonná povinnost mlčenlivosti pracovníka v sociálních službách o údajích klientů?",options:["Dnem podpisu výpovědi z pracovního poměru","Jeden rok po skončení pracovního poměru","Až úmrtím klienta","Nikdy nezaniká odchodem – trvá i po skončení pracovněprávního vztahu"],correctIndex:3,explanation:"Podle § 100 zákona č. 108/2006 Sb. jsou zaměstnanci povinni zachovávat mlčenlivost o skutečnostech zjištěných při poskytování služeb i po skončení pracovního poměru.",legalOrClinicalRef:"§ 100 zákona č. 108/2006 Sb."},{id:"q-leg-10",moduleId:"legislativa",question:"Která služba je určena primárně pro seniory se stařeckou nebo Alzheimerovou demencí vyžadující specifický režim a zabezpečení?",options:["Domov se zvláštním režimem (§ 50)","Azylový dům (§ 57)","Chráněné bydlení (§ 51)","Nízkoprahové denní centrum (§ 61)"],correctIndex:0,explanation:"Domov se zvláštním režimem (§ 50) má upravený režim přizpůsobený potřebám lidí s chronickým duševním onemocněním, závislostmi nebo demencí.",legalOrClinicalRef:"§ 50 zákona č. 108/2006 Sb."},{id:"q-leg-11",moduleId:"legislativa",question:"Kdo má v ČR právo na bezplatné základní sociální poradenství?",options:["Pouze osoby s přiznaným III. nebo IV. stupněm příspěvku na péči","Pouze senioři nad 65 let","Každá osoba v nepříznivé sociální situaci","Pouze klienti, kteří už podepsali smlouvu o pobytové službě"],correctIndex:2,explanation:"Podle § 37 zákona č. 108/2006 Sb. má každá osoba nárok na bezplatné základní sociální poradenství a každý poskytovatel ho musí poskytnout.",legalOrClinicalRef:"§ 37 zákona č. 108/2006 Sb."},{id:"q-leg-12",moduleId:"legislativa",question:"Co podle § 15 vyhlášky č. 505/2006 Sb. spadá v domově pro seniory pod základní činnost „poskytnutí ubytování“?",options:["Pouze přidělení postele a skříně","Ubytování, úklid, praní a drobné opravy ložního a osobního prádla a žehlení","Ubytování včetně všech rehabilitačních výkonů lékaře","Pouze pronájem pokoje bez úklidu a praní"],correctIndex:1,explanation:"V pobytové službě Domov pro seniory zahrnuje položka poskytnutí ubytování také úklid, praní, drobné opravy ložního i osobního prádla a žehlení.",legalOrClinicalRef:"§ 15 vyhlášky č. 505/2006 Sb."},{id:"q-std-01",moduleId:"standardy-prava",question:"Kolik je celkem Standardů kvality sociálních služeb v příloze č. 2 vyhlášky č. 505/2006 Sb.?",options:["10 standardů","12 standardů","15 standardů","20 standardů"],correctIndex:2,explanation:"Celkem je 15 standardů kvality: procesní (1–8), personální (9–10) a provozní (11–15).",legalOrClinicalRef:"Příloha č. 2 vyhlášky č. 505/2006 Sb."},{id:"q-std-02",moduleId:"standardy-prava",question:"Kdo společně sestavuje Individuální plán (Standard č. 5)?",options:["Ředitel domova bez účasti klienta a pečovatelů","Klient (příp. s podporou rodiny) společně se svým klíčovým pracovníkem","Pouze ošetřující praktický lékař","Úřad práce při schvalování příspěvku na péči"],correctIndex:1,explanation:"Individuální plán vychází z osobních cílů, přání a zvyků konkrétního klienta – tvoří ho klíčový pracovník přímo s klientem.",legalOrClinicalRef:"Standard kvality č. 5"},{id:"q-std-03",moduleId:"standardy-prava",question:"Jak musí domov pro seniory přistupovat k anonymní stížnosti podle Standardu č. 7?",options:["Anonymní stížnosti se rovnou vyhazují, protože nelze určit stěžovatele","Musí mít písemně stanovený postup i pro přijímání a vyřizování anonymních stížností","Anonymní stížnosti řeší výhradně policie","Klient si smí stěžovat jen tehdy, když souhlasí jeho opatrovník a ředitel"],correctIndex:1,explanation:"Standard č. 7 zaručuje právo podat stížnost ústně, písemně i anonymně, aniž by klientovi hrozil jakýkoliv postih či omezení péče.",legalOrClinicalRef:"Standard kvality č. 7"},{id:"q-std-04",moduleId:"standardy-prava",question:"V jakém jediném případě umožňuje § 89 zákona č. 108/2006 Sb. použít opatření omezující pohyb osob?",options:["Když je na noční směně málo personálu a klient často vstává","Pouze v případě přímého ohrožení života a zdraví klienta nebo jiných osob, po vyčerpání mírnějších cest a po dobu nezbytně nutnou","Kdykoliv klient odmítne vzít večerní léky nebo sprchu","Pokaždé, když si to písemně přeje rodina klienta"],correctIndex:1,explanation:"Omezující opatření (§ 89) jsou zásadně zakázána; výjimkou je jen bezprostřední ohrožení zdraví a života po neúspěšném slovním zklidnění.",legalOrClinicalRef:"§ 89 zákona č. 108/2006 Sb."},{id:"q-std-05",moduleId:"standardy-prava",question:"Jaké je správné pořadí (hierarchie) přípustných omezujících prostředků podle § 89 odst. 4?",options:["Léky na uklidnění → zamčení na pokoji → fyzický úchop","Fyzický úchop → místnost zřízená k bezpečnému pobytu → léčivé přípravky (jen na ordinaci a za přítomnosti lékaře)","Připoutání k lůžku → zavolání policie → slovní domluva","Zvednutí obou postranic → fyzický úchop → podání bylinkového čaje"],correctIndex:1,explanation:"Zákon vyžaduje postupovat od nejméně invazivního kroku: nejdříve slovní zklidnění, pak fyzický úchop, poté bezpečná místnost, a léky jen z ruky / za přítomnosti přivolaného lékaře.",legalOrClinicalRef:"§ 89 odst. 4 zákona č. 108/2006 Sb."},{id:"q-std-06",moduleId:"standardy-prava",question:"Kdo může v krizové situaci v sociální službě nařídit a podat léky omezující pohyb klienta?",options:["Vedoucí směny pečovatelů","Výhradně přivolaný lékař (léky se podávají na základě jeho ordinace a za jeho přítomnosti)","Kterákoliv pracovnice v přímé péči podle uvážení","Rodinný příslušník po telefonu"],correctIndex:1,explanation:"Podle § 89 odst. 4 lze použít léčivé přípravky pouze na základě ordinace přivolaného lékaře a za jeho přítomnosti.",legalOrClinicalRef:"§ 89 zákona č. 108/2006 Sb."},{id:"q-std-07",moduleId:"standardy-prava",question:"Co je z hlediska práva problém na rutinním zvednutí obou postranic na lůžku u pohyblivého seniora s demencí?",options:["Nic, postranice musí být nahoře u každého nad 75 let","Může jít o nezákonné omezení svobody pohybu (§ 89) a navíc hrozí smrtelný pád přes horní hranu postranice","Postranice jsou jen zdravotnická pomůcka a zákon 108/2006 se na ně nevztahuje","Problém je pouze to, že se špatně stlává postel"],correctIndex:1,explanation:"Pokud klient postranici sám nesklopí a je proti své vůli uvězněn v posteli bez zákonné výjimky, jde o nelegální omezení pohybu i vážné bezpečnostní riziko.",legalOrClinicalRef:"§ 89 zákona č. 108/2006 Sb."},{id:"q-std-08",moduleId:"standardy-prava",question:"Co vyjadřuje zkratka EAN?",options:["Evropskou asociaci nemocnic","Týrání, zanedbávání a zneužívání seniorů (Elder Abuse and Neglect)","Elektronickou ambulantní normu péče","Etický kodex zdravotních sester"],correctIndex:1,explanation:"EAN označuje jakékoliv fyzické, psychické, sexuální či finanční zneužívání nebo zanedbávání péče o seniory.",legalOrClinicalRef:"Standard kvality č. 2"},{id:"q-std-09",moduleId:"standardy-prava",question:"Co z následujícího je příkladem psychického zneužívání a narušení důstojnosti v domově pro seniory?",options:["Zaklepání na dveře před vstupem do pokoje klienta","Oslovování seniora příjmením s vykáním podle jeho přání","Infantilní oslovování („babičko, nekřičte, musíte hezky papat“), pohrdavý tón a zesměšňování před ostatními","Dotaz na to, co si klient přeje k odpolední svačině"],correctIndex:2,explanation:"Infantilní jednání, nechtěné tykání, zesměšňování nebo vyhrožování narušují lidskou důstojnost a patří k formám psychického špatného zacházení.",legalOrClinicalRef:"§ 2 zákona č. 108/2006 Sb. & Standard č. 2"},{id:"q-std-10",moduleId:"standardy-prava",question:"Co má udělat pracovník v sociálních službách, když mu vděčný klient nabídne 1 000 Kč jako osobní dárek?",options:["Peníze přijmout, aby seniora neurazil, a poděkovat","Slušně a pevně peníze odmítnout s vysvětlením, že pravidla to neumožňují, a informovat vedení","Peníze vzít a koupit za ně kávu pro celou směnu","Říct klientovi, ať je dá raději do tašky beze svědků"],correctIndex:1,explanation:"Přijímání peněz či hodnotných darů zakládá střet zájmů a narušuje rovnost péče (Standard č. 2 a Etický kodex).",legalOrClinicalRef:"Standard kvality č. 2 / Etický kodex PSS"},{id:"q-std-11",moduleId:"standardy-prava",question:"Do jaké skupiny Standardů kvality patří Standard č. 9 (Personální a organizační zajištění) a Standard č. 10 (Profesní rozvoj)?",options:["Procesní standardy","Personální standardy","Provozní standardy","Finanční standardy"],correctIndex:1,explanation:"Standardy 1–8 jsou procesní, 9–10 personální a 11–15 provozní.",legalOrClinicalRef:"Příloha č. 2 vyhlášky č. 505/2006 Sb."},{id:"q-std-12",moduleId:"standardy-prava",question:"Který dokument upravuje konkrétní rozsah, místo, čas a výši úhrady za poskytovanou službu mezi klientem a domovem pro seniory?",options:["Písemná smlouva o poskytování sociální služby (Standard č. 4)","Domovní řád vyvěšený na chodbě","Pracovní smlouva pečovatelky","Ústní dohoda se synem při předání kufrů"],correctIndex:0,explanation:"Pobytová služba v domově pro seniory se poskytuje vždy na základě písemné smlouvy o poskytování sociální služby (§ 91 zákona a Standard č. 4).",legalOrClinicalRef:"§ 91 zákona č. 108/2006 Sb., Standard č. 4"},{id:"q-pec-01",moduleId:"prima-pece",question:"Jaký je správný směr mytí očí při běžné ranní hygieně na lůžku?",options:["Od zevního koutku k vnitřnímu (ke kořeni nosu), vždy čistou částí žínky pro každé oko zvlášť","Jedním tahem žínky přes obě oči najednou zleva doprava","Vždy se používá silné dezinfekční mýdlo přímo do oka","Oči se u ležících klientů nemají vůbec omývat"],correctIndex:0,explanation:"Čisté oči omýváme převařenou či čistou vodou bez mýdla od zevního koutku k vnitřnímu a pro každé oko použijeme čistý kousek žínky/tamponu.",legalOrClinicalRef:"Základy ošetřovatelské hygieny"},{id:"q-pec-02",moduleId:"prima-pece",question:"Proč pečovatel nestříhá nůžkami nehty na nohou klientovi s diabetem (cukrovkou)?",options:["Protože diabetici mají ze zákona zakázané stříhání nehtů","Hrozí poranění při snížené citlivosti a špatném prokrvení s rizikem těžké infekce (syndrom diabetické nohy)","Protože nehty diabetiků jsou příliš měkké","Diabetikovi nehty na nohou nerostou"],correctIndex:1,explanation:"U diabetiků s neuropatií a poruchou prokrvení může i drobné poranění kůže nůžkami vést k nehojícím se vředům až amputaci. Péči zajišťuje odborná pedikúra/sestra.",legalOrClinicalRef:"Hygienická péče u diabetiků"},{id:"q-pec-03",moduleId:"prima-pece",question:"Na co musíme vždy dbát při čištění snímatelné zubní protézy nad umyvadlem?",options:["Použít vařící vodu pro dokonalou sterilizaci","Napustit do umyvadla trochu vody nebo položit na dno ručník, aby protéza při pádu nepraskla, a čistit ji vlažnou vodou","Drhnout protézu pískem na nádobí","Sušit protézu na přímém topení"],correctIndex:1,explanation:"Horká voda by pryskyřici protézy zdeformovala a tvrdé keramické umyvadlo by ji při vyklouznutí z ruky zlomilo.",legalOrClinicalRef:"Péče o dutinu ústní seniora"},{id:"q-pec-04",moduleId:"prima-pece",question:"Která kombinace příznaků nejvíce svědčí pro dehydrataci seniora?",options:["Čirá světlá moč, vlhký jazyk a chuť k jídlu","Suché rty a jazyk, tmavá zapáchající moč, zácpa, snížený turgor kůže a náhlá zmatenost","Zvýšené pocení po čerstvém vzduchu a dobrý spánek","Časté močení velkého množství světlé moči"],correctIndex:1,explanation:"Dehydratace se u seniorů velmi často projeví suchostí sliznic, koncentrovanou tmavou močí, únavou, poklesem tlaku a akutní zmateností (deliriem).",legalOrClinicalRef:"Pitný režim v geriatrii"},{id:"q-pec-05",moduleId:"prima-pece",question:"Jak dlouho po jídle by měl senior se sklonem k vdechnutí potravy či refluxu zůstat ve vzpřímeném sedu?",options:["Stačí 1 minutu","Alespoň 20–30 minut (prevence aspirace)","Ihned ho položíme na záda na plocho","Nesmí si sedat ani při jídle"],correctIndex:1,explanation:"Ponechání klienta ve zvýšené poloze 20–30 minut po jídle zabraňuje návratu potravy a vdechnutí (aspiraci) do dýchacích cest.",legalOrClinicalRef:"Prevence aspirace při výživě"},{id:"q-pec-06",moduleId:"prima-pece",question:"Které číslo nemocniční diety označuje dietu diabetickou a které dietu šetřící?",options:["Dieta č. 3 = diabetická, č. 9 = šetřící","Dieta č. 9 = diabetická, č. 2 = šetřící (č. 3 = racionální)","Dieta č. 1 = diabetická, č. 5 = šetřící","Dieta č. 4 = diabetická, č. 11 = šetřící"],correctIndex:1,explanation:"V českém dietním systému: č. 2 je dieta šetřící, č. 3 je dieta racionální (běžná) a č. 9 je dieta diabetická.",legalOrClinicalRef:"Dietní systém v ČR"},{id:"q-pec-07",moduleId:"prima-pece",question:"Kde musí být umístěn sběrný sáček u klienta s permanentním močovým katétrem (PMK)?",options:["Položený volně na podlaze vedle postele, aby nepřekážel","Zavěšený nad úrovní těla, aby byl na očích","Vždy zavěšený POD úrovní močového měchýře a zároveň nesmí ležet na podlaze","Schovaný pod polštářem klienta kvůli soukromí"],correctIndex:2,explanation:"Sáček pod úrovní měchýře brání zpětnému toku moči (infekci močových cest) a zavěšení nad podlahou brání kontaminaci výpustního ventilu.",legalOrClinicalRef:"Ošetřovatelská péče u PMK"},{id:"q-pec-08",moduleId:"prima-pece",question:"Co patří výhradně do kompetence zdravotní sestry (nikoliv pracovníka v sociálních službách) v domově pro seniory?",options:["Pomoc při koupání, oblékání a česání klienta","Příprava léků do dávkovačů, aplikace inzulinu a odborné převazy dekubitů III. stupně","Výměna znečištěných plenkových kalhotek a stlaní lůžka","Doprovod klienta na oběd do jídelny a hlášení změny stavu kůže"],correctIndex:1,explanation:"Pracovník v sociálních službách není zdravotnický pracovník – léky, injekce, cévkování a léčba ran patří zdravotní sestře dle vyhlášky č. 55/2011 Sb.",legalOrClinicalRef:"Vyhláška č. 55/2011 Sb. vs. zákon 108/2006 Sb."},{id:"q-pec-09",moduleId:"prima-pece",question:"Jak předcházíme vzniku intertriga (opruzenin) v kožních záhybech po koupeli?",options:["Záhyby silně vydrhneme hrubým ručníkem do červena","Záhyby necháme vlhké, aby se zchladily","Šetrně je osušíme přikládáním měkkého ručníku do úplného sucha a chráníme prodyšnou vrstvou / bariérovým krémem","Zasypeme je silnou vrstvou hrubého pudru přes mokrou kůži"],correctIndex:2,explanation:"Vlhkost a tření způsobují opruzeniny. Důležité je šetrné přikládání ručníku do sucha (nikoliv dření ani pudrování mokré kůže, které dělá žmolky).",legalOrClinicalRef:"Prevence poškození kůže"},{id:"q-pec-10",moduleId:"prima-pece",question:"V jakém pořadí provádíme intimní hygienu u ležící klientky?",options:["Od konečníku směrem dopředu k močové trubici","Krouživým pohybem jednou žínkou tam i zpět","Vždy zepředu dozadu (od stydké spony směrem ke konečníku), aby se nezanesly střevní bakterie do močových cest","Pořadí nerozhoduje, pokud použijeme teplou vodu"],correctIndex:2,explanation:"Mytí zepředu dozadu je zásadní prevencí močových infekcí způsobených přenosem střevních bakterií (např. E. coli).",legalOrClinicalRef:"Zásady intimní hygieny"},{id:"q-pec-11",moduleId:"prima-pece",question:"Jak se pozná zdravá stomie (vývod střeva na břiše) při běžné pomoci s hygienou?",options:["Je suchá, bledá až černá a silně krvácí","Je sytě růžová až červená, vlhká a bez zánětu či odchlípnutí okolí","Je zcela modrá a tvrdá na dotek","Nesmí se jí dotknout ani teplá voda"],correctIndex:1,explanation:"Zdravá stomie vypadá podobně jako sliznice v ústech – růžová a vlhká. Zčernání, modrání či silné krvácení je urgentní stav pro sestru/lékaře.",legalOrClinicalRef:"Péče o klienta se stomií"},{id:"q-pec-12",moduleId:"prima-pece",question:"Jak má pečovatel reagovat, pokud při hygieně zjistí, že klient nemá stolici už 4. den?",options:["Sám mu podá dvě projímadla z lékárničky","Zapíše údaj do dokumentace a nahlásí obstipaci zdravotní sestře","Zakáže mu celý týden jíst pevnou stravu","Neřeší to, senioři mají zácpu běžně i 14 dní"],correctIndex:1,explanation:"Obstipace delší než 3 dny může vést k zablokování střev nebo deliriu – pečovatel informuje sestru (a podporuje pitný režim a pohyb).",legalOrClinicalRef:"Sledování fyziologických funkcí"},{id:"q-mob-01",moduleId:"mobilita-dekubity",question:"Co přesně je první (I.) stupeň dekubitu?",options:["Hluboký vřed zasahující až na kost","Vodnatý puchýř s tenkou kůží","Neblednoucí zarudnutí neporušené kůže (po stisku prstem nezbělá)","Černá odumřelá tkáň (nekróza)"],correctIndex:2,explanation:"Stupeň I se pozná podle neblednoucího zarudnutí při zachované celistvosti kůže. Pokud při stisku prstem místo zbělá, jde jen o přechodné prokrvení.",legalOrClinicalRef:"Klasifikace dekubitů EPUAP"},{id:"q-mob-02",moduleId:"mobilita-dekubity",question:"Které dvě oblasti jsou nejčastějším místem vzniku dekubitů při dlouhodobém ležení na zádech?",options:["Břicho a stehna","Křížová oblast (kostrč) a paty","Předloktí a dlaně","Hrudník a krk"],correctIndex:1,explanation:"Na zádech nesou největší tlak kostní výběžky v oblasti křížové kosti/kostrče a pat (dále lopatky, lokty a týl).",legalOrClinicalRef:"Predilekční místa dekubitů"},{id:"q-mob-03",moduleId:"mobilita-dekubity",question:"Jak správně podložíte dolní končetiny pro odlehčení pat u ležícího klienta?",options:["Podložíme celou délku lýtek měkkým válcem/polštářem tak, aby paty volně visely ve vzduchu","Dáme tvrdý srolovaný ručník přímo pod achilovku nebo těsně pod koleno","Obvážeme paty elastickým obinadlem co nejpevněji","Zvedneme klientovi nohy o 90° nahoru k čelu postele"],correctIndex:0,explanation:"Podložení celé plochy lýtek rozloží tlak a udrží paty bez kontaktu s matrací, aniž by se zaškrtily podkolenní cévy.",legalOrClinicalRef:"Prevence dekubitů pat"},{id:"q-mob-04",moduleId:"mobilita-dekubity",question:"Jaký je doporučený standardní interval polohování u ohroženého imobilního klienta?",options:["Jednou ráno a jednou večer","Každé 2 hodiny ve dne a každé 3 hodiny v noci (u vysoce rizikových i častěji)","Pouze tehdy, když si klient sám řekne","Jednou za 6 hodin po celý den i noc"],correctIndex:1,explanation:"K ischemickému poškození tkáně dochází už po 2 hodinách trvalého tlaku – standardem je proto 2 h ve dne / 3 h v noci.",legalOrClinicalRef:"Polohovací režim"},{id:"q-mob-05",moduleId:"mobilita-dekubity",question:"Co znamená výsledek 10 bodů na stupnici podle Nortonové?",options:["Klient je zcela soběstačný a nemá žádné riziko dekubitů","Vysoké riziko vzniku dekubitů (≤ 12 bodů = vysoké riziko!)","Klient má už 10 dekubitů","Stupnice Nortonové hodnotí sluch, nikoliv dekubity"],correctIndex:1,explanation:"U škály Nortonové (rozsah 5–20 bodů) platí nepřímá úměra: čím nižší číslo, tím horší stav a vyšší riziko dekubitů (12 a méně = vysoké riziko).",legalOrClinicalRef:"Škála Nortonové"},{id:"q-mob-06",moduleId:"mobilita-dekubity",question:"Proč při prevenci dekubitů upřednostňujeme 30° šikmou polohu na boku před ostrou 90° polohou?",options:["Protože 30° poloha odlehčí kostní výběžky kyčle i ramene a přenese váhu do svaloviny hýždí","Protože 30° poloha zaručí, že klient nikdy nespadne na zem bez postranic","Protože v 90° poloze klient nemůže dýchat","Jen kvůli rychlejšímu stlaní postele"],correctIndex:0,explanation:"Šikmá 30° poloha s klínem za zády chrání velký chocholík kyčle i rameno před bodovým tlakem.",legalOrClinicalRef:"Technika polohování 30°"},{id:"q-mob-07",moduleId:"mobilita-dekubity",question:"Které z uvedených je příznakem imobilizačního syndromu při dlouhém ležení?",options:["Zlepšení svalové síly a pružnosti kloubů","Kontraktury kloubů, svalová atrofie, zácpa, trombóza a městnavý zápal plic","Zrychlené hojení kostí a lepší chuť k jídlu","Zvýšení kapacity plic bez cvičení"],correctIndex:1,explanation:"Dlouhodobá imobilita zasahuje téměř všechny tělesné soustavy (pohybovou, dýchací, oběhovou, trávicí, močovou i psychiku).",legalOrClinicalRef:"Imobilizační syndrom"},{id:"q-mob-08",moduleId:"mobilita-dekubity",question:"Co MUSÍ pečovatel udělat jako první krok těsně před přesunem seniora z lůžka na invalidní vozík?",options:["Vzít klienta rychle za ruce a vytáhnout ho nahoru","Zabrzdit obě kola vozíku (a lůžko) a odklopit/složit stupačky","Nechat vozík odbrzděný, aby se dal při posazení přisunout","Zvednout si postel až po hrudník pečovatele"],correctIndex:1,explanation:"Nezabrzděný vozík při opření klienta ujede a způsobí vážný pád. Zabrzdění obou kol a odklopení stupaček je absolutní bezpečnostní základ.",legalOrClinicalRef:"Bezpečná manipulace a přesuny"},{id:"q-mob-09",moduleId:"mobilita-dekubity",question:"Co je hlavní zásadou kinestetiky a ochrany zad pečovatele při přesunu klienta?",options:["Předklonit se s rovnými koleny a tahat klienta silou za podpaží","Využít přirozené pohybové vzorce klienta, mít široký stoj, rovná záda, pokrčená kolena a těžiště co nejblíže klientovi","Zvedat těžké imobilní klienty vždy rychle sám, aby nebyl čas na strach","Držet klienta za krk jako páku"],correctIndex:1,explanation:"Tah za podpaží může klientovi vykloubit rameno a pečovateli poškodit bederní páteř. Pracujeme ze svalů nohou, s rovnými zády a pomocí pomůcek/kolegy.",legalOrClinicalRef:"Ergonomie a kinestetika"},{id:"q-mob-10",moduleId:"mobilita-dekubity",question:"Jaká jsou hlavní predilekční místa dekubitů u klienta, který většinu dne sedí na invalidním vozíku?",options:["Sedací hrboly (ischia), kostrč, lopatky, podkolenní jamka a paty na stupačkách","Nárty, kolena zepředu a nos","Prsty rukou a přední strana stehen","Pouze čelo a lokty"],correctIndex:0,explanation:"Při sezení nese téměř celou hmotnost trupu malá plocha sedacích hrbolů a kostrče; důležitý je gelový/vzduchový podsedák a správná výška stupaček.",legalOrClinicalRef:"Prevence dekubitů vsedě"},{id:"q-mob-11",moduleId:"mobilita-dekubity",question:"Jaká obuv je pro seniory v domově nejbezpečnější z hlediska prevence pádů?",options:["Volné gumové pantofle bez paty („nazouváky“)","Pevná, uzavřená obuv s pevnou patou a protiskluzovou podrážkou","Bavlněné ponožky bez podrážky","Těsné lakované boty s koženou hladkou podrážkou"],correctIndex:1,explanation:"Nazouváky se zouvají a zasekávají o prahy či podlahu. Bezpečná je pevná pata a protiskluzová podrážka.",legalOrClinicalRef:"Prevence pádů seniorů"},{id:"q-mob-12",moduleId:"mobilita-dekubity",question:"Proč nemá ležící klient trvale zvednuté záhlaví postele do vysokého polosedu bez podložení kolen?",options:["Tělo sjíždí dolů po matraci a vzniká střižná síla, která trhá cévy v křížové oblasti","Klient v polosedu nemůže spát déle než 10 minut","Zvyšuje se mu tím krevní tlak na nebezpečnou hodnotu","Polosed ničí polohovací motorek lůžka"],correctIndex:0,explanation:"Skluz těla dolů vytváří kombinaci tlaku a střižné síly na kostrč/kříž – hlavní spouštěč hlubokých sakrálních dekubitů.",legalOrClinicalRef:"Střižná síla a dekubity"},{id:"q-kom-01",moduleId:"komunikace-demence",question:"Který znak nejspolehlivěji odlišuje akutní delirium od Alzheimerovy demence?",options:["Delirium vzniká náhle (hodiny až dny), jeho projevy během dne kolísají a při léčbě příčiny je vratné","Delirium trvá vždy minimálně 10 let","Při deliriu si klient pamatuje úplně všechno bez výpadků","Delirium je pouze dědičná vlastnost a nedá se léčit"],correctIndex:0,explanation:"Náhlý nástup zmatenosti (často v důsledku dehydratace nebo infekce močových cest) je typický pro delirium – jde o akutní, ale léčitelný stav!",legalOrClinicalRef:"Diferenciální diagnostika 3D"},{id:"q-kom-02",moduleId:"komunikace-demence",question:"Co znamená princip validace podle Naomi Feil při komunikaci se seniorem s demencí?",options:["Přísné opravování každého chybného údaje, aby si klient procvičoval paměť","Uznání a přijetí emocí klienta v jeho subjektivní realitě bez hádání a bez zesměšňování","Souhlas se vším včetně lhaní o tom, že jsme mu už objednali odvoz domů","Mlčení a ignorování klienta, dokud se neuklidní sám"],correctIndex:1,explanation:"Validace přijímá a oceňuje pocity člověka (strach, láska, stesk), nepoučuje ho fakticky a dává mu pocit důstojnosti a bezpečí.",legalOrClinicalRef:"Metoda validace (Naomi Feil)"},{id:"q-kom-03",moduleId:"komunikace-demence",question:"Jakému tázacímu slovu se při validaci a komunikaci s člověkem s demencí vyhýbáme?",options:["Kdo?","Co?","Proč?","Kde?"],correctIndex:2,explanation:"Otázka „Proč jste to udělal?“ vyžaduje abstraktní logické zdůvodnění, což u demence vyvolává stres, pocit selhání a obranu.",legalOrClinicalRef:"Validace – komunikační techniky"},{id:"q-kom-04",moduleId:"komunikace-demence",question:"Co znamená pojem „sundowning“ (syndrom západu slunce) u klientů s demencí?",options:["Zlepšení paměti vždy po obědě","Nárůst neklidu, úzkosti, bloudění a zmatenosti v pozdním odpoledni a podvečer se stmíváním","Strach seniorů ze slunečního záření v létě","Ranní apatie před snídaní"],correctIndex:1,explanation:"Únava na konci dne a přítmí zhoršují orientaci. Pomáhá včasné teplé osvětlení, klidný hlas a smysluplná známá aktivita.",legalOrClinicalRef:"Specifika péče u demence"},{id:"q-kom-05",moduleId:"komunikace-demence",question:"Jakým směrem provádíte v Bazální stimulaci uklidňující koupel (např. večer u neklidného klienta)?",options:["Tahy žínkou PROTI směru růstu chloupků (k srdci)","Tahy žínkou PO směru růstu chloupků (shora dolů od hlavy ke špičkám)","Rychlým střídáním studené a horké sprchy","Kruhovými třecími pohyby jen na břiše"],correctIndex:1,explanation:"Tahy PO směru růstu chloupků uklidňují a snižují svalové napětí; tahy PROTI směru růstu chloupků naopak povzbuzují (vhodné ráno u apatických).",legalOrClinicalRef:"Bazální stimulace (prof. Fröhlich)"},{id:"q-kom-06",moduleId:"komunikace-demence",question:"K čemu slouží „iniciální dotek“ v Bazální stimulaci?",options:["K rychlému probuzení klienta zatřesením za nohy","K jasnému, klidnému oznámení začátku i konce kontaktu na předem domluveném místě (rameno/paže)","Ke zkoušce citlivosti na bolest štípnutím","Používá se jen při masáži zad"],correctIndex:1,explanation:"Iniciální dotek dává těžce nemocným a nemluvícím klientům bezpečnou informaci: „Jsem tu s tebou“ a při odchodu „Teď odcházím“.",legalOrClinicalRef:"Bazální stimulace"},{id:"q-kom-07",moduleId:"komunikace-demence",question:"Jak nejlépe popíšete jídlo na talíři nevidomému seniorovi?",options:["„Tady před sebou něco máte, sáhněte si na to vidličkou.“","Podle hodinového ciferníku (např. na dvanáctce maso, na šestce brambory, na trojce salát)","Nakrmíte ho vždy bez ptaní lžící, aby se neumazal","Pomocí světových stran (sever – jih)"],correctIndex:1,explanation:"Popis podle hodinového ciferníku umožňuje nevidomému samostatně a důstojně jíst bez ztráty kontroly.",legalOrClinicalRef:"Komunikace se zrakově postiženými"},{id:"q-kom-08",moduleId:"komunikace-demence",question:"Jaká je nejčastější chyba při komunikaci s nedoslýchavým seniorem?",options:["Mluvit zpříma v úrovni očí, aby mohl odezírat ze rtů","Hlasitý křik do ucha a mluvení zezadu (křik zkresluje výšky a působí agresivně)","Ztišení rádia či televize během rozhovoru","Kontrola zapnutého sluchadla a baterie"],correctIndex:1,explanation:"Křičení zvyšuje tón hlasu (senioři slyší hůř právě vysoké frekvence!) a působí hrubě. Lepší je klidný, zřetelný, mírně hlubší hlas z očí do očí.",legalOrClinicalRef:"Komunikace se sluchově postiženými"},{id:"q-kom-09",moduleId:"komunikace-demence",question:"Co je to afázie (např. po prodělané cévní mozkové příhodě)?",options:["Úplná ztráta inteligence a svéprávnosti","Porucha tvorby nebo porozumění řeči při poškození řečových center mozku – inteligence bývá zachována","Zánět hlasivek z nachlazení","Odmítání komunikace z trucu"],correctIndex:1,explanation:"Člověk s afázií často přesně ví, co chce říct, jen nemůže najít slova. Vyžaduje trpělivost, krátké věty, oční kontakt a alternativní komunikaci.",legalOrClinicalRef:"Neurologické poruchy komunikace"},{id:"q-kom-10",moduleId:"komunikace-demence",question:"Jak reaguje na otázky častěji klient v depresi (pseudodemence) oproti klientovi s Alzheimerovou demencí?",options:["Depresivní klient odpovídá „Nevím, na to nemám sílu“, kdežto klient s demencí chyby zakrývá nebo konfabuluje","Depresivní klient neustále vtipkuje a přehání","Klient s demencí si je vždy plně vědom každé své chyby a těší se na test","Není mezi nimi žádný rozdíl"],correctIndex:0,explanation:"Při depresi dominuje apatie a rezignace („Nevím“); při demenci dlouhodobá snaha zakrýt výpadky paměti a vymýšlení náhradních příběhů (konfabulace).",legalOrClinicalRef:"Deprese vs. Demence"},{id:"q-kom-11",moduleId:"komunikace-demence",question:"Který druh paměti bývá u seniorů s demencí zachován nejdéle a využívá se při reminiscenci?",options:["Krátkodobá paměť (co měl před hodinou k obědu)","Dlouhodobá a emoční paměť (vzpomínky z mládí, písně, řemeslo)","Paměť na nové orientační tabulky na chodbě","Pracovní paměť pro nová telefonní čísla"],correctIndex:1,explanation:"Dlouhodobé vzpomínky z dětství a mládí mizí jako poslední – proto staré fotky a lidové písně fungují skvěle.",legalOrClinicalRef:"Reminiscenční terapie"},{id:"q-kom-12",moduleId:"komunikace-demence",question:"Co obnáší biografický přístup v péči o seniora?",options:["Psaní dlouhého životopisu do novin po úmrtí klienta","Poznání životní historie, povolání, zájmů a zvyklostí klienta pro pochopení jeho chování a nastavení individuální péče","Zjišťování majetkových poměrů jeho dětí","Jednotný denní režim pro celé patro bez výjimek"],correctIndex:1,explanation:"Když víme, jak klient celý život pracoval a co měl rád, rozumíme lépe jeho návykům (např. brzké vstávání bývalého pekaře či strach z vody).",legalOrClinicalRef:"Biografický model péče"},{id:"q-akt-01",moduleId:"aktivizace-paliativa",question:"Jak nejlépe předcházíte vzniku závislosti seniora na sociální službě?",options:["Uděláte vše za něj, aby si odpočinul a nezdržoval provoz","Podporujete ho, aby si co nejvíce úkonů dělal sám podle svých sil, a pomáháte jen v nezbytné míře","Zrušíte veškerou pomoc, ať se klient naučí poradit si bez personálu","Necháte ho celý den v posteli, aby nespadl"],correctIndex:1,explanation:"Podpora zbývající soběstačnosti a přiměřená dopomoc brání vzniku naučené bezmocnosti a ztrátě dovedností.",legalOrClinicalRef:"§ 2 zákona č. 108/2006 Sb."},{id:"q-akt-02",moduleId:"aktivizace-paliativa",question:"Jaké je správné pořadí 5 fází vyrovnávání s nevyléčitelnou nemocí a smrtí podle Elisabeth Kübler-Rossové?",options:["Hněv – Popření – Deprese – Smlouvání – Smíření","Popření – Hněv – Smlouvání – Deprese – Smíření","Smíření – Smlouvání – Deprese – Popření – Hněv","Deprese – Popření – Hněv – Smíření – Smlouvání"],correctIndex:1,explanation:"Klasické pořadí je: 1. Popření (šok), 2. Hněv, 3. Smlouvání, 4. Deprese (smutek), 5. Smíření (přijetí). Jednotlivé fáze se mohou i vracet.",legalOrClinicalRef:"Elisabeth Kübler-Rossová"},{id:"q-akt-03",moduleId:"aktivizace-paliativa",question:"Jak má pečovatel reagovat, když se umírající klient nachází ve fázi hněvu a křičí na něj bez zjevného důvodu?",options:["Ohradit se a přestat k němu na truc chodit","Nezlobit se, nebrat si hněv osobně – jde o přirozenou obranu před bezmocí z nemoci; zachovat klid a lidskou blízkost","Pohrozit mu stěhováním na jiný pokoj","Okamžitě ho zamknout v pokoji, až ho zlost přejde"],correctIndex:1,explanation:"Hněv je druhou fází dle Kübler-Rossové – není namířen proti pečovateli jako osobě, ale proti nemoci a ztrátě kontroly nad životem.",legalOrClinicalRef:"Doprovázení umírajících"},{id:"q-akt-04",moduleId:"aktivizace-paliativa",question:"Který smysl zůstává u umírajícího člověka zachován nejdéle i v hlubokém útlumu?",options:["Zrak","Čich","Sluch (a vnímání doteku)","Chuť"],correctIndex:2,explanation:"Sluch vyhasíná jako úplně poslední smysl – proto na umírajícího vždy mluvíme klidně, s úctou a nikdy o něm v jeho přítomnosti nemluvíme nevhodně.",legalOrClinicalRef:"Paliativní ošetřovatelství"},{id:"q-akt-05",moduleId:"aktivizace-paliativa",question:"Co je hlavním cílem paliativní péče v domově pro seniory?",options:["Vyléčit každou chronickou nemoc agresivní terapií za každou cenu","Zajistit co nejvyšší kvalitu života v jeho závěru – mírnit bolest a dušnost, zachovat důstojnost a nebýt sám","Urychlit závěr života bez účasti rodiny","Omezit kontakt s rodinou, aby nebyla smutná"],correctIndex:1,explanation:"Paliativní péče se soustředí na úlevu od tělesného i duševního strádání a důstojné doprovázení klienta i jeho blízkých.",legalOrClinicalRef:"Definice paliativní péče (WHO)"},{id:"q-akt-06",moduleId:"aktivizace-paliativa",question:"Která aktivizační metoda nejvíce pomáhá udržet jemnou motoriku a soběstačnost při běžných činnostech (oblékání, vaření)?",options:["Ergoterapie a nácvik všedních denních činností","Pasivní sledování televize","Pouze celodenní ležení v posteli","Vyplňování formulářů na úřadě"],correctIndex:0,explanation:"Ergoterapie cíleně trénuje každodenní praktické dovednosti, koordinaci rukou a používání kompenzačních pomůcek.",legalOrClinicalRef:"Aktivizační techniky"},{id:"q-akt-07",moduleId:"aktivizace-paliativa",question:"Co z uvedeného je příkladem nevhodné (infantilní) aktivizace v domově pro seniory?",options:["Trénink paměti formou kvízů a přísloví","Nucení seniorů zpívat dětské říkanky pro mateřskou školu a vybarvovat dětské omalovánky bez respektu k jejich věku","Společné pečení štrúdlu a vzpomínání na rodinné recepty","Canisterapie s cvičeným psem"],correctIndex:1,explanation:"Senior je dospělý člověk s celoživotní zkušeností – aktivizace musí být důstojná, dobrovolná a věkově přiměřená.",legalOrClinicalRef:"Etika aktivizace"},{id:"q-akt-08",moduleId:"aktivizace-paliativa",question:"Jaký jednoduchý a velmi důležitý komfortní úkon děláme u umírajícího klienta, který dýchá ústy a nepije?",options:["Naléváme mu lžící studenou vodu do krku i proti reflexu","Jemně a pravidelně zvlhčujeme rty a dutinu ústní vlhkou gázou/štětičkou a ošetřujeme rty balzámem","Nutíme ho sníst plnou misku polévky","Necháme rty suché, protože to už nevadí"],correctIndex:1,explanation:"Zvlhčování sliznice a rtů přináší umírajícímu obrovskou úlevu od pocitu sucha a žízně bez rizika vdechnutí tekutiny.",legalOrClinicalRef:"Komfortní paliativní péče"},{id:"q-akt-09",moduleId:"aktivizace-paliativa",question:"Kdy smí pečovatel začít se závěrečnou úpravou těla zemřelého klienta?",options:["Ihned v okamžiku, kdy se mu zdá, že klient přestal dýchat","Teprve poté, co úmrtí oficiálně konstatuje lékař (prohlídka zemřelého)","Až po odjezdu pohřební služby","Nikdy, tělo se v domově nijak neupravuje"],correctIndex:1,explanation:"Vždy se nejprve přivolá lékař ke konstatování smrti (a dle organizace po uplynutí daného času piety/prohlídky se provede důstojná úprava těla).",legalOrClinicalRef:"Postup při úmrtí v DS"},{id:"q-akt-10",moduleId:"aktivizace-paliativa",question:"Co znamená princip „individuální aktivizace u lůžka“?",options:["Aktivizace jen pro ty nejrychlejší klienty v jídelně","Přizpůsobení podnětů ležícímu klientovi (předčítání, hudba do sluchátek, povídání nad albem, hmatové podněty)","Rozcvička formou povinných dřepů","Pouze rozsvícení televize na celý den"],correctIndex:1,explanation:"I těžce imobilní klient má právo na kontakt, radost a podněty v rámci individuálního plánu.",legalOrClinicalRef:"Standard č. 5 & Aktivizace"},{id:"q-akt-11",moduleId:"aktivizace-paliativa",question:"Jaký prokázaný přínos má canisterapie v domovech pro seniory?",options:["Zvyšuje agresivitu a nespavost","Snižuje úzkost, stres a krevní tlak, motivuje k pohybu i komunikaci","Nahrazuje veškeré léky na srdce","Slouží pouze k hlídání budovy v noci"],correctIndex:1,explanation:"Přítomnost cvičeného psa a přímý dotek navozují pocit přijetí, radost a uvolnění.",legalOrClinicalRef:"Animoterapie v sociálních službách"},{id:"q-akt-12",moduleId:"aktivizace-paliativa",question:"Co je z hlediska podpory rodiny důležité po úmrtí seniora v domově?",options:["Co nejrychleji sbalit věci do pytle a rodinu nepouštět na pokoj","Nabídnout rodině soukromí k důstojnému rozloučení u lůžka, empatii a praktickou pomoc s předáním věcí i informací","Zakázat ostatním spolubydlícím o úmrtí mluvit","Požadovat okamžitě další měsíční úhradu navíc"],correctIndex:1,explanation:"Součástí kvalitní paliativní péče je i pietní rozloučení pro rodinu a citlivé oznámení spolubydlícím.",legalOrClinicalRef:"Paliativní péče a truchlení"},{id:"q-nar-01",moduleId:"narocne-situace",question:"Co bývá nejčastější příčinou náhlé agrese seniora při ranní hygieně?",options:["Zlá povaha seniora, který chce pečovatele schválně trápit","Strach, stud z obnažení, neřešená bolest nebo příliš rychlý a neohlášený dotek zezadu","Nedostatek přísných trestů v zařízení","Příliš tichý hlas pečovatele"],correctIndex:1,explanation:"Agrese u seniorů (zvlášť s demencí) je téměř vždy obrannou reakcí na ohrožení, bolest nebo nepochopení situace.",legalOrClinicalRef:"Příčiny agresivity seniorů"},{id:"q-nar-02",moduleId:"narocne-situace",question:"Na co musíte myslet v místnosti, kde jednáte s výrazně rozrušeným až agresivním klientem?",options:["Stoupnout si co nejblíže přímo před něj do rohu místnosti","Zachovat bezpečný odstup (na délku paže a půl), stát mírně bokem a mít VŽDY volnou únikovou cestu ke dveřím","Zamknout za sebou dveře zevnitř, aby neodešel","Chytit ho co nejrychleji za ramena a zatřást s ním"],correctIndex:1,explanation:"Volná úniková cesta ke dveřím a bezpečný odstup chrání vás i klienta před eskalací a zraněním.",legalOrClinicalRef:"Bezpečná deeskalace konfliktu"},{id:"q-nar-03",moduleId:"narocne-situace",question:"Který postup verbální deeskalace je u rozzlobeného klienta nejúčinnější?",options:["Křičet ještě hlasitěji, abychom získali převahu","Udržet nízký, klidný tón hlasu, nehodnotit, naslouchat a nabídnout jasnou možnost volby nebo čas na uklidnění","Pohrozit zavoláním policie a vyhozením z domova","Smát se mu, že se rozčiluje kvůli maličkosti"],correctIndex:1,explanation:"Klidný tón a respekt snižují adrenalin; posměch, hrozby nebo křik napětí prudce zvyšují.",legalOrClinicalRef:"Verbální deeskalace"},{id:"q-nar-04",moduleId:"narocne-situace",question:"Jak se bezpečně vyprostit, pokud vám klient v afektu pevně svírá zápěstí?",options:["Udeřit ho druhou rukou do ramene","Využít šetrnou sebeobranu – krátkým pohybem vytočit ruku směrem přes palec útočníka (nejslabší bod úchopu) a ustoupit","Křičet a tahat ruku hrubou silou přímo dozadu proti všem prstům","Kousnout klienta do ruky"],correctIndex:1,explanation:"Směr přes palec je anatomicky nejslabší místo stisku; šetrné vyproštění nikomu neublíží a umožní bezpečně ustoupit.",legalOrClinicalRef:"Šetrná sebeobrana v sociálních službách"},{id:"q-nar-05",moduleId:"narocne-situace",question:"Jaká je nejvhodnější reakce v krizové intervenci, když klient pláče nad ztrátou manžela?",options:["„Nebrečte, vždyť už jste byli staří oba a tady máte aspoň společnost.“","Zůstat chvíli s ním, aktivně naslouchat, uznat jeho bolest („Je to velká ztráta, moc vám chybí“) a nabídnout podporu","Okamžitě pustit nahlas veselou hudbu a odejít","Říct mu, ať si vezme prášek na spaní"],correctIndex:1,explanation:"V krizi pomáhá lidská přítomnost a uznání bolesti – nikoliv bagatelizace („to nic není“) ani útěk před emocemi.",legalOrClinicalRef:"Krizová intervence"},{id:"q-nar-06",moduleId:"narocne-situace",question:"Co uděláte okamžitě, když se vám senior svěří, že „už nechce žít a večer si něco udělá“?",options:["Mávnu nad tím rukou, staří lidé to tak říkají často","Slíbím mu, že to nikomu neřeknu, a odejdu domů","Vezmu jeho slova zcela vážně, zůstanu s ním v bezpečí, naslouchám a IHNED informuji sestru, vedoucí či lékaře","Vynadám mu, že takhle mluvit je sobecké"],correctIndex:2,explanation:"Suicidální proklamace nesmíme nikdy podcenit ani zatajit pod záminkou „tajemství“ – ochrana života má nejvyšší prioritu.",legalOrClinicalRef:"Krizová intervence – ohrožení života"},{id:"q-nar-07",moduleId:"narocne-situace",question:"Jak se projevuje pokročilý syndrom vyhoření (burnout) u pracovníka v přímé péči?",options:["Velkým nadšením pro nové koníčky a zdravým spánkem","Chronickou únavou, cynismem a bezcitností ke klientům, ztrátou smyslu práce a častými psychosomatickými obtížemi","Krátkodobou únavou po jedné dvanáctihodinové směně, která po spánku zmizí","Chutí učit se nové věci"],correctIndex:1,explanation:"Syndrom vyhoření je dlouhodobé vyčerpání těla i psychiky typické ztrátou empatie (cynismem) a pocitem vyprázdnění.",legalOrClinicalRef:"Psychohygiena a vyhoření"},{id:"q-nar-08",moduleId:"narocne-situace",question:"Co je hlavním smyslem supervize v domově pro seniory?",options:["Tajné hodnocení pracovníků pro udělení pokut ředitelem","Bezpečný prostor vedený nezávislým odborníkem k řešení náročných situací, zlepšení spolupráce týmu a prevenci vyhoření","Účetní kontrola skladu potravin","Povinné školení požární ochrany"],correctIndex:1,explanation:"Supervize je podpůrná metoda (součást Standardu č. 10), nikoliv kárná kontrola.",legalOrClinicalRef:"Standard kvality č. 10 – Supervize"},{id:"q-nar-09",moduleId:"narocne-situace",question:"Jaký je rozdíl mezi supervizí a intervizí?",options:["Supervizi vede nezávislý externí supervizor, kdežto intervize je vzájemná porada a podpora kolegů v týmu","Intervize je pouze pro ředitele, supervize pro uklízečky","Pojmy znamenají přesně totéž","Intervize se týká jen zdravotní dokumentace"],correctIndex:0,explanation:"Oba nástroje pomáhají sdílet zátěž; supervizor přináší nezávislý odborný pohled zvenčí.",legalOrClinicalRef:"Nástroje podpory týmu"},{id:"q-nar-10",moduleId:"narocne-situace",question:"Jaká zásada účinně chrání pracovníka před vyhořením v soukromém životě?",options:["Brát si všechny pracovní směny navíc bez volna","Oddělit práci od osobního života, mít koníčky mimo sociální služby, kvalitní spánek a umět říkat zdravé „ne“","Neustále myslet na problémy klientů i o dovolené","Nikomu se nesvěřovat s těžkými pocity"],correctIndex:1,explanation:"Duševní hygiena a jasné hranice mezi prací a domovem jsou základem pro dlouhodobě kvalitní a laskavou péči.",legalOrClinicalRef:"Prevence syndromu vyhoření"},{id:"q-nar-11",moduleId:"narocne-situace",question:"Proč může nový senior v prvních týdnech pobytu v domově pro seniory projevovat odmítání či hněv (adaptační krize)?",options:["Ztratil vlastní byt, soukromí, věci, známé prostředí a kontrolu nad každodenním rytmem","Má příliš mnoho peněz","Chce si vynutit lepší pokoj hned první den","Všichni senioři jsou přirozeně konfliktní"],correctIndex:0,explanation:"Nástup do ústavní péče je jednou z největších životních ztrát – trpělivost a respekt k jeho návykům pomáhají adaptaci překonat.",legalOrClinicalRef:"Psychologie adaptace seniora"},{id:"q-nar-12",moduleId:"narocne-situace",question:"Jak pomůže zápis o spouštěči agresivní reakce do týmového hlášení / dokumentace?",options:["Slouží jako důkaz pro udělení trestu klientovi","Celý tým pozná, co klienta děsí nebo bolí (např. hlasitá hudba, studený dotek, konkrétní denní doba) a příště situaci předejde","Zápis se nesmí dělat, protože platí mlčenlivost","Pouze pro statistiku úřadu práce"],correctIndex:1,explanation:"Sdílení pozorování v týmu (Standard č. 6) umožňuje upravit individuální přístup a předejít zbytečným krizím.",legalOrClinicalRef:"Standard kvality č. 6"},{id:"q-pp-01",moduleId:"prvni-pomoc",question:"Jaký je správný poměr stlačení hrudníku a vdechů při kardiopulmonální resuscitaci (KPR) dospělého?",options:["15 stlačení : 2 vdechy","30 stlačení : 2 vdechy (hloubka 5–6 cm, frekvence 100–120/min)","5 stlačení : 1 vdech","100 stlačení : 10 vdechů"],correctIndex:1,explanation:"Standardní KPR dospělého podle ERC je 30 stlačení středu hrudníku do hloubky 5–6 cm rychlostí 100–120/min : 2 vdechům (nebo nepřetržitá komprese hrudníku).",legalOrClinicalRef:"Doporučení ERC pro KPR"},{id:"q-pp-02",moduleId:"prvni-pomoc",question:"Co uděláte, když senior leží v bezvědomí a jen občas lapavě sípe („gasping“)?",options:["Uložím ho na bok a počkám půl hodiny, protože stále dýchá","Okamžitě volám 155 a zahájím resuscitaci (KPR) – gasping znamená zástavu oběhu!","Dám mu napít studené vody, aby se probral","Změřím mu nejprve teplotu v podpaží"],correctIndex:1,explanation:"Gasping (lapavé dýchání) není normální dýchání – je to reflex při zástavě srdce. Ztráta času čekáním by byla smrtelná.",legalOrClinicalRef:"Rozpoznání srdeční zástavy"},{id:"q-pp-03",moduleId:"prvni-pomoc",question:"Co testujete u seniora při podezření na cévní mozkovou příhodu pomocí testu FAST?",options:["Teplotu, tlak a hladinu cukru","Face (pokles koutku), Arm (pokles jedné ruky), Speech (porucha řeči), Time (ihned volat 155)","Zda umí napsat své jméno a spočítat příklad","Barvu kůže na patách"],correctIndex:1,explanation:"Test FAST spolehlivě zachytí příznaky mrtvice; ihned voláme 155 a hlásíme přesný čas vzniku potíží (klíčové pro trombolýzu).",legalOrClinicalRef:"Diagnostika CMP (test FAST)"},{id:"q-pp-04",moduleId:"prvni-pomoc",question:"Co uděláte jako první krok u seniora při vědomí, který se dusí soustem a ÚČINNĚ, HLASITĚ KAŠLE?",options:["Okamžitě mu dáme 5 úderů pěstí do břicha","Povzbuzujeme ho k dalšímu kašli a nezasahujeme údery do zad (kašel je nejúčinnější ochrana)","Dáme mu vypít půl litru vody","Zvedneme mu ruce nad hlavu a poklepáváme na hrudník"],correctIndex:1,explanation:"Dokud člověk silně kašle, dýchací cesty nejsou úplně uzavřené. Údery do zad a Heimlichův manévr nasazujeme až při neúčinném kašli / tichém dušení.",legalOrClinicalRef:"První pomoc při dušení"},{id:"q-pp-05",moduleId:"prvni-pomoc",question:"Jak postupujeme, když se dusící klient přestane ozývat, nemůže kašlat ani dýchat (je při vědomí)?",options:["Provedeme 5 rázných úderů mezi lopatky v předklonu a střídáme s 5× Heimlichovým manévrem (stlačení nadbřišku)","Položíme ho na záda a čekáme na lékaře","Zkusíme mu naslepo sáhnout prsty hluboko do krku","Podáme mu kousek měkkého chleba"],correctIndex:0,explanation:"U těžké obstrukce střídáme 5 úderů mezi lopatky a 5 břišních stlačení (Heimlich); při ztrátě vědomí voláme 155 a zahajujeme KPR.",legalOrClinicalRef:"První pomoc při obstrukci dýchacích cest"},{id:"q-pp-06",moduleId:"prvni-pomoc",question:"Které známky po pádu seniora ukazují na pravděpodobnou zlomeninu krčku stehenní kosti?",options:["Noha je viditelně delší a špička míří dovnitř","Poraněná noha je zkrácená, vytočená špičkou ven (zevní rotace) a silně bolí v kyčli/třísle","Bolí ho jen oba lokty","Klient bez problému udělá 10 dřepů"],correctIndex:1,explanation:"Zkrácená a zevně rotovaná končetina po pádu je typická pro zlomeninu krčku femuru – klienta nezvedáme, přikryjeme a voláme 155.",legalOrClinicalRef:"Úrazy v geriatrii"},{id:"q-pp-07",moduleId:"prvni-pomoc",question:"Jaká je správná první pomoc u diabetika při vědomí s příznaky hypoglykémie (třes, studený pot, slabost)?",options:["Podat rychlý cukr ústy (sladký nápoj, džus, hroznový cukr) a přivolat zdravotní sestru","Aplikovat dávku inzulinu do břicha","Podat neslazenou hořkou kávu","Uložit ho bez jídla spát"],correctIndex:0,explanation:"Při hypoglykémii chybí v krvi glukóza – rychlý cukr při vědomí okamžitě zvedne hladinu cukru. V bezvědomí naopak nikdy nic do úst nelijeme!",legalOrClinicalRef:"Akutní komplikace diabetu"},{id:"q-pp-08",moduleId:"prvni-pomoc",question:"Jaká je jediná správná první pomoc během probíhajících křečí epileptického záchvatu?",options:["Vložit mezi zuby dřevěnou vařečku nebo ruku, aby si nepokousal jazyk","Chránit hlavu podložením, odstranit nebezpečné předměty z okolí, měřit čas a do úst NIC nevkládat","Pevně držet ruce i nohy, aby se přestal třást","Polít obličej ledovou vodou"],correctIndex:1,explanation:"Při silném stisku čelistí by vložený předmět polámal zuby a mohl by být vdechnut. Křečím nebráníme, po záchvatu uložíme na bok.",legalOrClinicalRef:"První pomoc u epilepsie"},{id:"q-pp-09",moduleId:"prvni-pomoc",question:"Co uděláte jako první při zjištění prudce stříkajícího tepenného krvácení z předloktí?",options:["Půjdu nejprve vypsat hlášení do sesterny","V rukavicích okamžitě stlačím ránu prsty (přes krytí/látku), zvednu končetinu nad úroveň srdce a volám pomoc / 155","Omývám ránu 20 minut pod studenou vodou","Nechám krev volně téct, aby se rána vyčistila"],correctIndex:1,explanation:"Přímý tlak v ráně a elevace končetiny zastaví krvácení nejrychleji a chrání před vykrvácením do šoku.",legalOrClinicalRef:"Zástava masivního krvácení"},{id:"q-pp-10",moduleId:"prvni-pomoc",question:"Jak správně ošetříte čerstvou popáleninu od horkého čaje na ruce seniora?",options:["Namažete ji máslem nebo sádlem a posypete moukou","Chladíte postižené místo čistou chladnou/vlažnou tekoucí vodou cca 10–20 minut (jen místo, aby se senior nepodchladil)","Propícháte všechny puchýře špendlíkem","Přiložíte přímo kostku ledu z mrazáku"],correctIndex:1,explanation:"Chladíme pouze čistou vodou bez domácích mastí a bez ledu (led způsobuje omrzlinu!). Puchýře se nepropichují.",legalOrClinicalRef:"První pomoc při popáleninách"},{id:"q-pp-11",moduleId:"prvni-pomoc",question:"Jak dlouho trvá správná alkoholová hygienická dezinfekce rukou?",options:["Stačí 3 sekundy otřít dlaně","Minimálně 30 sekund po celé ploše rukou (včetně palců, meziprstí a špiček) do zaschnutí","Musí trvat přesně 10 minut","Provádí se jen jednou týdně"],correctIndex:1,explanation:"Účinnost alkoholového přípravku vyžaduje dodržení expoziční doby cca 30 sekund a důkladné pokrytí všech ploch ruky.",legalOrClinicalRef:"Hygiena rukou WHO"},{id:"q-pp-12",moduleId:"prvni-pomoc",question:"Jak se zachováte s ložním prádlem z pokoje klienta s akutním průjmovým onemocněním (noroviry) nebo svrabem?",options:["Prádlo energicky vyklepeme na chodbě a hodíme volně do společného vozíku","Uložíme ho přímo u lůžka v ochranných pomůckách do označeného/rozpustného infekčního pytle bez vytřepávání","Necháme ho v pokoji pod postelí až do konce týdne","Vypereme ho v ruce v umyvadle klienta"],correctIndex:1,explanation:"Vytřepáváním prádla se patogeny či zákožky šíří vzduchem po celém oddělení. Součástí bariérového režimu je uzavřená manipulace u zdroje.",legalOrClinicalRef:"Bariérový režim v sociálních službách"}],ly=[{id:"sc-validace-kufr",moduleId:"komunikace-demence",title:"Paní Marie si balí tašku a chce jít „za dětmi do školy“",clientProfile:"Paní Marie (84 let), středně těžká Alzheimerova demence, v domově bydlí 4 měsíce.",situation:"Je 17:15 (začíná se stmívat). Paní Marie nervózně chodí po chodbě s igelitovou taškou plnou ručníků, klepe na skleněné dveře oddělení a pláče: „Pusťte mě hned domů, musím vyzvednout Kubíka ze školy a udělat mu večeři, dostane vynadáno!“",choices:[{id:"a",text:"Důrazně jí vysvětlím realitu: „Paní Marie, váš Jakub má už 55 let a bydlí v Brně. Vy bydlíte v domově pro seniory, nikam dnes nejdete.“",isBest:!1,scoreDelta:0,feedback:"Konfrontace s realitou u středně těžké demence působí nový šok, nedůvěru a prohlubuje úzkost nebo agresi. Klientka si zítra fakt stejně nezapamatuje, ale odnese si pocit, že jí chcete ublížit."},{id:"b",text:"Přistoupím čelem v úrovni očí, klidným hlasem uznám její emoci (validace): „Vidím, že máte o Kubíka velkou starost a jste moc pečlivá maminka. Pojďte si na chvilku sednout sem k teplému čaji a řekněte mi, co jste mu ráda vařila.“",isBest:!0,scoreDelta:10,feedback:"Výborně! Použila jste validaci (Naomi Feil), uznala jste její emoci bez lhaní i bez drsné konfrontace, nabídla bezpečí a odvedla pozornost k příjemné vzpomínce v době večerního neklidu (sundowning)."},{id:"c",text:"Řeknu jí: „Dobře, zůstaňte tu u dveří, já vám zavolám taxíka, ale počkejte půl hodiny,“ abych měla klid na rozvoz večeří.",isBest:!1,scoreDelta:2,feedback:"Vědomé obelhávání klienta („zavolám taxíka“) snižuje důvěru, když slib nesplníte, a zanechává paní Marii v úzkosti stát za dveřmi."},{id:"d",text:"Vezmu jí tašku z ruky, odvedu ji do pokoje a zamknu dveře, aby neutekla.",isBest:!1,scoreDelta:0,feedback:"Závažná chyba! Odebrání osobních věcí vyvolá paniku a zamčení pokoje je nezákonné omezení osobní svobody (§ 89 zákona č. 108/2006 Sb.)."}],oralExamModelAnswer:["Rozpoznám příznaky syndromu západu slunce (sundowning) u klientky s demencí.","Nepoužívám hádku ani direktivní opravování reality, nelžu jí a v žádném případě ji nezamykám.","Aplikuji validaci dle Naomi Feil: přijmu její pocit mateřské lásky a starosti, navážu klidný oční kontakt, nabídnu doprovod, světlo, teplý nápoj a rozhovor o minulosti (reminiscence)."],keyTakeaway:"U demence potvrzujte emoci, ne fakta. Nikdy klienta neponižujte ani nezamykejte."},{id:"sc-hygiena-odmitani",moduleId:"prima-pece",title:"Nový klient kategoricky odmítá večerní sprchu",clientProfile:"Pan Josef (79 let), po lehčí CMP, v domově je teprve 5. den (adaptační období).",situation:"Přijdete na večerní směnu v 19:00 a chcete pana Josefa vzít do sprchy. On se rozčílí, odmítá svléknout košili a říká: „Nechte mě být, nebudu se před cizí ženskou svlékat, nejsem žádné malé děcko!“",choices:[{id:"a",text:"Zavolám druhou kolegyni a společně ho rychle svlékneme, protože v harmonogramu je napsaná koupel.",isBest:!1,scoreDelta:0,feedback:"Násilné prosazování hygieny proti vůli klienta hrubě porušuje jeho lidskou důstojnost (§ 2) a způsobuje trauma i odpor k personálu."},{id:"b",text:"Respektuji jeho hranice a stud. Klidně se omluvím za spěch, ujistím ho, že nic nemusí proti své vůli, a zkusím zjistit, jak byl zvyklý (zda se sprchoval raději ráno, zda chce umýt jen u umyvadla s částečným zakrytím nebo mužského pečovatele).",isBest:!0,scoreDelta:10,feedback:"Skvěle! Respektujete stud, autonomii i zvyklosti klienta v adaptační fázi. Nabídnutím volby (ráno vs. večer, omytí jen intimních partií pod ručníkem, pečovatel muž) vracíte panu Josefovi pocit kontroly nad vlastním tělem."},{id:"c",text:"Vyčtu mu: „Pane Josefe, když se neumyjete, budete zapáchat a dostanete opruzeniny, to si myslíte, že na vás zítra bude čas?“",isBest:!1,scoreDelta:0,feedback:"Moralizování, vyhrožování a vytváření pocitu viny ničí důvěru v době citlivé adaptace."}],oralExamModelAnswer:["Pochopím stud a adaptační krizi nově příchozího klienta – cizí prostředí a ztráta intimity.","Nikdy neprovádím hygienu násilím ani za pomoci přesily jen kvůli „rozpisu koupelí“.","Nabídnu varianty: posunout sprchu na ráno dle zvyku z domova, nabídnout částečnou hygienu se zakrytím těla, případně muže-pečovatele, a výsledek zapíšu do dokumentace pro individuální plán."],keyTakeaway:"Hygiena se přizpůsobuje zvykům a studu klienta, nikdy ne naopak."},{id:"sc-pad-krcek",moduleId:"prvni-pomoc",title:"Pád paní Věry na chodbě – podezření na zlomeninu krčku",clientProfile:"Paní Věra (86 let), osteoporóza, chodí s francouzskou holí.",situation:"Slyšíte ránu na chodbě. Paní Věra leží na boku na zemi, sténá bolestí v levé kyčli. Když se podíváte na dolní končetiny, levá noha je viditelně kratší než pravá a špička nohy směřuje ven.",choices:[{id:"a",text:"Rychle ji s kolegyní zvedneme za podpaží na vozík a odvezeme ji do postele, aby jí nebyla zima na chodbě.",isBest:!1,scoreDelta:0,feedback:"Nebezpečná chyba! Zkrácená a zevně rotovaná končetina po pádu je učebnicovým příznakem zlomeniny krčku stehenní kosti. Násilné zvedání může způsobit posun úlomků a poškození cév či nervů."},{id:"b",text:"Paní Věru nezvedám ani s ní nehýbu. Přikryji ji dekou, podložím měkce hlavu i poraněnou končetinu v nalezené poloze, uklidňuji ji, zůstanu s ní a okamžitě volám zdravotní sestru a ZZS 155.",isBest:!0,scoreDelta:10,feedback:"Naprosto správně! Rozpoznala jste příznaky zlomeniny krčku stehenní kosti (zkrácení + zevní rotace + bolest v kyčli), zabránila druhotnému poškození a zajistila teplo a rychlou pomoc."},{id:"c",text:"Zkusím jí nohu opatrně srovnat do roviny a zvednout ji, jestli se na ni dokáže postavit.",isBest:!1,scoreDelta:0,feedback:"Zlomeninu nikdy nesmíte „rovnat“ ani zkoušet zatížení končetiny – hrozí těžký šok a vnitřní krvácení."}],oralExamModelAnswer:["Popis příznaků: silná bolest v kyčli/třísle, neschopnost pohybu, typicky zkrácená a zevně rotovaná dolní končetina.","Postup PSS: s klientem nemanipulovat a nezvedat ho! Zajistit tepelný komfort (deka pod i přes klienta), vypodložit v nalezené poloze, komunikovat a uklidňovat, ihned volat sestru a ZZS 155.","Poznámka: nic nedávat pít ani jíst kvůli možné operaci v celkové anestezii."],keyTakeaway:"Zkrácená a vytočená noha po pádu = zlomenina krčku → NEZVEDAT, přikrýt, volat 155."},{id:"sc-dekubit-1st",moduleId:"mobilita-dekubity",title:"Zarudnutí na křížové kosti při ranní hygieně",clientProfile:"Pan Karel (88 let), imobilní po těžké cévní mozkové příhodě, inkontinentní.",situation:"Při ranním přebalování na lůžku vidíte v křížové oblasti červenou skvrnu o velikosti dlaně. Kůže není prasklá ani nemá puchýř, ale když na ni jemně zatlačíte prstem, zarudnutí nezbělá.",choices:[{id:"a",text:"Místo důkladně namasíruji chladivou francovkou a potřu vrstvou sádla, aby se pokožka dobře prokrvila.",isBest:!1,scoreDelta:0,feedback:"Zásadní chyba! Neblednoucí zarudnutí je dekubit I. stupně. Masírování nebo tření poškozuje již ischemickou tkáň pod povrchem a urychluje vznik hluboké rány."},{id:"b",text:"Zajistím čistou a suchou kůži bez tření, pana Karla ihned přepolohuji na bok (30° poloha) tak, aby na kříž nebyl žádný tlak, a okamžitě nález nahlásím zdravotní sestře.",isBest:!0,scoreDelta:10,feedback:"Přesně tak! Neblednoucí zarudnutí je dekubit I. stupně. Klíčové je okamžité odlehčení tlaku, zákaz masáže a včasné nahlášení zdravotní sestře k dalšímu ošetřovatelskému plánu."},{id:"c",text:"Nechám ho ležet na zádech, protože ráno má jít na snídani v polosedu, a nahlásím to sestře až na konci směny.",isBest:!1,scoreDelta:0,feedback:"Polosed na zádech zvyšuje tlak i střižnou sílu na křížovou kost a odklad hlášení vede k rozvoji II.–III. stupně během hodin."}],oralExamModelAnswer:["Identifikace stavu: neblednoucí zarudnutí neporušené kůže nad kostním výběžkem = dekubit I. stupně.","Okamžitá akce PSS: odlehčit tlak (přepolohovat do 30° boční polohy), zkontrolovat suché a vyhlazené lůžko, v žádném případě kůži nemasírovat ani nedrhnout!","Kompetence: okamžitě hlásit zdravotní sestře, která zhodnotí stav a případně aplikuje ochranné krytí či aktualizuje škálu Nortonové."],keyTakeaway:"Neblednoucí zarudnutí = I. stupeň dekubitu → odlehčit, nemasírovat, hned hlásit sestře."},{id:"sc-hypoglykemie",moduleId:"prvni-pomoc",title:"Diabetik pan Novák je najednou zpocený, třese se a mluví z cesty",clientProfile:"Pan Novák (74 let), léčí se s diabetem na inzulinu, ráno jedl velmi málo.",situation:"V 10:15 přijdete na pokoj a vidíte, že pan Novák sedí na židli, je bledý, na čele má studený pot, třesou se mu ruce a zmateně opakuje nesouvislá slova. Stále je při vědomí a komunikuje.",choices:[{id:"a",text:"Vytáhnu jeho inzulinové pero ze šuplíku a píchnu mu dávku, protože cukrovkáři potřebují inzulin.",isBest:!1,scoreDelta:0,feedback:"Život ohrožující chyba! Jedná se o příznaky HYPOGLYKÉMIE (málo cukru). Podání inzulinu by srazilo cukr ještě níž a zabilo ho – navíc PSS nesmí nikdy píchat inzulin!"},{id:"b",text:"Poznám podezření na hypoglykémii. Protože je při vědomí a polyká, okamžitě mu podám rychlý cukr (sladký čaj, džus, kostku cukru nebo hroznový cukr) a současně ihned zavolám zdravotní sestru.",isBest:!0,scoreDelta:10,feedback:"Skvělá reakce! Studený pot, třes, bledost a náhlá zmatenost po jídle/inzulinu jsou klasickými znaky hypoglykémie. Rychlý cukr při vědomí zachraňuje život a sestra okamžitě změří glykémii."},{id:"c",text:"Uložím ho spát do postele a podám mu neslazenou minerálku, že si jen potřebuje odpočinout.",isBest:!1,scoreDelta:0,feedback:"Bez doplnění cukru se stav během minut zhorší v hypoglykemické bezvědomí a křeče."}],oralExamModelAnswer:["Rozlišení: studený pot, třes, slabost a náhlá zmatenost u diabetika = akutní hypoglykémie (pokles cukru pod 3,9 mmol/l).","První pomoc při vědomí: ihned podat rychlé cukry ústy (slazený nápoj, džus, glukózový bonbon), nenechávat klienta samotného a přivolat zdravotní sestru k přeměření glykémie.","Kdyby byl v bezvědomí: nic do úst nelít, volat 155 a uložit na bok (zotavovací poloha)."],keyTakeaway:"Studený pot + třes u diabetika = hypoglykémie → při vědomí sladký nápoj a volat sestru."},{id:"sc-duseni-obed",moduleId:"prvni-pomoc",title:"Klientka se při obědě chytla za krk a nemůže se nadechnout",clientProfile:"Paní Božena (81 let), jí maso na kousky v jídelně.",situation:"U oběda najednou paní Božena vstane od stolu, chytne se oběma rukama za hrdlo, tvář jí rudne až modrá, nevydává žádný zvuk, nemůže zakašlat ani mluvit.",choices:[{id:"a",text:"Rychle jí podám sklenici vody, aby sousto zapila a spláchla do žaludku.",isBest:!1,scoreDelta:0,feedback:"Nebezpečné! Voda při ucpaných dýchacích cestách nezaplaví jícen, ale zhorší dušení a vede k vdechnutí tekutiny."},{id:"b",text:"Jde o těžké dušení (tichá obstrukce). Okamžitě ji předkloním, dám až 5 rázných úderů mezi lopatky; pokud sousto nevypadne, provedu až 5× Heimlichův manévr (stlačení nadbřišku) a střídám 5:5. Kolega mezitím volá sestru / 155.",isBest:!0,scoreDelta:10,feedback:"Perfektní! Tiché dušení bez kašle znamená úplnou obstrukci dýchacích cest – vyžaduje okamžité střídání 5 úderů mezi lopatky a 5 břišních stlačení."},{id:"c",text:"Posadím ji a jemně ji hladím po zádech, ať si zkusí v klidu odkašlat.",isBest:!1,scoreDelta:0,feedback:"Pokud nemůže mluvit ani kašlat, neúčinný kašel těleso nevypudí – do 2–3 minut upadne do bezvědomí z nedostatku kyslíku."}],oralExamModelAnswer:["Posouzení závažnosti: dokud klient účinně kašle, pouze ho ke kašli povzbuzujeme. Zde však nemůže mluvit, kašlat ani dýchat (těžká obstrukce).","Zásah: předklonit a 5× rázně udeřit hranou dlaně mezi lopatky → při neúspěchu 5× Heimlichův manévr (pěst nad pupek pod hrudní kost, tlak dovnitř a nahoru) → střídat 5:5.","Při ztrátě vědomí: opatrně položit na zem, volat 155 a zahájit KPR (30:2). Po úspěšném Heimlichu zajistit lékařskou kontrolu."],keyTakeaway:"Nemůže kašlat ani mluvit = 5 úderů mezi lopatky + 5× Heimlichův manévr."},{id:"sc-dar-penize",moduleId:"standardy-prava",title:"Dcera klientky vám dává v obálce „přilepšení k výplatě“",clientProfile:"Dcera paní Aleny (89 let), která je na oddělení velmi náročná.",situation:"Na konci návštěvy za vámi na chodbu vyjde dcera paní Aleny, rozhlédne se a strká vám do kapsy obálku se slovy: „Vezměte si ty dva tisíce na kávu, jste na maminku tak hodná, tak abych měla jistotu, že ji budete dávat k oknu přednostně.“",choices:[{id:"a",text:"Obálku přijmu a poděkuji, abych dceru neurazila, a peníze pak dám do společné kasy na oddělení na cukroví.",isBest:!1,scoreDelta:0,feedback:"Přijetí peněz od rodiny je hrubým porušením Etického kodexu a Standardu č. 2 (střet zájmů, zvýhodňování jednoho klienta na úkor ostatních)."},{id:"b",text:"Slušně, ale jasně a s úsměvem odmítnu: „Moc si vážím vaší spokojenosti s naší péčí, ale ze zákona a vnitřních pravidel nesmím přijímat žádné peníze ani cenné dary. O maminku pečujeme se stejnou péčí bez ohledu na dary.“ Situaci nahlásím vedoucí.",isBest:!0,scoreDelta:10,feedback:"Profesionální asertivní reakce! Chránila jste rovnost všech klientů, vyhnula se střetu zájmů a zachovala milý, ale pevný vztah s rodinou."},{id:"c",text:"Odmítnu s výčitkou: „To si snad děláte legraci, chcete mě dostat do kárného řízení?!“",isBest:!1,scoreDelta:2,feedback:"Odmítnutí je sice správné věcně, ale útočný tón zbytečně zničí spolupráci s rodinou, která mohla dar myslet ze zvyku či vděčnosti."}],oralExamModelAnswer:["Jde o střet zájmů a etické dilema (Standard č. 2 – Ochrana práv osob a Etický kodex PSS).","Peněžní dary ani hodnotné dary pracovník nesmí přijímat, zvlášť jsou-li spojené s žádostí o přednostní zacházení.","Reakce: zdvořilé a pevné odmítnutí s vysvětlením pravidel organizace, ujištění o kvalitní péči pro všechny stejně a zápis/informování nadřízeného."],keyTakeaway:"Peníze a dary od klientů či rodiny zdvořile odmítáme – chráníme rovnost a vlastní integritu."},{id:"sc-omezeni-89",moduleId:"standardy-prava",title:"Kolegyně navrhuje na noční směně přivázat neklidnému pánovi ruce",clientProfile:"Pan František (83 let), po operaci, v noci si opakovaně strhává plenkové kalhotky a křičí.",situation:"Kolegyně v 01:30 už je vyčerpaná a říká vám: „Pojď, uvážeme mu obě ruce obinadlem k postranicím a zvedneme obě bočnice, jinak se z něj do rána zblázníme a ještě vyleze z postele.“",choices:[{id:"a",text:"Pomohu jí, protože na noční směně jsme jen dvě a nemůžeme u něj sedět celou noc.",isBest:!1,scoreDelta:0,feedback:"Těžké porušení § 89 zákona č. 108/2006 Sb. i trestní odpovědnosti! Mechanické přivazování z pohodlnosti personálu je nelegální a může klienta uškrtit nebo mu způsobit těžká poranění."},{id:"b",text:"Kategoricky odmítnu, vysvětlím kolegyni, že jde o zakázané omezení pohybu (§ 89). Společně zkontrolujeme příčinu neklidu (bolest, plný měchýř, žízeň, opruzenina), zklidníme pana Františka slovně, snížíme lůžko co nejníže a případně přivoláme zdravotní sestru.",isBest:!0,scoreDelta:10,feedback:"Výborně! Ochranila jste lidská práva i zdraví klienta, správně uplatnila § 89 a zaměřila se na hledání skutečné příčiny nočního neklidu ve spolupráci se sestrou."},{id:"c",text:"Navrhnu dát mu z naší příruční lékárničky dva prášky na spaní bez vědomí lékaře, aby usnul.",isBest:!1,scoreDelta:0,feedback:"Podání tlumících léků bez ordinace lékaře je jednak nekompetentní zásah (PSS nesmí podávat léky) a jednak nelegální chemické omezení dle § 89."}],oralExamModelAnswer:["Citace § 89 zákona č. 108/2006 Sb.: opatření omezující pohyb osob jsou ZAKÁZÁNA kromě přímého ohrožení života a zdraví.","Vázání obinadlem pro klid personálu je nepřípustné. Hierarchie dle § 89 zná jen fyzický úchop, bezpečnou místnost a léky ordinované a podané za přítomnosti lékaře.","Postup: zjistit tělesnou příčinu neklidu (bolest, retence moči, zácpa, delirium), slovně zklidnit, zajistit bezpečné snížené lůžko a konzultovat zdravotní sestru."],keyTakeaway:"Pohodlí služby nikdy neospravedlní omezení pohybu (§ 89) – vždy hledejte příčinu neklidu."},{id:"sc-adaptace-smutek",moduleId:"aktivizace-paliativa",title:"Nová klientka celý týden pláče a odmítá chodit do jídelny",clientProfile:"Paní Helena (78 let), po smrti manžela nastoupila do domova před 10 dny.",situation:"Paní Helena sedí na okraji postele, dívá se z okna a tiše pláče: „Já tady nikoho neznám, nechci mezi lidi. Celý život jsem měla vlastní kuchyň a teď mi všechno vzali.“",choices:[{id:"a",text:"Veselým hlasem ji povzbudím: „Ale paní Heleno, neplačte, vždyť tu máte krásný čistý pokoj a vařit nemusíte! Musíte hned dolů do jídelny, jinak si nikdy nezvyknete.“",isBest:!1,scoreDelta:1,feedback:"Bagatelizování smutku („neplačte, máte to tu hezké“) a nucení do společnosti v akutní adaptační krizi prohlubuje pocit osamělosti a nepochopení."},{id:"b",text:"Sednu si na chvíli k ní, naslouchám a uznám její ztrátu: „Je to pro vás velká změna a po domově i manželovi se vám moc stýská.“ Nabídnu, že jídlo jí dnes můžeme donést na pokoj, a postupně se zeptám, co by jí v pokoji pomohlo cítit se lépe (fotky, oblíbený hrnek).",isBest:!0,scoreDelta:10,feedback:"Krásná empatická reakce a krizová intervence v adaptační fázi! Uznání práva na smutek, nenásilné tempo a postupné budování bezpečí přes vlastní známé věci z domova."},{id:"c",text:"Nechám ji být a rychle odejdu, ať má soukromí a vybrečí se sama.",isBest:!1,scoreDelta:2,feedback:"Úplné stažení bez krátkého lidského kontaktu může v klientce vyvolat pocit, že je všem lhostejná."}],oralExamModelAnswer:["Jde o normální reakci na ztrátu domova a partnera v tzv. adaptačním období.","První pomoc: empatie bez bagatelizace, aktivní naslouchání, přijetí smutku a postupné seznamování s novým prostředím bez nátlaku.","Zapojení klíčového pracovníka: úprava pokoje vlastními předměty, postupné pozvání např. jen k jedné sympatické spolubydlící a spolupráce s rodinou."],keyTakeaway:"Nový klient má právo truchlit za ztrátu domova – nenuťte ho hned „být veselý“."},{id:"sc-knofliky-sobestacnost",moduleId:"aktivizace-paliativa",title:"Klientka si po mrtvici zapíná svetr velmi pomalu a čeká další pokoj",clientProfile:"Paní Libuše (76 let), pravostranné oslabení po CMP, trénuje jemnou motoriku.",situation:"Ráno pomáháte paní Libuši s oblékáním. Trvá jí 5 minut, než levou rukou zapne tři knoflíky, je soustředěná a viditelně se snaží. Na chodbě už čekají další tři pokoje na snídani.",choices:[{id:"a",text:"Řeknu: „Paní Libuško, já vám to radši zapnu hned, za chvíli vezou čaj,“ a rychle ji obléknu sama.",isBest:!1,scoreDelta:0,feedback:"Tímto způsobem sice ušetříte 3 minuty, ale podporujete vznik závislosti na službě a „naučené bezmocnosti“. Klientka ztrácí motivaci i jemnou motoriku."},{id:"b",text:"Podpořím její samostatnost – pochválím ji za trpělivost, případně pomůžu jen se zapnutím horního knoflíku u krku, kde nevidí, a do příště si na ni naplánuji o pár minut dřívější začátek nebo probereme s rodinou svetr na zip či suchý zip.",isBest:!0,scoreDelta:10,feedback:"Učebnicová prevence závislosti na službě (§ 2 zákona 108/2006)! Zapojíte klientku podle jejích možností, dopomůžete jen s nepřístupnou částí a organizačně upravíte čas či kompenzační oblečení."},{id:"c",text:"Nechám ji v pyžamu bez snídaně, dokud si svetr nezapne celý sama.",isBest:!1,scoreDelta:0,feedback:"Rigidní přístup bez přiměřené pomoci by vedl ke frustraci a hladu."}],oralExamModelAnswer:["Zásada prevence vzniku závislosti na sociální službě (§ 2 zákona č. 108/2006 Sb.): nedělat za klienta to, co zvládne sám.","Přiměřená podpora: dát čas, ocenit snahu, podat jen částečnou pomoc (horní knoflík) a do individuálního plánu navrhnout ergonomické oblečení či úpravu časového harmonogramu."],keyTakeaway:"Spěch personálu vytváří závislost klienta – pomáhejte jen tam, kde to klient opravdu nezvládne."},{id:"sc-ean-podezreni",moduleId:"standardy-prava",title:"Podezření na finanční zneužívání a modřiny po víkendové návštěvě syna",clientProfile:"Pan Jaroslav (85 let), mírná demence, jinak bez sklonu k pádům.",situation:"Syn si pana Jaroslava bere každou první sobotu v měsíci (po výplatě důchodu) na pár hodin domů. Posledně se pan Jaroslav vrátil zamlklý, bez kapesného na kávu, s novou tmavou modřinou na vnitřní straně nadloktí (tvar otisku prstů) a šeptal: „Nikomu nic neříkejte, on by se zlobil.“",choices:[{id:"a",text:"Nezasahuji do rodinných záležitostí – co se děje mimo domov pro seniory u syna, to není moje věc.",isBest:!1,scoreDelta:0,feedback:"Závažné pochybení! Modřiny v neobvyklých místech (vnitřní strana paží), strach a mizející peníze po výplatě důchodu jsou jasné varovné znaky syndromu EAN (týrání a zneužívání seniorů)."},{id:"b",text:"Klientovi zajistím bezpečí a citlivě si ho vyslechnu bez nátlaku. Nález ihned zdokumentuji, nahlásím zdravotní sestře (ošetření a popis poranění) a vedoucímu sociální služby / sociální pracovnici k prošetření podle Standardu č. 2.",isBest:!0,scoreDelta:10,feedback:"Správně! Pracovník v sociálních službách má povinnost chránit klienta před týráním, zanedbáváním a zneužíváním (EAN). Zajištění lékařského/sesterského záznamu a předání vedení je nezbytný zákonný krok."},{id:"c",text:"Při příští návštěvě si syna sama odchytím na chodbě a vyřvu si to s ním, aby ho to přešlo.",isBest:!1,scoreDelta:1,feedback:"Neprofesionální konfrontace bez důkazního záznamu a zapojení vedení může ohrozit samotného seniora (syn si ho může vzít domů natrvalo nebo mu vyhrožovat)."}],oralExamModelAnswer:["Identifikace rizika: syndrom EAN (Elder Abuse and Neglect) – podezření na kombinaci fyzického týrání (charakteristické otisky prstů na vnitřní straně paží), psychického zastrašování a finančního zneužívání.","Povinnost PSS dle Standardu č. 2 (Ochrana práv osob): citlivá komunikace s klientem, nezamlčovat nález, okamžité hlášení sestře (dokumentace poranění) a vedení / sociálnímu pracovníkovi (krizový tým, OSPOD/opatrovnictví/policie dle závažnosti)."],keyTakeaway:"Modřiny na vnitřní straně paží + strach + chybějící peníze = podezření na EAN → vždy dokumentovat a hlásit vedení."},{id:"sc-umirajici-komfort",moduleId:"aktivizace-paliativa",title:"Péče o umírající klientku v posledních hodinách života",clientProfile:"Paní Marta (92 let), v terminálním stadiu srdečního selhávání, nereaguje na oslovení, dýchá mělce s pauzami.",situation:"Jste v pokoji paní Marty během odpolední směny. Rty má úplně suché a popraskané, v rohu pokoje tiše sedí její uplakaná dcera a neví, zda na maminku může mluvit nebo ji držet za ruku.",choices:[{id:"a",text:"Požádám dceru, ať jde na chodbu, abych mohla maminku rychle převléct a udělat velkou koupel.",isBest:!1,scoreDelta:0,feedback:"V posledních hodinách života nevysilujeme umírajícího zbytečnou zátěží ani neoddělujeme rodinu! Blízkost milovaných je nenahraditelná."},{id:"b",text:"Zachovám klidné, důstojné ticho a přítmí. Paní Martě jemně zvlhčím rty a ústa (např. štětičkou s vodou/boraxglycerinem), oslovím ji jménem a dceru laskavě ujistím, že sluch a dotek vnímá člověk nejdéle – může ji držet za ruku a tiše jí říkat, co cítí.",isBest:!0,scoreDelta:10,feedback:"Hluboce lidská a odborně perfektní paliativní péče! Udržování vlhkosti rtů je klíčovým komfortním úkonem a podpora rodiny u lůžka pomáhá oběma stranám."},{id:"c",text:"Řeknu dceři: „Už vás neslyší, je v bezvědomí, běžte se raději domů vyspat.“",isBest:!1,scoreDelta:0,feedback:"Sluch zůstává zachován velmi dlouho i u hluboce utlumených pacientů. Oddělit rodinu na základě mylného tvrzení je odborně i eticky špatně."}],oralExamModelAnswer:["Cíl paliativní péče: úleva od strádání (žádné invazivní nebo vysilující úkony navíc), zachování důstojnosti a přítomnosti blízkých.","Péče o komfort: jemná péče o dutinu ústní a rty, šetrná poloha ulevující dýchání, klidné prostředí, vlídné oslovování (sluch je poslední smysl!).","Práce s rodinou: nabídnout židli, čaj, soukromí a povzbudit rodinu k doteku a mluvení."],keyTakeaway:"U umírajícího nevysilovat, zvlhčovat rty, mluvit klidně (sluch zůstává nejdéle) a podpořit přítomnost rodiny."}],Be=[{id:"legislativa",order:1,title:"Legislativa, zákon č. 108/2006 Sb. a Domov pro seniory",shortTitle:"Legislativa & 108/2006",subtitle:"Základní zákon, formy služeb, příspěvek na péči 2026, úhrady a kvalifikace PSS",estimatedMinutes:20,accentColor:"teal",badgeText:"Okruh 1 · Zákonný základ",overview:"Tento okruh je páteří celé písemné i ústní zkoušky. Musíte bezpečně ovládat zákon č. 108/2006 Sb., o sociálních službách, a prováděcí vyhlášku č. 505/2006 Sb., znát přesná čísla (2026), druhy a formy služeb, příspěvek na péči a své zákonné povinnosti jako pracovník v sociálních službách (PSS).",sections:[{id:"leg-zakon-zasady",title:"1.1 Zákon č. 108/2006 Sb. – základní zásady (§ 2) a formy služeb",summary:"Zákon o sociálních službách vstoupil v účinnost 1. 1. 2007 a upravuje podmínky pomoci lidem v nepříznivé sociální situaci.",keyPoints:["Zásada lidské důstojnosti (§ 2): Rozsah a forma pomoci a podpory musí zachovávat lidskou důstojnost osob, vycházet z individuálně určených potřeb a podporovat rozvoj jejich samostatnosti a soběstačnosti.","Sociální služby se poskytují v zájmu osob a v náležité kvalitě takovými způsoby, které vždy důsledně zajišťují dodržování lidských práv a základních svobod.","Bezplatné základní sociální poradenství: Každá osoba má zákonný nárok na bezplatné poskytnutí základního sociálního poradenství o možnostech řešení nepříznivé sociální situace – musí ho poskytnout každý poskytovatel.","3 formy sociálních služeb (§ 33): Pobytové (např. domov pro seniory – s ubytováním), Ambulantní (klient dochází, např. denní stacionář) a Terénní (služba jde za klientem domů, např. pečovatelská služba, osobní asistence).","3 druhy sociálních služeb: 1. Sociální poradenství, 2. Služby sociální péče (sem patří Domov pro seniory!), 3. Služby sociální prevence."],mnemonic:"3 formy = P-A-T (Pobytová, Ambulantní, Terénní). Domov pro seniory je Pobytová služba sociální PÉČE."},{id:"leg-ds-vs-dzr",title:"1.2 Domov pro seniory (§ 49) a 8 základních činností (§ 15 vyhl. 505/2006)",summary:"Zkoušející často chtějí přesně rozlišit Domov pro seniory (§ 49) od Domova se zvláštním režimem (§ 50) a od Pečovatelské služby (§ 40).",keyPoints:["Domov pro seniory (§ 49): Pobytová služba pro osoby, které dosáhly věku rozhodného pro přiznání starobního důchodu a mají sníženou soběstačnost zejména z důvodu věku, jejichž situace vyžaduje pravidelnou pomoc jiné fyzické osoby.","Domov se zvláštním režimem (§ 50): Pobytová služba s upraveným režimem pro osoby se sníženou soběstačností z důvodu chronického duševního onemocnění, závislosti na návykových látkách nebo stařecké, Alzheimerovy či jiných typů demence.","8 základních činností v Domově pro seniory (§ 15 vyhlášky č. 505/2006 Sb.): 1. Poskytnutí ubytování (včetně úklidu, praní, drobných oprav prádla a žehlení), 2. Poskytnutí stravy (celodenní, min. 3 hlavní jídla), 3. Pomoc při zvládání běžných úkonů péče o vlastní osobu, 4. Pomoc při osobní hygieně (včetně péče o vlasy a nehty, WC), 5. Zprostředkování kontaktu se společenským prostředím, 6. Sociálně terapeutické činnosti, 7. Aktivizační činnosti, 8. Pomoc při uplatňování práv, oprávněných zájmů a při obstarávání osobních záležitostí."],practicalTip:"Pozor na drobnou, ale častou zkouškovou otázku: v Domově pro seniory je úklid, praní, drobné opravy prádla a žehlení součástí položky „poskytnutí ubytování“ (nikoliv samostatně placená pečovatelská služba)."},{id:"leg-pnp-2026",title:"1.3 10 základních životních potřeb (§ 9) a Příspěvek na péči (2026)",summary:"Příspěvek na péči je určen přímo osobě (nikoliv zařízení) na nákup potřebné péče. V domově pro seniory však příspěvek náleží zařízení na úhradu péče.",keyPoints:["10 základních životních potřeb (§ 9): 1. Mobilita, 2. Orientace, 3. Komunikace, 4. Stravování, 5. Oblékání a obouvání, 6. Tělesná hygiena, 7. Výkon fyziologické potřeby, 8. Péče o zdr
